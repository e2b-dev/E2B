[project]
name = "e2b_id"
version = "0.1.0"
description = "Prefixed, human-legible IDs for E2B resources"
authors = [{ name = "e2b", email = "hello@e2b.dev" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
# Standard library only, on purpose: an ID codec that every service and script
# depends on should never be the reason a dependency resolution fails.
dependencies = []

[project.urls]
Homepage = "https://e2b.dev/"
Repository = "https://github.com/e2b-dev/e2b/tree/main/packages/python-id"
"Bug Tracker" = "https://github.com/e2b-dev/e2b/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.11.12,<0.12",
    "ty>=0.0.15,<0.0.16",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["e2b_id"]
module-root = ""
