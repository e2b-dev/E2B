[project]
name = "e2b-acp"
version = "0.0.0"
description = "Run Agent Client Protocol (ACP) agents in E2B sandboxes"
authors = [{ name = "e2b", email = "hello@e2b.dev" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "e2b>=2.56.0,<3.0.0",
    "agent-client-protocol>=0.12.1,<0.13",
]

[project.urls]
Homepage = "https://e2b.dev/docs/agents/acp?utm_source=pypi&utm_medium=referral&utm_campaign=package_homepage&utm_content=e2b-acp"
Repository = "https://github.com/e2b-dev/e2b/tree/main/packages/acp-python"
"Bug Tracker" = "https://github.com/e2b-dev/e2b/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "python-dotenv>=1.0.0,<2",
    "pytest-dotenv>=0.5.2,<0.6",
    "pytest-asyncio>=1.3.0,<2",
    "ruff>=0.11.12,<0.12",
    "ty>=0.0.15,<0.0.16",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["e2b_acp"]
module-root = ""

[tool.uv.sources]
e2b = { workspace = true }

[tool.uv.workspace]
members = ["../python-sdk"]
