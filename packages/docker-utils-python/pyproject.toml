[project]
name = "e2b-docker-utils"
version = "0.0.0"
description = "E2B Docker utils - Dockerfile parser and shell lexer ported from BuildKit"
authors = [{ name = "e2b", email = "hello@e2b.dev" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://e2b.dev/?utm_source=pypi&utm_medium=referral&utm_campaign=package_homepage&utm_content=e2b-docker-utils"
Repository = "https://github.com/e2b-dev/e2b/tree/main/packages/docker-utils-python"
"Bug Tracker" = "https://github.com/e2b-dev/e2b/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.11.12,<0.12",
    "ty>=0.0.15,<0.0.16",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["e2b_docker_utils"]
module-root = ""
