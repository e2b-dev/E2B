# content of pytest.ini
[pytest]
markers =
    skip_debug: skip test if E2B_DEBUG is set.
    e2e: test needs live infrastructure (sandboxes, template builds) and credentials; excluded by default, run with `-m e2e`.

asyncio_mode=auto
asyncio_default_fixture_loop_scope=session
asyncio_default_test_loop_scope=session
# The default tier is fully mocked: the e2e marker (see tests/conftest.py) is
# excluded unless the run asks for it with `-m e2e`, which overrides this.
addopts = --import-mode=importlib -m "not e2e"
# Makes shared test helpers (e.g. envd_frame_server) importable under importlib mode.
pythonpath = tests
timeout = 30
filterwarnings =
    ignore:'asyncio\.iscoroutinefunction' is deprecated.*:DeprecationWarning:pytest_asyncio\.plugin
    ignore:'asyncio\.get_event_loop_policy' is deprecated.*:DeprecationWarning:pytest_asyncio\.plugin
