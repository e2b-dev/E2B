          items:
            type: string
          nullable: true
          description: Template names related to this build, if available.
        createdAt:
          type: string
          format: date-time
          description: Build creation timestamp in RFC3339 format.
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: Build completion timestamp in RFC3339 format, if finished.
        status:
          $ref: "#/components/schemas/BuildStatus"
        statusMessage:
          type: string
          nullable: true
          description: Failure message when status is `failed`, otherwise `null`.

    TemplateRequestResponseV3:
      required:
        - templateID
        - buildID
        - public
        - aliases
        - names
        - tags
      properties:
        templateID:
          type: string
          description: Identifier of the template
        buildID:
          type: string
          description: Identifier of the last successful build for given template
        public:
          type: boolean
          description: Whether the template is public or only accessible by the team
        names:
          type: array
          description: Names of the template
          items:
            type: string
        tags:
          type: array
          description: Tags assigned to the template build
          items:
            type: string
        aliases:
          type: array
          description: Aliases of the template
          deprecated: true
          items:
            type: string

    TemplateBuild:
      required:
        - buildID
        - status
        - createdAt
        - updatedAt
        - cpuCount
        - memoryMB
      properties:
        buildID:
          type: string
          format: uuid
          description: Identifier of the build
        status:
          $ref: "#/components/schemas/TemplateBuildStatus"
        createdAt:
          type: string
          format: date-time
          description: Time when the build was created
        updatedAt:
          type: string
          format: date-time
          description: Time when the build was last updated
        finishedAt:
          type: string
          format: date-time
          description: Time when the build was finished
        cpuCount:
          $ref: "#/components/schemas/CPUCount"
        maxCpuCount:
          allOf:
            - $ref: "#/components/schemas/CPUCount"
          description: "Maximum CPU count for resizable templates; absent for fixed-size templates."
        memoryMB:
          $ref: "#/components/schemas/MemoryMB"
        diskSizeMB:
          $ref: "#/components/schemas/DiskSizeMB"
        envdVersion:
          $ref: "#/components/schemas/EnvdVersion"

    TemplateWithBuilds:
      allOf:
        - $ref: "#/components/schemas/Template"
        - type: object
          required:
            - builds
          properties:
            builds:
              type: array
              description: List of builds for the template
              items:
                $ref: "#/components/schemas/TemplateBuild"

    TemplateAliasResponse:
      required:
        - templateID
        - public
      properties:
        templateID:
          type: string
          description: Identifier of the template
        public:
          type: boolean
          description: Whether the template is public or only accessible by the team

    TemplateStep:
      description: Step in the template build process
      required:
        - type
      properties:
        type:
          type: string
          description: Type of the step
        args:
          default: []
          type: array
          description: Arguments for the step
          items:
            type: string
        filesHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Hash of the files used in the step (lowercase hex SHA-256)
        force:
          default: false
          type: boolean
          description: Whether the step should be forced to run regardless of the cache

    TemplateBuildRequestV3:
      properties:
        name:
          description: Name of the template. Can include a tag with colon separator (e.g. "my-template" or "my-template:v1"). If tag is included, it will be treated as if the tag was provided in the tags array.
          type: string
          maxLength: 128
        tags:
          type: array
          description: Tags to assign to the template build
          items:
            type: string
        alias:
          description: Alias of the template. Deprecated, use name instead.
          type: string
          maxLength: 128
          deprecated: true
        teamID:
          deprecated: true
          type: string
          description: Identifier of the team, as its UUID or its public project ID (prj_)
        cpuCount:
          $ref: "#/components/schemas/CPUCount"
        maxCpuCount:
          allOf:
            - $ref: "#/components/schemas/CPUCount"
          description: "Maximum CPU count the template's sandboxes can be resized to; makes the template resizable. Must be at least cpuCount."
        memoryMB:
          $ref: "#/components/schemas/MemoryMB"
        minFreeDiskMb:
          $ref: "#/components/schemas/MinFreeDiskMb"

    FromImageRegistry:
      oneOf:
        - $ref: "#/components/schemas/AWSRegistry"
        - $ref: "#/components/schemas/GCPRegistry"
        - $ref: "#/components/schemas/GeneralRegistry"
      discriminator:
        propertyName: type
        mapping:
          aws: "#/components/schemas/AWSRegistry"
          gcp: "#/components/schemas/GCPRegistry"
          registry: "#/components/schemas/GeneralRegistry"

    AWSRegistry:
      type: object
      required:
        - type
        - awsAccessKeyId
        - awsSecretAccessKey
        - awsRegion
      properties:
        type:
          type: string
          enum: [aws]
          description: Type of registry authentication
        awsAccessKeyId:
          type: string
          description: AWS Access Key ID for ECR authentication
        awsSecretAccessKey:
          type: string
          description: AWS Secret Access Key for ECR authentication
        awsRegion:
          type: string
          description: AWS Region where the ECR registry is located

    GCPRegistry:
      type: object
      required:
        - type
        - serviceAccountJson
      properties:
        type:
          type: string
          enum: [gcp]
          description: Type of registry authentication
        serviceAccountJson:
          type: string
          description: Service Account JSON for GCP authentication

    GeneralRegistry:
      type: object
      required:
        - type
        - username
        - password
      properties:
        type:
          type: string
          enum: [registry]
          description: Type of registry authentication
        username:
          type: string
          description: Username to use for the registry
        password:
          type: string
          description: Password to use for the registry

    TemplateBuildStartV2:
      type: object
      description: Exactly one of fromImage or fromTemplate must be given and non-empty.
      properties:
        fromImage:
          type: string
          minLength: 1
          description: Image to use as a base for the template build
        fromTemplate:
          type: string
          minLength: 1
          description: Template to use as a base for the template build
        fromImageRegistry:
          $ref: "#/components/schemas/FromImageRegistry"
        force:
          default: false
          type: boolean
          description: Whether the whole build should be forced to run regardless of the cache
        steps:
          default: []
          description: List of steps to execute in the template build
          type: array
          items:
            $ref: "#/components/schemas/TemplateStep"
        startCmd:
          description: Start command to execute in the template after the build
          type: string
        readyCmd:
          description: Ready check command to execute in the template after the build
          type: string

    TemplateBuildFileUpload:
      required:
        - present
      properties:
        present:
          type: boolean
          description: Whether the file is already present in the cache
        url:
          description: Url where the file should be uploaded to
          type: string
        headers:
          description: Request headers that must be sent with the upload request
          type: object
          additionalProperties:
            type: string

    LogLevel:
      type: string
      description: State of the sandbox
      enum:
        - debug
        - info
        - warn
        - error

    BuildLogEntry:
      required:
        - timestamp
        - message
        - level
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the log entry
        message:
          type: string
          description: Log message content
        level:
          $ref: "#/components/schemas/LogLevel"
        step:
          type: string
          description: Step in the build process related to the log entry

    BuildStatusReason:
      required:
        - message
      properties:
        message:
          type: string
          description: Message with the status reason, currently reporting only for error status
        step:
          type: string
          description: Step that failed
        logEntries:
          default: []
          description: Log entries related to the status reason
          type: array
          items:
            $ref: "#/components/schemas/BuildLogEntry"

    TemplateBuildStatus:
      type: string
      description: Status of the template build
      enum:
        - building
        - waiting
        - ready
        - error

    TemplateBuildInfo:
      required:
        - templateID
        - buildID
        - status
        - logs
        - logEntries
      properties:
        logs:
          default: []
          deprecated: true
          description: Build logs (always empty since the V1 build path was removed, use logEntries)
          type: array
          items:
            type: string
        logEntries:
          default: []
          description: Build logs structured
          type: array
          items:
            $ref: "#/components/schemas/BuildLogEntry"
        templateID:
          type: string
          description: Identifier of the template
        buildID:
          type: string
          description: Identifier of the build
        status:
          $ref: "#/components/schemas/TemplateBuildStatus"
        reason:
          $ref: "#/components/schemas/BuildStatusReason"

    TemplateBuildLogsResponse:
      required:
        - logs
      properties:
        logs:
          default: []
          description: Build logs structured
          type: array
          items:
            $ref: "#/components/schemas/BuildLogEntry"

    LogsDirection:
      type: string
      description: Direction of the logs that should be returned
      enum:
        - forward
        - backward
      x-enum-varnames:
        - LogsDirectionForward
        - LogsDirectionBackward

    LogsSource:
      type: string
      description: Source of the logs that should be returned
      enum:
        - temporary
        - persistent
      x-enum-varnames:
        - LogsSourceTemporary
        - LogsSourcePersistent

    NodeStatus:
      type: string
      description: |
        Status of the node.
        - standby: the node is not actively used, but it can return to ready and continue serving traffic.
        - not_ready: the node is starting and cannot take new work yet. It becomes ready by itself and cannot be set through the API.
      enum:
        - ready
        - draining
        - connecting
        - unhealthy
        - standby
        - shutting_down
        - not_ready
      x-enum-varnames:
        - NodeStatusReady
        - NodeStatusDraining
        - NodeStatusConnecting
        - NodeStatusUnhealthy
        - NodeStatusStandby
        - NodeStatusShuttingDown
        - NodeStatusNotReady

    NodeStatusChange:
      required:
        - status
      properties:
        clusterID:
          type: string
          format: uuid
          description: Identifier of the cluster
        status:
          $ref: "#/components/schemas/NodeStatus"

    DiskMetrics:
      required:
        - mountPoint
        - device
        - filesystemType
        - usedBytes
        - totalBytes
      properties:
        mountPoint:
          type: string
          description: Mount point of the disk
        device:
          type: string
          description: Device name
        filesystemType:
          type: string
          description: Filesystem type (e.g., ext4, xfs)
        usedBytes:
          type: integer
          format: uint64
          description: Used space in bytes
        totalBytes:
          type: integer
          format: uint64
          description: Total space in bytes

    NodeMetrics:
      description: Node metrics
      required:
        - allocatedCPU
        - allocatedMemoryBytes
        - cpuPercent
        - memoryUsedBytes
        - cpuCount
        - memoryTotalBytes
        - disks
        - hugePagesTotal
        - hugePagesUsed
        - hugePagesReserved
        - hugePageSizeBytes
      properties:
        allocatedCPU:
          type: integer
          format: uint32
          description: Number of allocated CPU cores
        cpuPercent:
          type: integer
          format: uint32
          description: Node CPU usage percentage
        cpuCount:
          type: integer
          format: uint32
          description: Total number of CPU cores on the node
        allocatedMemoryBytes:
          type: integer
          format: uint64
          description: Amount of allocated memory in bytes
        memoryUsedBytes:
          type: integer
          format: uint64
          description: Node memory used in bytes
        memoryTotalBytes:
          type: integer
          format: uint64
          description: Total node memory in bytes
        hugePagesTotal:
          type: integer
          format: uint64
          description: Total number of preallocated hugepages on the node
        hugePagesUsed:
          type: integer
          format: uint64
          description: Number of hugepages in use (total - free)
        hugePagesReserved:
          type: integer
          format: uint64
          description: Number of reserved hugepages (committed but not yet faulted)
        hugePageSizeBytes:
          type: integer
          format: uint64
          description: Size of a single hugepage in bytes
        disks:
          type: array
          description: Detailed metrics for each disk/mount point
          items:
            $ref: "#/components/schemas/DiskMetrics"
    MachineInfo:
      required:
        - cpuFamily
        - cpuModel
        - cpuModelName
        - cpuArchitecture
      properties:
        cpuFamily:
          type: string
          description: CPU family of the node
        cpuModel:
          type: string
          description: CPU model of the node
        cpuModelName:
          type: string
          description: CPU model name of the node
        cpuArchitecture:
          type: string
          description: CPU architecture of the node

    Node:
      required:
        - id
        - serviceInstanceID
        - clusterID
        - status
        - statusChangedAt
        - sandboxCount
        - outstandingWork
        - maxSandboxes
        - metrics
        - createSuccesses
        - createFails
        - sandboxStartingCount
        - version
        - commit
        - machineInfo
      properties:
        version:
          type: string
          description: Version of the orchestrator
        commit:
          type: string
          description: Commit of the orchestrator
        id:
          type: string
          description: Identifier of the node
        serviceInstanceID:
          type: string
          description: Service instance identifier of the node
        clusterID:
          type: string
          description: Identifier of the cluster
        machineInfo:
          $ref: "#/components/schemas/MachineInfo"
        status:
          $ref: "#/components/schemas/NodeStatus"
        statusChangedAt:
          type: string
          format: date-time
          description: Time when the node status was last changed
        sandboxCount:
          type: integer
          format: uint32
          description: Number of sandboxes running on the node
        maxSandboxes:
          type: integer
          format: int64
          description: Cached node-scoped sandbox admission limit. Nonpositive values reject creation.
        outstandingWork:
          type: integer
          format: uint64
          minimum: 0
          description: Cached count of work holds on the node. Zero means idle or not yet reported; it does not by itself authorize deletion.
        metrics:
          $ref: "#/components/schemas/NodeMetrics"
        createSuccesses:
          type: integer
          format: uint64
          description: Number of sandbox create successes
        createFails:
          type: integer
          format: uint64
          description: Number of sandbox create fails
        sandboxStartingCount:
          type: integer
          format: int
          description: Number of starting Sandboxes

    NodeDetail:
      required:
        - id
        - serviceInstanceID
        - clusterID
        - status
        - statusChangedAt
        - sandboxCount
        - outstandingWork
        - maxSandboxes
        - createSuccesses
        - createFails
        - version
        - commit
        - metrics
        - machineInfo
      properties:
        clusterID:
          type: string
          description: Identifier of the cluster
        version:
          type: string
          description: Version of the orchestrator
        commit:
          type: string
          description: Commit of the orchestrator
        id:
          type: string
          description: Identifier of the node
        serviceInstanceID:
          type: string
          description: Service instance identifier of the node
        machineInfo:
          $ref: "#/components/schemas/MachineInfo"
        status:
          $ref: "#/components/schemas/NodeStatus"
        statusChangedAt:
          type: string
          format: date-time
          description: Time when the node status was last changed
        sandboxCount:
          type: integer
          format: uint32
          description: Number of sandboxes running on the node
        maxSandboxes:
          type: integer
          format: int64
          description: Cached node-scoped sandbox admission limit. Nonpositive values reject creation.
        outstandingWork:
          type: integer
          format: uint64
          minimum: 0
          description: Cached count of work holds on the node. Zero means idle or not yet reported; it does not by itself authorize deletion.
        metrics:
          $ref: "#/components/schemas/NodeMetrics"
        createSuccesses:
          type: integer
          format: uint64
          description: Number of sandbox create successes
        createFails:
          type: integer
          format: uint64
          description: Number of sandbox create fails

    TeamAPIKey:
      required:
        - id
        - name
        - mask
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the API key
        name:
          type: string
          description: Name of the API key
        mask:
          $ref: "#/components/schemas/IdentifierMaskingDetails"
        createdAt:
          type: string
          format: date-time
          description: Timestamp of API key creation
        createdBy:
          allOf:
            - $ref: "#/components/schemas/TeamUser"
          nullable: true
        lastUsed:
          type: string
          format: date-time
          description: Last time this API key was used
          nullable: true

    CreatedTeamAPIKey:
      required:
        - id
        - key
        - mask
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the API key
        key:
          type: string
          description: Raw value of the API key
        mask:
          $ref: "#/components/schemas/IdentifierMaskingDetails"
        name:
          type: string
          description: Name of the API key
        createdAt:
          type: string
          format: date-time
          description: Timestamp of API key creation
        createdBy:
          allOf:
            - $ref: "#/components/schemas/TeamUser"
          nullable: true
        lastUsed:
          type: string
          format: date-time
          description: Last time this API key was used
          nullable: true

    NewTeamAPIKey:
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the API key

    UpdateTeamAPIKey:
      required:
        - name
      properties:
        name:
          type: string
          description: New name for the API key

    AssignedTemplateTags:
      required:
        - tags
        - buildID
      properties:
        tags:
          type: array
          items:
            type: string
          description: Assigned tags of the template
        buildID:
          type: string
          format: uuid
          description: Identifier of the build associated with these tags

    TemplateTag:
      required:
        - tag
        - buildID
        - createdAt
      properties:
        tag:
          type: string
          description: The tag name
        buildID:
          type: string
          format: uuid
          description: Identifier of the build associated with this tag
        createdAt:
          type: string
          format: date-time
          description: Time when the tag was assigned

    TemplateTagAssignment:
      type: object
      required:
        - assignmentId
        - buildId
        - assignedAt
        - buildCreatedAt
        - buildFinishedAt
      properties:
        assignmentId:
          type: string
          format: uuid
          description: Identifier of the tag assignment event.
        buildId:
          type: string
          format: uuid
          description: Identifier of the assigned build.
        assignedAt:
          type: string
          format: date-time
          description: Time when the tag was assigned to the build.
        buildCreatedAt:
          type: string
          format: date-time
          description: Time when the assigned build was created.
        buildFinishedAt:
          type: string
          format: date-time
          nullable: true
          description: Time when the assigned build finished.

    TemplateTagGroup:
      type: object
      required:
        - tag
        - assignments
        - hasMore
      properties:
        tag:
          type: string
          description: Template tag name.
        assignments:
          type: array
          description: Ready assignment events for this tag, sorted latest first.
          items:
            $ref: "#/components/schemas/TemplateTagAssignment"
        hasMore:
          type: boolean
          description: Whether more ready assignment events exist beyond the requested assignment limit.

    TemplateTagGroupsResponse:
      type: object
      required:
        - tags
        - nextCursor
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TemplateTagGroup"
        nextCursor:
          type: string
          nullable: true
          description: Cursor to pass as `tagsCursor` for the next page, or `null` if there is no next page.

    TemplateTagsCountResponse:
      type: object
      required:
        - total
      properties:
        total:
          type: integer
          format: int64
          description: Total distinct ready tags for the template.

    TemplateTagExistsResponse:
      type: object
      required:
        - exists
        - normalizedTag
      properties:
        exists:
          type: boolean
          description: Whether the template tag has at least one ready assignment.
        normalizedTag:
          type: string
          description: Normalized template tag name.

    TemplateTagAssignmentsResponse:
      type: object
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          description: Ready assignment events for the tag, sorted latest first.
          items:
            $ref: "#/components/schemas/TemplateTagAssignment"
        nextCursor:
          type: string
          nullable: true
          description: Cursor to pass to the next list request, or `null` if there is no next page.

    AssignTemplateTagsRequest:
      required:
        - target
        - tags
      properties:
        target:
          type: string
          description: Target template in "name:tag" format
        tags:
          description: Tags to assign to the template
          type: array
          items:
            type: string

    DeleteTemplateTagsRequest:
      required:
        - name
        - tags
      properties:
        name:
          type: string
          description: Name of the template
        tags:
          description: Tags to delete
          type: array
          items:
            type: string

    Error:
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
        error_code:
          type: string
          description: >-
            Machine-readable semantic error code. Not a closed set; initial values:
            sandbox_capacity_unavailable, sandbox_placement_timeout,
            sandbox_no_compatible_node, sandbox_create_failed (a node could not
            create the sandbox this time; retry), sandbox_create_refused (a node
            refused the sandbox for a reason no retry changes, such as a vcpu
            count out of bounds in the stored build; a server error, since no
            request field reaches that check), internal_server_error,
            secret_limit_reached, idempotency_request_mismatch, idempotency_in_progress,
            idempotency_outcome_unknown, cluster_registration_invalid,
            cluster_registration_conflict, cluster_assignment_invalid,
            cluster_assignment_project_not_found, cluster_assignment_cluster_not_found,
            cluster_assignment_already_assigned, cluster_assignment_cluster_deleting,
            sandbox_snapshot_guest_agent_unresponsive (a plain resume of a
            snapshot taken while the sandbox guest agent was not responding;
            resume it with memory: false).
        message:
          type: string
          description: Error

    IdentifierMaskingDetails:
      required:
        - prefix
        - valueLength
        - maskedValuePrefix
        - maskedValueSuffix
      properties:
        prefix:
          type: string
          description: Prefix that identifies the token or key type
        valueLength:
          type: integer
          description: Length of the token or key
        maskedValuePrefix:
          type: string
          description: Prefix used in masked version of the token or key
        maskedValueSuffix:
          type: string
          description: Suffix used in masked version of the token or key

    Volume:
      type: object
      properties:
        volumeID:
          type: string
          description: ID of the volume
        name:
          type: string
          description: Name of the volume
      required:
        - volumeID
        - name

    VolumeAndToken:
      type: object
      properties:
        volumeID:
          type: string
          description: ID of the volume
        name:
          type: string
          description: Name of the volume
        token:
          type: string
          description: Auth token to use for interacting with volume content
        domain:
          type: string
          description: |
            Domain to use as the destination for volume content requests,
            replacing the default `api.<E2B_DOMAIN>`. Only returned when the
            team is connected to a custom (BYOC) cluster; absent otherwise, in
            which case the default domain is used.
      required:
        - volumeID
        - name
        - token

    NewVolume:
      type: object
      properties:
        name:
          type: string
          description: Name of the volume
          pattern: "^[a-zA-Z0-9_-]+$"
      required:
        - name

    SecretMetadata:
      type: object
      description: >
        Customer metadata of the secret. Always present, empty when unset.
        At most 32 entries; keys are limited to 128 bytes, values to 1024
        bytes, and a secret's metadata to 8192 bytes in total.
      maxProperties: 32
      additionalProperties:
        type: string
        maxLength: 1024

    Secret:
      type: object
      description: Metadata of a secret. It never carries the secret value.
      required:
        - secretID
        - name
        - currentVersion
        - metadata
        - createdAt
        - updatedAt
      properties:
        secretID:
          type: string
          description: Identifier of the secret
        name:
          type: string
          description: Name of the secret, unique within the project
        currentVersion:
          type: integer
          format: int64
          description: Version served to readers that do not name one
        metadata:
          $ref: "#/components/schemas/SecretMetadata"
        createdAt:
          type: string
          format: date-time
          description: Time when the secret was created
        updatedAt:
          type: string
          format: date-time
          description: Time when the secret was last updated

    NewSecret:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-zA-Z0-9_-]+$'
          description: >
            Name of the secret, unique within the project. Names are
            lower-cased before storage and returned in that canonical form;
            the sec_ prefix is reserved for secret identifiers.
        value:
          type: string
          description: Runtime marker stored as the secret's first version. The runtime resolves it to a value at sandbox egress.
        metadata:
          $ref: "#/components/schemas/SecretMetadata"

    SecretUpdate:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          description: Runtime marker stored as the secret's new version. The runtime resolves it to a value at sandbox egress.
        metadata:
          $ref: "#/components/schemas/SecretMetadata"

    SandboxEvent:
      description: Sandbox event
      required:
        - id
        - version
        - type
        - timestamp
        - sandboxId
        - sandboxExecutionId
        - sandboxTemplateId
        - sandboxBuildId
        - sandboxTeamId
      properties:
        id:
          type: string
          format: uuid
          description: Event unique identifier
        version:
          type: string
          description: Event structure version
        type:
          type: string
          description: Event name
        eventCategory:
          type: string
          deprecated: true
          description: Category of the event (e.g., 'lifecycle', 'process', etc.)
        eventLabel:
          type: string
          deprecated: true
          description: Label for the specific event type (e.g., 'sandbox_started', 'process_oom', etc.)
        eventData:
          type: object
          nullable: true
          description: Optional JSON data associated with the event

        timestamp:
          type: string
          format: date-time
          description: Timestamp of the event
        sandboxId:
          type: string
          format: string
          description: Unique identifier for the sandbox
        sandboxExecutionId:
          type: string
          format: string
          description: Unique identifier for the sandbox execution
        sandboxTemplateId:
          type: string
          format: string
          description: Unique identifier for the sandbox template
        sandboxBuildId:
          type: string
          format: string
          description: Unique identifier for the sandbox build
        sandboxTeamId:
          type: string
          format: uuid
          description: Team identifier associated with the sandbox
    WebhookCreate:
      description: Configuration for registering new webhooks
      required:
        - name
        - url
        - events
        - signatureSecret
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        enabled:
          type: boolean
          default: true
        signatureSecret:
          type: string
          description: Secret used to sign the webhook payloads
    WebhookCreation:
      description: Webhook creation response
      required:
        - id
        - name
        - createdAt
        - teamId
        - url
        - enabled
        - events
      properties:
        id:
          type: string
          description: Webhook unique identifier
        name:
          type: string
          description: Webhook user friendly name
        createdAt:
          type: string
          format: date-time
          description: Time when the template was created
        teamId:
          type: string
          description: Unique identifier for the team
        url:
          type: string
          format: uri
        enabled:
          type: boolean
        events:
          type: array
          items:
            type: string
    WebhookDetail:
      description: Webhook detail response
      required:
        - id
        - teamId
        - name
        - createdAt
        - url
        - enabled
        - events
      properties:
        id:
          type: string
          description: Webhook unique identifier
        teamId:
          type: string
          description: Unique identifier for the team
        name:
          type: string
          description: Webhook user friendly name
        createdAt:
          type: string
          format: date-time
          description: Time when the template was created
        url:
          type: string
          format: uri
        enabled:
          type: boolean
        events:
          type: array
          items:
            type: string
    WebhookConfiguration:
      description: Configuration for updating existing webhooks
      properties:
        enabled:
          type: boolean
        name:
          type: string
          description: Webhook user friendly name
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        signatureSecret:
          type: string
          description: Secret used to sign the webhook payloads
    WebhookDelivery:
      description: Webhook delivery attempt
      required:
        - id
        - teamId
        - webhookId
        - eventId
        - sandboxId
        - eventType
        - status
        - durationMs
        - requestBody
        - requestHeaders
        - requestUrl
        - errorClass
        - timestamp
      properties:
        id:
          type: string
          format: uuid
          description: Delivery attempt identifier
        teamId:
          type: string
          format: uuid
          description: Team identifier
        webhookId:
          type: string
          format: uuid
          description: Webhook configuration identifier
        eventId:
          type: string
          format: uuid
          description: Sandbox event identifier
        sandboxId:
          type: string
          description: Sandbox identifier
        eventType:
          type: string
          description: Sandbox event type
        status:
          type: string
          enum: [success, failed]
          description: Delivery attempt status
        durationMs:
          type: integer
          format: int32
          description: Delivery request duration in milliseconds
        requestBody:
          type: string
          description: Serialized webhook request body
        requestHeaders:
          type: string
          description: JSON-encoded request headers with sensitive values redacted
        requestUrl:
          type: string
          format: uri
          description: URL attempted for this delivery
        responseBody:
          type: string
          nullable: true
          description: Truncated response body, if a response was received
        responseHeaders:
          type: string
          nullable: true
          description: JSON-encoded response headers, if a response was received
        responseHttpStatusCode:
          type: integer
          format: int32
          nullable: true
          description: HTTP response status code, if a response was received
        errorClass:
          type: string
          nullable: true
          enum:
            - http_error
            - dns_error
            - timeout
            - transport_error
            - request_error
            - signature_error
            - canceled
          description: Machine-readable non-HTTP or HTTP failure class
        errorMessage:
          type: string
          nullable: true
          description: Error message for failures without a useful response body
        timestamp:
          type: string
          format: date-time
          description: Time when the delivery attempt started
    WebhookDeliveryStats:
      description: Webhook delivery aggregate stats
      required:
        - buckets
        - total
        - failed
        - durationMs
      properties:
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDeliveryStatsBucket"
        total:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        durationMs:
          $ref: "#/components/schemas/WebhookDeliveryDurationStats"
    WebhookDeliveryDurationStats:
      description: Webhook delivery duration statistics in milliseconds
      required:
        - minimum
        - average
        - maximum
      properties:
        minimum:
          type: number
          format: double
        average:
          type: number
          format: double
        maximum:
          type: number
          format: double
    WebhookDeliveryStatsBucket:
      description: Webhook delivery stats for a time bucket
      required:
        - timestamp
        - total
        - failed
        - durationMs
      properties:
        timestamp:
          type: string
          format: date-time
        total:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        durationMs:
          $ref: "#/components/schemas/WebhookDeliveryDurationStats"
    WebhookDeliveryGroup:
      description: Webhook delivery attempts grouped by sandbox event
      required:
        - eventId
        - eventType
        - sandboxId
        - attempts
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        sandboxId:
          type: string
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
    WebhookDeliveriesListPayload:
      description: Paginated webhook delivery attempts grouped by event
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDeliveryGroup"
        nextCursor:
          type: string
          nullable: true
          description: Cursor to pass to the next list request, or null when there is no next page.
    ManagementClusterRegistrationRequest:
      type: object
      required:
        - name
        - endpoint
        - endpoint_tls
        - token
      properties:
        name:
          type: string
          minLength: 1
        endpoint:
          type: string
          minLength: 1
        endpoint_tls:
          type: boolean
        token:
          type: string
          minLength: 1
        sandbox_proxy_domain:
          type: string
          nullable: true
        auth_org_id:
          type: string
          nullable: true

    ManagementClusterProjects:
      type: object
      required: [project_ids]
      properties:
        project_ids:
          type: array
          items:
            type: string
            format: uuid

    ManagementProjectSettingsRequest:
      type: object
      required: [revision, settings]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Monotonic per-project revision. Older or duplicate revisions
            succeed without changing stored state.
        settings:
          $ref: "#/components/schemas/ProjectSettings"

    ProjectSettings:
      type: object
      description: The project's stored settings. PUT replaces the complete document.
      required: [sandboxSettings]
      properties:
        sandboxSettings:
          $ref: "#/components/schemas/SandboxSettings"

    SandboxSettings:
      type: object
      properties:
        defaultAllowPublicTraffic:
          type: boolean
          description: >-
            Whether new sandboxes without an explicit network.allowPublicTraffic
            accept traffic without a traffic access token. Omission uses the
            public default. Existing sandboxes, resumes and forks keep their settings.

    ManagementProjectUpsertRequest:
      type: object
      description: >-
        The properties of a project this side stores. Name, slug and email are
        synchronized on every push. The optional cluster assignment is preserved
        when omitted.


        A project's tier is not among them, and this side assigns none. Limits
        arrive separately and in full through managementUpsertProjectLimits.
      required: [name, slug, email]
      properties:
        cluster_id:
          type: string
          format: uuid
          description: Cluster assignment to synchronize. Omission preserves the existing assignment.
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 63
          description: >-
            Changing it renames the project, and its template names follow:
            each name held under an earlier slug is also given under the new
            one, and the old names keep working. A name the new slug already
            holds is left as it is. A slug already held on this control plane
            is a 409, on a rename as much as on a create.
        email:
          type: string
          minLength: 1
          maxLength: 255
          description: Contact address recorded on the project.

    ManagementProject:
      allOf:
        - $ref: "#/components/schemas/ManagementProjectUpsertRequest"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid

    ManagementProjectMemberIdentity:
      type: object
      required: [issuer, subject]
      properties:
        issuer:
          type: string
          minLength: 1
          maxLength: 2048
        subject:
          type: string
          minLength: 1
          maxLength: 2048

    ManagementProjectMemberApplyRequest:
      type: object
      required: [revision, present]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        present:
          type: boolean
        is_default:
          type: boolean
          default: false
          description: Whether this membership is the user's default team. Omitted requests from older sources remain non-default.
        identities:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/ManagementProjectMemberIdentity"

    ManagementProjectBlockRequest:
      type: object
      description: >-
        Desired project block state. A newer revision replaces the state,
        including any intervening manual block or unblock.
      required: [revision, blocked]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Monotonic per-project revision. Older or duplicate revisions
            succeed without changing stored state.
        blocked:
          type: boolean
          description: Whether the project is refused billable work.
        reason:
          type: string
          description: >-
            Reason included in blocked-request errors. Cleared when blocked is false.
        decided_at:
          $ref: "#/components/schemas/ManagementDecidedAt"

    ManagementProjectBanRequest:
      type: object
      description: >-
        Desired project ban state. A newer revision replaces the state,
        including any intervening manual ban or unban.
      required: [revision, banned]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Monotonic per-project revision. Older or duplicate revisions
            succeed without changing stored state.
        banned:
          type: boolean
          description: Whether the project is refused at authentication.
        decided_at:
          $ref: "#/components/schemas/ManagementDecidedAt"

    ManagementDecidedAt:
      type: string
      format: date-time
      description: >-
        When the caller decided this revision, in RFC 3339. Stored with the
        revision and used to measure how long the decision took to apply here.
        Omit it when the caller does not know; the delivery is then counted as
        origin unknown rather than as zero lag.

    ManagementProjectLimits:
      type: object
      description: >-
        A project's effective limits, already resolved by the caller. Every
        field is absolute: this side stores what it is given and performs no
        arithmetic of its own.


        The minimums below are the contract for what a limit may be, at least
        as strict as the CHECK constraints on default_limits. project_limits
        stores the same values under looser constraints on purpose — it is a
        push target, and a floor that only rejects the impossible keeps a
        future decision about what is allowed a change to this schema rather
        than a migration.


        `max_disk_size_mb` and `max_free_disk_size_mb` are one ceiling under two
        names, and either name alone carries it. A caller that sends both must
        send them equal; a caller that sends neither is refused. Sending both is
        what a caller does while receivers older than the second name are still
        running.
      required:
        - revision
        - concurrent_sandboxes
        - max_sandbox_length_hours
        - max_vcpu
        - max_ram_mb
        - disk_mb
        - concurrent_template_builds
        - events_ttl_days
        - default_free_disk_size_mb
        - api_team_rps_list
        - api_team_rps_delete
        - max_secrets
      anyOf:
        - required: [max_free_disk_size_mb]
        - required: [max_disk_size_mb]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The caller's version of this answer, raised whenever the limits it
            resolved for the project change. Delivery is over a network, so two
            pushes can be in flight at once and arrive in either order: this
            side stores the revision it accepted and drops a delivery at or
            below it, which is what keeps a delayed retry from putting the
            project back on limits it has already left.


            Comparable only against earlier revisions for the same project.
        concurrent_sandboxes:
          type: integer
          format: int32
          minimum: 1
        max_sandbox_length_hours:
          type: integer
          format: int32
          minimum: 1
        max_vcpu:
          type: integer
          format: int32
          minimum: 1
        max_ram_mb:
          type: integer
          format: int64
          minimum: 1
        disk_mb:
          type: integer
          format: int64
          minimum: 1
        concurrent_template_builds:
          type: integer
          format: int32
          minimum: 1
        events_ttl_days:
          type: integer
          format: int32
          minimum: 1
        default_free_disk_size_mb:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The default free-space growth target when a template build request
            omits one. May sit anywhere at or below the maximum free-space
            growth target, and usually sits well below it; a delivery whose
            default exceeds the maximum is rejected.
        max_free_disk_size_mb:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The most a template build may request as its free-space growth
            target.
        max_disk_size_mb:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The same ceiling as max_free_disk_size_mb, under the name it was
            first published with. Kept until every deployed sender and receiver
            speaks the other name.
        api_team_rps_list:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Requests per second a project may make to each list endpoint. Zero
            disables the limit.
        api_team_rps_delete:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Requests per second a project may make to each delete endpoint. Zero
            disables the limit.
        max_secrets:
          type: integer
          format: int32
          minimum: 1
          description: Live secrets the project may hold.
        decided_at:
          $ref: "#/components/schemas/ManagementDecidedAt"

tags:
  - name: templates
  - name: sandboxes
  - name: auth
  - name: api-keys
  - name: tags
  - name: volumes
  - name: secrets

paths:
  /health:
    get:
      summary: Health check
      description: Health check
      responses:
        "204":
          description: The service is healthy
        "401":
          $ref: "#/components/responses/401"
        "429":
          $ref: "#/components/responses/429"

  /teams:
    get:
      summary: List teams
      description: List all teams
      tags: [auth]
      security:
        - AuthProviderBearerAuth: []
      responses:
        "200":
          description: Successfully returned all teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/401"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"

  /teams/{teamID}/metrics:
    get:
      summary: Team metrics
      description: Get metrics for the team
      tags: [auth]
      security:
        - ApiKeyAuth: []
        - AuthProviderBearerAuth: []
          AuthProviderTeamAuth: []
        - AdminApiKeyAuth: []
          AdminTeamAuth: []
        - AdminJWTAuth: []
          AdminTeamAuth: []
      parameters:
        - $ref: "#/components/parameters/teamID"
        - in: query
          name: start
          schema:
            type: integer
            format: int64
            minimum: 0
          description: Unix timestamp for the start of the interval, in seconds, for which the metrics
        - in: query
          name: end
          schema:
            type: integer
            format: int64
            minimum: 0
            description: Unix timestamp for the end of the interval, in seconds, for which the metrics
      responses:
        "200":
          description: Successfully returned the team metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMetric"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"

  /teams/{teamID}/metrics/max:
    get:
      summary: Maximum team metrics
      description: Get the maximum metrics for the team in the given interval
      tags: [auth]
      security:
        - ApiKeyAuth: []
        - AuthProviderBearerAuth: []
          AuthProviderTeamAuth: []
        - AdminApiKeyAuth: []
          AdminTeamAuth: []
        - AdminJWTAuth: []
          AdminTeamAuth: []
      parameters:
        - $ref: "#/components/parameters/teamID"
        - in: query
          name: start
          schema:
            type: integer
            format: int64
            minimum: 0
          description: Unix timestamp for the start of the interval, in seconds, for which the metrics
        - in: query
          name: end
          schema:
            type: integer
            format: int64
            minimum: 0
            description: Unix timestamp for the end of the interval, in seconds, for which the metrics
        - in: query
          name: metric
          required: true
          schema:
            type: string
            enum: [concurrent_sandboxes, sandbox_start_rate]
          description: Metric to retrieve the maximum value for
      responses:
        "200":
          description: Successfully returned the team metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaxTeamMetric"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"

  /unstable/teams/{teamID}/status:
    get:
      summary: Team access status
      description: Returns whether the team is banned or blocked, and why it is blocked. A team-authenticated request may read only its own team.
      tags: [auth]
      security:
        - AuthProviderBearerAuth: []
          AuthProviderTeamAuth: []
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/teamID"
      responses:
        "200":
          description: Successfully returned the team access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamStatusResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"

  /unstable/teams/{teamID}/limits:
    get:
      summary: Team limits
      description: Returns the team's effective resource limits. A team-authenticated request may read only its own team.
      tags: [auth]
      security:
        - AuthProviderBearerAuth: []
          AuthProviderTeamAuth: []
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/teamID"
      responses:
        "200":
          description: Successfully returned the team limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamLimitsResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"

  /sandboxes:
    get:
      summary: List running sandboxes
      x-api-group: list
      description: List all running sandboxes. Returns 400 when more than 5000 running sandboxes match; use GET /v2/sandboxes to page through them.
      deprecated: true
      tags: [sandboxes]
      security:
        - ApiKeyAuth: []
        - AuthProviderBearerAuth: []
          AuthProviderTeamAuth: []
        - AdminApiKeyAuth: []
          AdminTeamAuth: []
        - AdminJWTAuth: []
          AdminTeamAuth: []
      parameters:
        - name: metadata
          in: query
          description: Metadata query used to filter the sandboxes (e.g. "user=abc&app=prod"). Each key and values must be URL encoded.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Successfully returned all running sandboxes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListedSandbox"
        "401":
          $ref: "#/components/responses/401"
        "400":
          $ref: "#/components/responses/400"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"
    post:
      summary: Create sandbox
      description: Create a sandbox from the template. All system communication with the sandbox is secured. Use POST /v2/sandboxes instead.
      deprecated: true
      tags: [sandboxes]
      security:
        - ApiKeyAuth: []
        - AuthProviderBearerAuth: []
          AuthProviderTeamAuth: []
        - AdminApiKeyAuth: []
          AdminTeamAuth: []
        - AdminJWTAuth: []
          AdminTeamAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSandbox"
      responses:
        "201":
          description: The sandbox was created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "401":
          $ref: "#/components/responses/401"
        "400":
          $ref: "#/components/responses/400"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
        "504":
          $ref: "#/components/responses/504"

  /v2/sandboxes:
    post:
      summary: Create sandbox (v2)
      description: Create a sandbox from the template. All system communication with the sandbox is secured.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Optional team-scoped key for retrying sandbox creation. Use 1 to 255 lowercase ASCII
            letters, digits, or hyphens (a-z, 0-9, -), such as a lowercase UUID. When idempotency is enabled,
            matching retries replay a completed status and body for the retention period. A creation
            failure explicitly classified as safe to retry (Should-Retry: true) permits a fresh
            attempt with the same key and parameters. Only one attempt can run at a time.
            Different request parameters return 409 with error_code idempotency_request_mismatch.
            An in-progress request returns 409 with error_code idempotency_in_progress; an unknown
            outcome returns 422 with error_code idempotency_outcome_unknown. These retries do not execute the request again.
            Retries do not extend retention. If a fresh attempt's request deadline plus response
            persistence budget would exceed the remaining retention, the previous error is replayed.
            After the key expires, it can start a new creation.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[a-z0-9-]+$'
      tags: [sandboxes]
      security:
        - ApiKeyAuth: []
        - AuthProviderBearerAuth: []
          AuthProviderTeamAuth: []
        - AdminApiKeyAuth: []
          AdminTeamAuth: []
        - AdminJWTAuth: []
          AdminTeamAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSandboxV2"
      responses:
        "201":
          description: The sandbox was created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "401":
          $ref: "#/components/responses/401"
        "400":
          description: Bad request
          headers:
            Should-Retry:
              $ref: "#/components/headers/ShouldRetry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          headers:
            Should-Retry:
              $ref: "#/components/headers/ShouldRetry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          headers:
            Should-Retry:
              $ref: "#/components/headers/ShouldRetry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The Idempotency-Key conflicts with a different request (error_code idempotency_request_mismatch), or the matching original request has no recorded response yet and is within its expected response window (error_code idempotency_in_progress); this request was not executed again
          headers:
            Should-Retry:
              $ref: "#/components/headers/ShouldRetry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The matching original request has no recorded response and its expected response deadline has passed or is unknown (error_code idempotency_outcome_unknown); this request was not executed again
          headers:
            Should-Retry:
              $ref: "#/components/headers/ShouldRetry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many requests
          headers:
            Should-Retry:
              $ref: "#/components/headers/ShouldRetry"
            Retry-After:
              description: When present, the number of seconds to wait before retrying the request.
              required: false
              schema:
                type: integer
                minimum: 0
              example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          headers:
            Should-Retry:
              $ref: "#/components/headers/ShouldRetry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          headers:
            Should-Retry:
              $ref: "#/components/headers/ShouldRetry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: Backend timeout
          headers:
            Should-Retry:
              $ref: "#/components/headers/ShouldRetry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
