openapi: 3.0.0
info:
  version: 0.1.0
  title: E2B API

servers:
  - url: https://api.e2b.app

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    # AuthProviderBearerAuth / AuthProviderTeamAuth: B before T in the name
    # so Bearer is validated before Team.
    AuthProviderBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: access_token
    AuthProviderTeamAuth:
      type: apiKey
      in: header
      name: X-Team-ID
    # AdminApiKeyAuth / AdminTeamAuth: alphabetical names ensure token
    # validation runs before team context population.
    AdminApiKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-Token
    AdminJWTAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AdminTeamAuth:
      type: apiKey
      in: header
      name: X-Team-ID

  parameters:
    clusterID:
      name: clusterID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identifier of the cluster
    rigID:
      name: rigID
      in: path
      required: true
      schema:
        type: string
      description: Rig identifier (e.g. "default")
    templateID:
      name: templateID
      in: path
      required: true
      schema:
        type: string
    buildID:
      name: buildID
      in: path
      required: true
      schema:
        type: string
    sandboxID:
      name: sandboxID
      in: path
      required: true
      schema:
        type: string
    teamID:
      name: teamID
      in: path
      required: true
      description: Identifier of the team, as its UUID or its public project ID (prj_)
      schema:
        type: string
    nodeID:
      name: nodeID
      in: path
      required: true
      schema:
        type: string
    apiKeyID:
      name: apiKeyID
      in: path
      required: true
      schema:
        type: string
    aliasID:
      name: aliasID
      in: path
      required: true
      description: Identifier of the alias
      schema:
        type: string
        format: uuid
    snapshotID:
      name: snapshotID
      in: path
      required: true
      schema:
        type: string
        description: Identifier of the snapshot (template ID)
    tag:
      name: tag
      in: path
      required: true
      schema:
        type: string
        description: Tag name
    tagQuery:
      name: tag
      in: query
      required: true
      description: Template tag name to check.
      schema:
        type: string
        minLength: 1
    tagAssignmentLimit:
      name: assignmentLimit
      in: query
      required: false
      description: Maximum number of ready assignment rows to return per tag.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 25
        default: 6
    tagGroupsLimit:
      name: tagsLimit
      in: query
      required: false
      description: Maximum number of distinct tags to return per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 25
    tagGroupsCursor:
      name: tagsCursor
      in: query
      required: false
      description: Cursor returned by the previous list response in `{sort}|{latest_assigned_at}|{tag}` format (sort-tagged, RFC3339Nano).
      schema:
        type: string
    tagGroupsSearch:
      name: search
      in: query
      required: false
      description: Substring filter on tag name. Allowed characters are `a-z`, `0-9`, `.`, `_`, `-`.
      schema:
        type: string
        maxLength: 64
        pattern: "^[a-z0-9._-]*$"
    tagGroupsSort:
      name: sort
      in: query
      required: false
      description: Sort order for the returned tag groups.
      schema:
        type: string
        enum: [latest_desc, latest_asc, name_asc, name_desc]
        default: latest_desc
    tagAssignmentsLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of assignment rows to return per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    tagAssignmentsCursor:
      name: cursor
      in: query
      required: false
      description: Cursor returned by the previous list response in `assigned_at|assignment_id` format.
      schema:
        type: string
    paginationLimit:
      name: limit
      in: query
      description: Maximum number of items to return per page
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 100
        maximum: 100
    paginationNextToken:
      name: nextToken
      in: query
      description: Cursor to start the list from
      required: false
      schema:
        type: string
    templatesSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive substring match on the template ID, its aliases and its names.
      schema:
        type: string
        maxLength: 256
    templatesSort:
      name: sort
      in: query
      required: false
      description: Sort column and direction.
      schema:
        type: string
        enum: [created_at_desc, created_at_asc, updated_at_desc, updated_at_asc]
        default: created_at_desc
    templatesPublic:
      name: public
      in: query
      required: false
      description: Only list public (true) or only non-public (false) templates.
      schema:
        type: boolean
    templatesCursor:
      name: cursor
      in: query
      required: false
      description: >
        Cursor returned by the previous page in `{sort}|{value}|{templateID}` format. Rejected if
        its sort does not match the request.
      schema:
        type: string
    templatesLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of templates to return per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    buildIDOrTemplate:
      name: build_id_or_template
      in: query
      required: false
      description: Optional filter by build identifier, template identifier, or template alias.
      schema:
        type: string
    buildStatuses:
      name: statuses
      in: query
      required: false
      description: Comma-separated list of build statuses to include.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: "#/components/schemas/BuildStatus"
    buildsCursor:
      name: cursor
      in: query
      required: false
      description: Cursor returned by the previous list response in `created_at|build_id` format.
      schema:
        type: string
    buildsLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of builds to return per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    buildIDs:
      name: build_ids
      in: query
      required: true
      description: Comma-separated list of build IDs to get statuses for.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          format: uuid
    volumeID:
      name: volumeID
      in: path
      required: true
      schema:
        type: string
    secretID:
      name: secretID
      in: path
      required: true
      schema:
        type: string
        description: >
          Identifier of the secret (sec_ prefixed), or its canonical
          lower-case name

    webhookID:
      name: webhookID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    ShouldRetry:
      description: |
        Whether the condition behind this error may clear, so that retrying the request could
        succeed. true marks a transient failure such as missing capacity, a rate limit, or a
        creation still in progress: retry after Retry-After when present, otherwise with
        exponential backoff. false marks a failure a retry cannot fix, such as a malformed request
        or a configuration fault, or an outcome that is unknown, where a retry could create a
        second sandbox. Successful responses and errors without an explicit classification omit
        the header. With idempotency enabled, retry sandbox creation with the same Idempotency-Key
        and request parameters. A retryable creation failure permits a fresh attempt; an
        idempotency_in_progress response only reports an existing attempt and never releases it.
      required: false
      schema:
        type: boolean
    XNextToken:
      description: Cursor to fetch the next page of results, if more exist
      schema:
        type: string
    XTotalRunning:
      description: >
        Number of running sandboxes matching the filters, before pagination is applied.
        Only present when running sandboxes were requested.
      schema:
        type: integer
        format: int32

  responses:
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "401":
      description: Authentication error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "404":
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "429":
      description: Too many requests
      headers:
        Retry-After:
          description: When present, the number of seconds to wait before retrying the request.
          required: false
          schema:
            type: integer
            minimum: 0
          example: 30
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "500":
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "501":
      description: Not implemented by this deployment
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "502":
      description: Backend error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "503":
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "504":
      description: Backend timeout
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Rig:
      description: An orchestrator node pool backed by one cloud scaling group
      required:
        - id
        - provider
        - resourceID
        - capacityDesired
        - capacityCurrent
      properties:
        id:
          type: string
          description: Rig identifier (e.g. "default")
        provider:
          type: string
          description: Cloud provider backing the rig ("aws" or "gcp")
        resourceID:
          type: string
          description: Canonical cloud resource ID of the scaling group backing the rig (ARN on AWS, self-link on GCP)
        capacityDesired:
          type: integer
          format: int32
          description: Desired number of instances in the rig
        capacityMin:
          type: integer
          format: int32
          description: >
            Minimum capacity enforced on the rig's scaling group. Omitted when
            nothing enforces bounds (GCP MIG without an active autoscaler).
        capacityMax:
          type: integer
          format: int32
          description: >
            Maximum capacity enforced on the rig's scaling group. Omitted when
            nothing enforces bounds (GCP MIG without an active autoscaler).
        capacityCurrent:
          type: integer
          format: int32
          description: Number of instances currently attached to the rig

    RigCapacityChange:
      description: Desired capacity to set on the rig's scaling group
      required:
        - desired
      properties:
        desired:
          type: integer
          format: int32
          minimum: 0
          description: Absolute desired number of instances in the rig

    RigInstance:
      description: An instance attached to a rig's scaling group
      required:
        - id
        - transitioning
        - terminating
      properties:
        id:
          type: string
          description: Provider instance ID (EC2 instance ID on AWS, instance name on GCP), also the node ID the orchestrator reports
        createdAt:
          type: string
          format: date-time
          description: When the provider created the instance. Omitted while the instance is transitioning.
        transitioning:
          type: boolean
          description: The provider is creating, deleting, recreating or otherwise mutating the instance
        terminating:
          type: boolean
          description: The instance is on its way out of the group and can never become healthy again

    RigError:
      description: >
        Scaling error on the rig's scaling group, e.g. a failed instance
        creation due to resource exhaustion
      required:
        - timestamp
        - code
        - message
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
        code:
          type: string
          description: Provider-specific error code (e.g. ZONE_RESOURCE_POOL_EXHAUSTED, Failed)
        message:
          type: string
          description: Human-readable error message
        instance:
          type: string
          description: Instance the error relates to, if any
        action:
          type: string
          description: Action being performed when the error occurred (e.g. CREATING)

    Team:
      required:
        - teamID
        - name
        - apiKey
        - isDefault
      properties:
        teamID:
          type: string
          description: Identifier of the team
        name:
          type: string
          description: Name of the team
        apiKey:
          type: string
          description: API key for the team
        isDefault:
          type: boolean
          description: Whether the team is the default team

    TeamUser:
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the user
        email:
          type: string
          nullable: true
          deprecated: true
          default: null
          description: Email of the user

    TemplateUpdateRequest:
      properties:
        public:
          type: boolean
          description: Whether the template is public or only accessible by the team

    TemplateUpdateResponse:
      required:
        - names
      properties:
        names:
          type: array
          description: Names of the template (namespace/alias format when namespaced)
          items:
            type: string

    CPUCount:
      type: integer
      format: int32
      minimum: 1
      description: CPU cores for the sandbox

    MemoryMB:
      type: integer
      format: int32
      minimum: 128
      description: Memory for the sandbox in MiB

    DiskSizeMB:
      type: integer
      format: int32
      minimum: 0
      description: Disk size for the sandbox in MiB

    MinFreeDiskMb:
      type: integer
      format: int32
      minimum: 0
      description: >-
        Requested minimum free space after the template's build steps, in MiB.
        Omit to use the team's default. Set to 0 to request no minimum free-disk
        growth. The filesystem is never shrunk, including inherited or already-larger
        filesystems. Growth is best effort, so filesystem metadata can leave the
        available space slightly below the requested minimum.

    EnvdVersion:
      type: string
      description: Version of the envd running in the sandbox

    SandboxMetadata:
      additionalProperties:
        type: string
        description: Metadata of the sandbox

    SandboxState:
      type: string
      description: State of the sandbox
      enum:
        - running
        - paused

    OrderDirection:
      type: string
      description: Sort direction
      default: desc
      enum:
        - asc
        - desc

    SnapshotInfo:
      type: object
      required:
        - snapshotID
        - names
      properties:
        snapshotID:
          type: string
          description: Identifier of the snapshot template including the tag. Uses namespace/alias when a name was provided (e.g. team-slug/my-snapshot:default), otherwise falls back to the raw template ID (e.g. abc123:default).
        names:
          type: array
          items:
            type: string
          description: Full names of the snapshot template including team namespace and tag (e.g. team-slug/my-snapshot:v2)

    EnvVars:
      additionalProperties:
        type: string
        description: Environment variables for the sandbox

    Mcp:
      type: object
      description: MCP configuration for the sandbox
      additionalProperties: {}
      nullable: true

    SandboxNetworkConfig:
      type: object
      properties:
        allowPublicTraffic:
          type: boolean
          nullable: true
          description: >-
            Whether sandbox URLs accept traffic without the sandbox's traffic access token.
            When omitted or null on create, the project's default applies, which is true
            unless the project changed it.
        allowOut:
          type: array
          description: List of allowed destinations for egress traffic. Each entry can be a CIDR block (e.g. "8.8.8.8/32"), a bare IP address (e.g. "8.8.8.8"), or a domain name (e.g. "example.com", "*.example.com"). Allowed entries always take precedence over denied entries. When allowOut contains a domain, the servers in dnsServers (8.8.8.8 by default) are also allowed.
          items:
            type: string
        denyOut:
          type: array
          description: List of denied CIDR blocks or IP addresses for egress traffic. Domain names are not supported for deny rules.
          items:
            type: string
        dnsServers:
          type: array
          maxItems: 10
          description: DNS servers the sandbox can reach when allowOut contains a domain. Each entry must be an IPv4 address, and all traffic to it is allowed. Omit it to allow the default nameserver 8.8.8.8, or pass an empty list to allow none. This does not change the sandbox's /etc/resolv.conf.
          items:
            type: string
        egressProxy:
          $ref: "#/components/schemas/SandboxEgressProxyConfig"
        maskRequestHost:
          type: string
          description: Specify host mask which will be used for all sandbox requests
        httpsPorts:
          type: array
          description: Sandbox ports that serve HTTPS rather than plaintext HTTP. Affects how the proxy reaches the service inside the sandbox; the public URL is HTTPS either way. Certificates are not verified, so self-signed ones work. The envd port (49983) cannot be listed.
          maxItems: 128
          uniqueItems: true
          items:
            type: integer
            format: uint32
            minimum: 1
            maximum: 65535
        rules:
          type: object
          description: >
            Per-domain transform rules applied to matching outbound HTTPS requests.
            Keys may be exact DNS names (for example, "api.example.com") or a leading wildcard
            (for example, "*.example.com"), and are normalized to lowercase on write.
            Wildcards match subdomains at any depth but not the apex domain; a bare "*" is invalid.
            Exact rules take precedence, followed by the longest matching wildcard suffix, and
            matching rule sets are not merged. Broad wildcards such as "*.com" are allowed and may
            expose transformed credentials to every matching destination the sandbox contacts.
            Rules do not grant network access; configure allowOut separately to permit the destination.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/SandboxNetworkRule"

    SandboxNetworkUpdateConfig:
      type: object
      description: Network configuration update for a running sandbox. Replaces the current egress rules with the provided configuration. Omitting a field clears it.
      properties:
        allowOut:
          type: array
          description: List of allowed destinations for egress traffic. Each entry can be a CIDR block (e.g. "8.8.8.8/32"), a bare IP address (e.g. "8.8.8.8"), or a domain name (e.g. "example.com", "*.example.com"). Allowed entries always take precedence over denied entries. When allowOut contains a domain, the servers in dnsServers (8.8.8.8 by default) are also allowed.
          items:
            type: string
        denyOut:
          type: array
          description: List of denied CIDR blocks or IP addresses for egress traffic. Domain names are not supported for deny rules.
          items:
            type: string
        dnsServers:
          type: array
          maxItems: 10
          description: DNS servers the sandbox can reach when allowOut contains a domain. Each entry must be an IPv4 address, and all traffic to it is allowed. Omit it to reset to the default nameserver 8.8.8.8, or pass an empty list to allow none. This does not change the sandbox's /etc/resolv.conf.
          items:
            type: string
        egressProxy:
          $ref: "#/components/schemas/SandboxEgressProxyConfig"
        rules:
          type: object
          description: >
            Per-domain transform rules applied to matching outbound HTTPS requests. Replaces all
            existing rules when provided. Keys may be exact DNS names or a single leading wildcard
            (for example, "*.example.com"), and are normalized to lowercase on write. Wildcards match
            subdomains at any depth but not the apex domain; a bare "*" is invalid. Exact rules take
            precedence, followed by the longest matching wildcard suffix, and matching rule sets are
            not merged. Broad wildcards such as "*.com" are allowed and may expose transformed
            credentials to every matching destination the sandbox contacts. Rules do not grant
            network access; configure allowOut separately to permit the destination.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/SandboxNetworkRule"
        allow_internet_access:
          type: boolean
          description:
            Allow sandbox to access the internet. When set to false, it behaves the same as specifying denyOut
            to 0.0.0.0/0 in the network config.

    SandboxNetworkRule:
      type: object
      description: Transform rule applied to egress requests matching a domain pattern.
      properties:
        transform:
          $ref: "#/components/schemas/SandboxNetworkTransform"

    SandboxNetworkTransform:
      type: object
      description: Transformations applied to matching egress requests before forwarding.
      properties:
        headers:
          type: object
          description: >
            HTTP headers to inject or override in matching requests.
            An existing header with the same name is replaced. Values are plain strings;
            secret resolution happens client-side before sending to the API.
          additionalProperties:
            type: string

    SandboxEgressProxyConfig:
      type: object
      nullable: true
      description: >-
        SOCKS5 proxy for sandbox egress. Outbound TCP is tunneled through the
        proxy after allow/deny filtering; the sandbox is unaware. Domain-matched
        flows use remote DNS (ATYP=domain).
      required:
        - address
      properties:
        address:
          type: string
          description: >-
            SOCKS5 proxy address in host:port format (e.g. "proxy.example.com:1080").
        username:
          type: string
          maxLength: 255
          description: >-
            Optional SOCKS5 username (RFC 1929), max 255 bytes.
        password:
          type: string
          maxLength: 255
          description: >-
            Optional SOCKS5 password (RFC 1929), max 255 bytes.
        tls:
          $ref: "#/components/schemas/SandboxEgressProxyTLSConfig"

    SandboxEgressProxyTLSConfig:
      type: object
      nullable: true
      description: >-
        TLS for the connection to the SOCKS5 proxy. The SOCKS5 negotiation and
        the tunneled traffic both run inside the TLS session, so the proxy
        credentials are not sent in the clear. This secures only the hop to the
        proxy; what the proxy does onward is its own concern. A half-close from
        the sandbox reaches the proxy as a TLS close_notify, not a TCP FIN, and
        a proxy that treats close_notify as a full close cuts the reply short.
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: >-
            Connect to the proxy over TLS. When false, no other field in this
            object may be set.
        serverName:
          type: string
          maxLength: 253
          description: >-
            Name to verify the proxy certificate against, and to send as SNI.
            Defaults to the host part of address. Set this only when the
            certificate does not match the address the proxy is reached at.
        caCert:
          type: string
          maxLength: 8192
          description: >-
            One or more PEM-encoded certificates to verify the proxy against,
            for a proxy fronted by a private CA. These replace the system trust
            store, which is what is used when this is omitted. The system trust
            store depends on the host the orchestrator runs on, so set this to
            get the same verification everywhere.

    SandboxAutoResumeEnabled:
      type: boolean
      description: Auto-resume enabled flag for paused sandboxes. Default false.
      default: false

    SandboxAutoResumeConfig:
      type: object
      description: Auto-resume configuration for paused sandboxes.
      required:
        - enabled
      properties:
        enabled:
          $ref: "#/components/schemas/SandboxAutoResumeEnabled"

    SandboxOnTimeout:
      type: string
      description: Action taken when the sandbox times out.
      enum:
        - kill
        - pause

    SandboxLifecycle:
      type: object
      description: Sandbox lifecycle policy returned by sandbox info.
      required:
        - autoResume
        - onTimeout
      properties:
        autoResume:
          type: boolean
          description: Whether the sandbox can auto-resume.
        onTimeout:
          $ref: "#/components/schemas/SandboxOnTimeout"

    EnvdUnresponsiveAtPause:
      type: boolean
      description: >-
        True when the snapshot a paused sandbox would resume from was taken
        while the sandbox guest agent was not responding. A plain resume of
        it is refused with 409 and error_code
        sandbox_snapshot_guest_agent_unresponsive, because restoring that
        memory would bring the unresponsive agent back; resume it without
        memory (`memory: false`), which cold-boots the sandbox from its disk.
        Omitted for a running sandbox and for a snapshot whose agent
        answered.

    SandboxPauseMode:
      type: string
      description: >-
        What the sandbox's latest pause saved. `full` saved the filesystem and
        the memory, and resuming restores the sandbox where it left off.
        `filesystem` saved only the filesystem, and resuming reboots the
        sandbox from disk. Returned for a paused sandbox once its pause has
        finished, and omitted while it is still pausing.
      enum:
        - full
        - filesystem

    SandboxLog:
      description: Log entry with timestamp and line
      required:
        - timestamp
        - line
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the log entry
        line:
          type: string
          description: Log line content

    SandboxLogEntry:
      required:
        - timestamp
        - level
        - message
        - fields
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the log entry
        message:
          type: string
          description: Log message content
        level:
          $ref: "#/components/schemas/LogLevel"
        fields:
          type: object
          additionalProperties:
            type: string

    SandboxLogs:
      required:
        - logs
        - logEntries
      properties:
        logs:
          description: Logs of the sandbox
          type: array
          items:
            $ref: "#/components/schemas/SandboxLog"
        logEntries:
          description: Structured logs of the sandbox
          type: array
          items:
