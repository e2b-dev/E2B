        "500":
          $ref: "#/components/responses/500"

  /unstable/management/projects/{projectID}/settings:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: managementSetProjectSettings
      summary: Apply a project's settings revision.
      description: >-
        Replaces the complete project settings document when the revision is
        newer than the stored revision. Omitted settings are removed. Older
        and duplicate revisions leave the stored document unchanged. Every
        successful delivery invalidates the cached team. Answers 404 when the
        project is missing or deleted.
      tags: [admin]
      security:
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementProjectSettingsRequest"
      responses:
        "204":
          description: Project settings are applied or already superseded.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /unstable/management/projects/{projectID}/block:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: managementApplyProjectBlock
      summary: Apply a project's block state.
      description: >-
        Records whether the project is refused billable work, which the auth
        path reads before it lets a sandbox start. An older or duplicate
        revision is accepted without changing target state. Answers 404 when
        the project is missing or deleted.
      tags: [admin]
      security:
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementProjectBlockRequest"
      responses:
        "204":
          description: Block state is applied or already superseded.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /unstable/management/projects/{projectID}/ban:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: managementApplyProjectBan
      summary: Apply a project's ban state.
      description: >-
        Records whether the project is banned. Authentication refuses a banned
        project's API keys and members. A revision that turns the ban on also
        kills the project's running sandboxes and cancels its builds in the
        background, and retries while the project stays banned and any of
        them remain. The newest revision wins: an older or duplicate revision is
        accepted without changing target state. Answers 404 when the project
        is missing or deleted.
      tags: [admin]
      security:
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementProjectBanRequest"
      responses:
        "204":
          description: Ban state is applied or already superseded.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /unstable/admin/teams/query:
    post:
      summary: List teams as admin
      description: |
        Lists teams matching the filters in the request body, with each team's
        member count, and its running sandbox count when sorted by running
        sandboxes. A read despite the POST: the body carries a project ID list
        too long for a query string.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTeamListRequest"
      responses:
        "200":
          description: The page of matching teams and the number of all matching teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTeamList"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"

  /unstable/admin/teams/bans:
    post:
      operationId: adminBanTeams
      summary: Ban teams
      description: |
        Bans up to 100 teams at once, as
        `PUT /unstable/admin/teams/{teamID}/ban` does, except that every
        team's ban is stored before any team's sandboxes are killed or builds
        cancelled, and the kills and cancellations of all teams share one time
        budget. One team's failure does not stop the others; the response sorts
        every requested team into banned, not found or failed. The work
        continues if the caller disconnects.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTeamsBanRequest"
      responses:
        "200":
          description: The outcome for every requested team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTeamsBanResult"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"

  /unstable/admin/teams/{teamID}:
    get:
      summary: Team as admin
      description: Returns a team with its sandbox scheduling labels and cluster. It also answers for a banned or blocked team.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - name: teamID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Team ID
      responses:
        "200":
          description: The team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTeam"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"

  /unstable/admin/teams/{teamID}/scheduling-labels:
    put:
      summary: Replace a team's sandbox scheduling labels
      description: |
        Replaces the labels that place the team's new sandboxes on matching
        nodes. Labels are deduplicated, keeping the first occurrence of each.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - name: teamID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Team ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTeamSchedulingLabels"
      responses:
        "200":
          description: The labels as written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTeamSchedulingLabels"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"

  /unstable/admin/teams/{teamID}/ban:
    parameters:
      - name: teamID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Team ID
    put:
      operationId: adminBanTeam
      summary: Ban a team
      description: |
        Marks the team as banned so its API keys stop authenticating, then
        kills its sandboxes and cancels its builds. The ban is stored first:
        a failure to kill or cancel is reported in the result and does not
        undo it. Killing and cancelling stop after a fixed time budget, and a
        step cut short is reported as failed. Banning an already banned team
        repeats the kill and cancel. The work continues if the caller
        disconnects.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      responses:
        "200":
          description: The team is banned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTeamBanResult"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"
    delete:
      operationId: adminUnbanTeam
      summary: Unban a team
      description: Clears the team's ban. Idempotent.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      responses:
        "204":
          description: The team is not banned
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"

  /unstable/admin/clusters:
    get:
      operationId: adminListClusters
      summary: List clusters as admin
      description: Lists the registered clusters with the number of teams assigned to each. Never returns a cluster's token. The local cluster is not a registered cluster and is not listed.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of clusters to return
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of matching clusters to skip
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: search
          in: query
          required: false
          description: Case-insensitive substring match on the cluster name or endpoint
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          description: Column to order by
          schema:
            type: string
            enum:
              - endpoint
              - name
              - teamCount
            default: endpoint
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
            x-enum-varnames:
              - AdminListClustersSortOrderAsc
              - AdminListClustersSortOrderDesc
      responses:
        "200":
          description: The page of matching clusters and the number of all matching clusters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterListResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"
    post:
      operationId: adminCreateCluster
      summary: Create a cluster as admin
      description: Creates a cluster whose configuration cannot be modified through this route. A new cluster starts with deletion protection turned on. Creating a cluster again with the same `cluster_id` and an identical configuration answers 201 with the stored cluster, whose deletionProtection is whatever is stored; a different configuration, or an auth organization another cluster uses, returns 409 with error_code cluster_registration_conflict. An invalid request returns 400 with error_code cluster_registration_invalid.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminClusterCreateRequest"
      responses:
        "201":
          description: Cluster created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterDetail"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /unstable/admin/clusters/{clusterID}:
    parameters:
      - $ref: "#/components/parameters/clusterID"
    get:
      operationId: adminGetCluster
      summary: Cluster as admin
      description: Returns a cluster with the first page of its assigned teams, the number of teams assigned to it and the number of live templates on it. Never returns the cluster's token.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - name: teamsLimit
          in: query
          required: false
          description: Page size for the embedded teams page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: teamsOffset
          in: query
          required: false
          description: Offset for the embedded teams page
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        "200":
          description: The cluster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterDetailWithTeams"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    patch:
      operationId: adminUpdateCluster
      summary: Update a cluster as admin
      description: >-
        Writes only the properties present in the body. `endpoint` and
        `endpointTls` change where orchestration traffic for every team on the
        cluster goes, `sandboxProxyDomain` changes the public URL of every
        sandbox on it, and `authOrgId` changes how the cluster authenticates.
        A body with no property returns 400. Another cluster using the auth organization
        returns 409, and so does turning deletion protection on after the
        cluster's deletion is recorded. The token is rotated through
        `PUT /unstable/admin/clusters/{clusterID}/token`.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterUpdateRequest"
      responses:
        "200":
          description: The cluster as updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterDetail"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
    delete:
      operationId: adminDeleteCluster
      summary: Delete a cluster and its environments as admin
      description: Deletes a cluster after all team assignments are detached. In the same transaction, soft-deletes every live template, snapshot template and paused sandbox snapshot on the cluster, releases their aliases, and releases all environment references while preserving environment and build history. A team assignment rejects the deletion and leaves the environments untouched, and so does deletion protection on the cluster. The local cluster's nil ID is rejected. Repeating a completed deletion succeeds.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      responses:
        "204":
          description: Cluster deleted or already absent.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /unstable/admin/clusters/{clusterID}/teams:
    parameters:
      - $ref: "#/components/parameters/clusterID"
    get:
      operationId: adminListClusterTeams
      summary: List a cluster's teams as admin
      description: Lists the teams assigned to the cluster.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of teams to return
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of teams to skip
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: sortBy
          in: query
          required: false
          description: Column to order by
          schema:
            type: string
            enum:
              - createdAt
              - name
            default: createdAt
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
            x-enum-varnames:
              - AdminListClusterTeamsSortOrderAsc
              - AdminListClusterTeamsSortOrderDesc
      responses:
        "200":
          description: The page of teams assigned to the cluster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterTeamListResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /unstable/admin/clusters/{clusterID}/token:
    parameters:
      - $ref: "#/components/parameters/clusterID"
    put:
      operationId: adminRotateClusterToken
      summary: Rotate a cluster's token as admin
      description: Replaces the token used to reach the cluster. The previous token stops working at once. No route returns a cluster's token.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterTokenRotateRequest"
      responses:
        "204":
          description: Token rotated.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /unstable/admin/templates/aliases:
    get:
      summary: Search template aliases as admin
      description: >
        Finds the templates whose ID equals `search`, or that own an alias equal to `search` in any
        namespace, with their owning team and all their aliases. Deleted templates are left out.
        Results are ordered by template ID; the next page's token is returned in `X-Next-Token`.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - name: search
          in: query
          required: true
          description: Exact template ID or alias
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/paginationNextToken"
        - $ref: "#/components/parameters/paginationLimit"
      responses:
        "200":
          description: Successfully returned the matching templates
          headers:
            X-Next-Token:
              $ref: "#/components/headers/XNextToken"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTemplateAliases"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"
    post:
      summary: Add a template alias without a namespace as admin
      description: >
        Adds an alias without a namespace to a template, so the template resolves by that name for
        every team. The alias follows the rules of template names (lowercase letters, digits, `-`
        and `_`) and cannot equal a template ID. Returns 404 when the template does not exist and
        409 when the alias is taken.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTemplateAliasCreateRequest"
      responses:
        "201":
          description: The alias was added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplateAlias"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /unstable/admin/templates/aliases/{aliasID}:
    delete:
      summary: Remove a template alias without a namespace as admin
      description: >
        Removes an alias without a namespace. A namespaced alias is not removed and answers 404.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/aliasID"
      responses:
        "200":
          description: The alias was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplateAliasDeleted"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /unstable/admin/templates/defaults:
    post:
      summary: Add a default template as admin
      description: >
        Makes a template one of the platform's default templates. Returns 404 when the template
        does not exist and 409 when it is already a default template.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDefaultTemplateCreateRequest"
      responses:
        "201":
          description: The template is now a default template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDefaultTemplate"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /unstable/admin/templates/defaults/{templateID}:
    patch:
      summary: Update a default template as admin
      description: Updates the description of a default template. Returns 404 when the template is not a default template.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/templateID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDefaultTemplateUpdateRequest"
      responses:
        "200":
          description: The default template was updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDefaultTemplate"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    delete:
      summary: Remove a default template as admin
      description: >
        Stops a template being one of the platform's default templates. The template itself is not
        changed. Returns 404 when the template is not a default template.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/templateID"
      responses:
        "204":
          description: The template is no longer a default template
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /unstable/admin/templates/lookup:
    get:
      summary: Look up a template as admin
      description: >
        Resolves `query` as, in order: a build ID (a UUID, matched to the template of the build's
        newest assignment, with no fallback), a template ID, or a template name (`namespace/alias`,
        or an alias without a namespace). Returns the template with its owning team and its newest
        builds. Deleted templates are not found.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - name: query
          in: query
          required: true
          description: Build ID, template ID, or template name
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Successfully resolved the template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplateLookup"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api-keys:
    get:
      summary: List team API keys
      x-api-group: list
      description: List all team API keys
      tags: [api-keys]
      security:
        - AuthProviderBearerAuth: []
          AuthProviderTeamAuth: []
        - AdminApiKeyAuth: []
          AdminTeamAuth: []
        - AdminJWTAuth: []
          AdminTeamAuth: []
      responses:
        "200":
          description: Successfully returned all team API keys
          content:
            application/json:
              schema:
                type: array
                items:
