    delete:
      summary: Terminate an instance of a rig
      description: >
        Terminate an instance in whichever rig's scaling group it belongs to.
        The caller chooses whether the rig shrinks or the instance is replaced.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/clusterID"
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
          description: Provider instance ID
        - name: decrementDesired
          in: query
          required: true
          schema:
            type: boolean
          description: >
            When true, desired capacity is decremented (rig shrinks);
            when false, the scaling group launches a replacement instance
      responses:
        "202":
          description: Instance termination accepted
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
