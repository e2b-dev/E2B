  /unstable/admin/sandboxes/{sandboxID}/builds:
    get:
      summary: List the builds of a sandbox's snapshot template
      description: |
        Lists the build assignments of the template that holds the sandbox's
        snapshot under one tag. Assignments without a creation time are left
        out. A sandbox without a snapshot returns no items and a null
        `snapshotTemplateID`; this route does not report whether the sandbox
        exists.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/sandboxID"
        - name: statusGroup
          in: query
          required: false
          description: Only list builds in these status groups, comma-separated. Omit to list every group.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AdminSandboxBuildStatusGroup"
        - name: tag
          in: query
          required: false
          description: Tag whose assignments are listed
          schema:
            type: string
            minLength: 1
            default: default
        - name: order
          in: query
          required: false
          description: Direction of the assignment time order
          schema:
            $ref: "#/components/schemas/OrderDirection"
        - name: limit
          in: query
          required: false
          description: Maximum number of builds to return
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of matching builds to skip
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of the snapshot template's build assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSandboxBuildList"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"

