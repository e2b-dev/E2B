    ResumedSandbox:
      properties:
        timeout:
          type: integer
          format: int32
          minimum: 0
          default: 15
          description: Time to live for the sandbox in seconds.
        cpuCount:
          allOf:
            - $ref: "#/components/schemas/CPUCount"
          description: >-
            Online vCPU target for the resumed sandbox. Defaults to the
            snapshot's cpuCount; at most the template's maxCpuCount
            (fixed-size templates accept only their cpuCount).
        autoPause:
          type: boolean
          deprecated: true
          description: Automatically pauses the sandbox after the timeout
        memory:
          type: boolean
          description: >-
            Defaults to true. When false, resume from disk state only: the sandbox cold-boots fresh and
            any memory in the snapshot is ignored, never modified or deleted. Disk
            state has crash-recovery semantics — writes not flushed before the pause
            may be lost. A no-op for snapshots that contain no memory. Rejected with
            an error in environments where this capability is not enabled, never
            silently downgraded to a memory restore. A snapshot taken while the
            sandbox guest agent was not responding (envdUnresponsiveAtPause) can
            only be resumed this way, and needs no enablement.

    ConnectSandbox:
      type: object
      required:
        - timeout
      properties:
        timeout:
          description: Timeout in seconds from the current time after which the sandbox should expire
          type: integer
          format: int32
          minimum: 0
        memory:
          type: boolean
          description: >-
            Defaults to true. When false and the sandbox is paused, resume from disk state only: the
            sandbox cold-boots fresh and any memory in the snapshot is ignored, never
            modified or deleted. Disk state has crash-recovery semantics — writes not
            flushed before the pause may be lost. A no-op for snapshots that contain
            no memory. Rejected with an error in environments where this capability
            is not enabled, never silently downgraded to a memory restore. A
            snapshot taken while the sandbox guest agent was not responding
            (envdUnresponsiveAtPause) can only be resumed this way, and needs no
            enablement.

    ConnectSandboxV2:
      type: object
      properties:
        timeout:
          description: Timeout in seconds from the current time after which the sandbox should expire
          type: integer
          format: int32
          minimum: 1
          default: 300
        memory:
          type: boolean
          description: >-
            Defaults to true. When false and the sandbox is paused, resume from disk state only: the
            sandbox cold-boots fresh and any memory in the snapshot is ignored, never
            modified or deleted. Disk state has crash-recovery semantics — writes not
            flushed before the pause may be lost. A no-op for snapshots that contain
            no memory. Rejected with an error in environments where this capability
            is not enabled, never silently downgraded to a memory restore. A
            snapshot taken while the sandbox guest agent was not responding
            (envdUnresponsiveAtPause) can only be resumed this way, and needs no
            enablement.

    SandboxTimeoutRequest:
      type: object
      required:
        - timeout
      properties:
        timeout:
          description: Timeout in seconds from the current time after which the sandbox should expire
          type: integer
          format: int32
          minimum: 0

    SandboxRefreshRequest:
      type: object
      properties:
        duration:
          description: Duration for which the sandbox should be kept alive in seconds
          type: integer
          maximum: 3600 # 1 hour
          minimum: 0

    SandboxSnapshotRequest:
      type: object
      properties:
        name:
          type: string
          description: Optional name for the snapshot template. If a snapshot template with this name already exists, a new build will be assigned to the existing template instead of creating a new one.
        memory:
          type: boolean
          description: >-
            Whether to capture a full memory snapshot. When false, only the
            filesystem is persisted: the snapshot is smaller and faster to take,
            and sandboxes created from it cold-boot (start fresh from disk)
            instead of restoring memory, so they begin without the source
            sandbox's running processes, in-memory state, and open connections.
            The source sandbox keeps running in both cases. Defaults to true.

    SandboxPauseRequest:
      type: object
      properties:
        memory:
          type: boolean
          default: true
          description: >-
            Whether to capture a full memory snapshot. When false, only the
            filesystem is persisted and resuming the sandbox cold-boots
            (reboots) it from disk, losing in-memory state, running processes,
            and open connections. Resume it with an explicit request (connect or
            resume); auto-resume, which can be triggered by arbitrary traffic,
            refuses such a sandbox. Defaults to true.
        requireHealthyGuest:
          type: boolean
          default: false
          description: >-
            The pause checks that the sandbox guest agent answers before it
            takes the snapshot. By default an unresponsive agent is recorded
            on the snapshot and the pause proceeds; the sandbox then shows
            `envdUnresponsiveAtPause` and a later resume must ask for
            `memory: false`, since restoring that memory would bring the
            unresponsive agent back. With this true, the pause is instead
            refused with 503 while the agent does not answer, and the sandbox
            keeps running. A filesystem-only pause (`memory: false`) is always
            refused while the agent does not answer, whatever this says.

    SandboxForkRequest:
      type: object
      properties:
        timeout:
          type: integer
          format: int32
          minimum: 0
          default: 15
          description: Time to live for the new forked sandboxes in seconds.
        count:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 1
          description: >-
            Number of forked sandboxes to create. All forks boot from the same
            snapshot, so the snapshot is captured once regardless of count.
            Each fork succeeds or fails independently; the outcome of each is
            reported in its entry of the response list.

    SandboxForkResult:
      type: object
      description: >-
        Result of one requested fork. Exactly one of sandbox or error is set:
        sandbox when the fork started successfully, error when it failed to
        start.
      properties:
        sandbox:
          $ref: "#/components/schemas/Sandbox"
        error:
          $ref: "#/components/schemas/Error"

