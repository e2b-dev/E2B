          description: The matching assignment is absent.
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /unstable/management/projects/{projectID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: managementUpsertProject
      summary: Create or reconcile a project.
      tags: [admin]
      security:
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementProjectUpsertRequest"
      responses:
        "200":
          description: Existing project reconciled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementProject"
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementProject"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
    delete:
      operationId: managementDeleteProject
      summary: Soft-delete a project.
      description: >-
        Marks the project deleted and blocked, releases its cluster assignment,
        scrubs its name and email to DELETED and its slug to
        deleted-<project ID>, which releases the old slug for reuse, deletes
        its memberships and API keys, soft-deletes its templates and
        snapshots, and enqueues the teardown of its running sandboxes, all in
        one transaction. The project row remains. Afterwards the project
        answers 404 to other management writes. Repeating the call answers
        204 and repeats every step except the deletion time: it re-blocks and
        re-scrubs the project, clears a cluster assignment written since,
        deletes any memberships, keys, templates or snapshots created since,
        and enqueues the teardown again.
      tags: [admin]
      security:
        - AdminJWTAuth: []
      responses:
        "204":
          description: Project is deleted and its teardown is enqueued.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /unstable/management/projects/{projectID}/members/{userID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
