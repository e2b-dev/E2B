        - AdminSandboxStatePaused
        - AdminSandboxStateKilled

    AdminSandboxBuildStatusGroup:
      type: string
      description: |
        Coarse build state derived from the build status: pending (pending,
        waiting), in_progress (in_progress, building, snapshotting), ready
        (ready, uploaded, success) or failed (any other status)
      enum:
        - pending
        - in_progress
        - ready
        - failed
      x-enum-varnames:
        - AdminSandboxBuildStatusGroupPending
        - AdminSandboxBuildStatusGroupInProgress
        - AdminSandboxBuildStatusGroupReady
        - AdminSandboxBuildStatusGroupFailed

    AdminSandboxBuild:
      type: object
      description: A build assigned to a sandbox's snapshot template under a tag
      required:
        - buildID
        - templateID
        - tag
        - status
        - statusGroup
        - clusterNodeID
        - assignedAt
        - isCurrent
        - restorable
      properties:
        buildID:
          type: string
          format: uuid
          description: Identifier of the build
        templateID:
          type: string
          description: Identifier of the snapshot template the build is assigned to
        tag:
          type: string
          description: Tag the build is assigned under
        status:
          type: string
          description: Build status as stored, for example ready, snapshotting or waiting
        statusGroup:
          $ref: "#/components/schemas/AdminSandboxBuildStatusGroup"
        clusterNodeID:
          type: string
          nullable: true
          description: Node that produced the build, null when it was not recorded
        assignedAt:
          type: string
          format: date-time
          description: When the build was assigned to the template under this tag
        isCurrent:
          type: boolean
          description: |
            Whether this build is the template's newest ready assignment under
            the tag, the build a resume uses, regardless of the status filter
        restorable:
          type: boolean
          description: |
            Whether the restore route would accept this build: it is ready,
            assigned under the default tag, not the current build, and its
            snapshot template is not deleted

    AdminSandboxBuildList:
      type: object
      required:
        - items
        - total
        - snapshotTemplateID
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminSandboxBuild"
        total:
          type: integer
          format: int64
          description: Number of assignments matching the tag and status filter, ignoring limit and offset
        snapshotTemplateID:
          type: string
          nullable: true
          description: |
            Identifier of the template that holds the sandbox's snapshot, null
            when the sandbox has no snapshot

    AdminSandboxBuildRestoreRequest:
      type: object
      required:
        - buildID
      properties:
        buildID:
          type: string
          format: uuid
          description: |
            Build to make current. It must be ready and already assigned to the
            sandbox's snapshot template under the default tag.

    AdminSandboxBuildRestoreResult:
      type: object
      required:
        - sandboxID
        - templateID
        - buildID
        - assignedAt
        - previousBuildID
      properties:
        sandboxID:
          type: string
          description: Identifier of the sandbox
        templateID:
          type: string
          description: Identifier of the snapshot template that received the assignment
        buildID:
          type: string
          format: uuid
          description: Build that is now the template's current default build
        assignedAt:
          type: string
          format: date-time
          description: When the new assignment was written
        previousBuildID:
          type: string
          format: uuid
          nullable: true
          description: Build that was current before the restore, null when there was none

    AdminSandboxOverview:
      type: object
      description: |
        Who owns a sandbox and what its snapshot holds, read from the database:
        the team, the snapshot template and its most recent pause, and the
        newest default-tag build assignment of that template
      required:
        - sandboxId
        - team
        - snapshotTemplateId
        - lastPause
        - latestBuild
        - buildCount
      properties:
        sandboxId:
          type: string
          description: Identifier of the sandbox
        team:
          $ref: "#/components/schemas/AdminSandboxOverviewTeam"
        snapshotTemplateId:
          type: string
          nullable: true
          description: Template that holds the sandbox's snapshot, null when the sandbox has no snapshot
        lastPause:
          allOf:
            - $ref: "#/components/schemas/AdminSandboxLastPause"
          nullable: true
          description: What the most recent pause recorded, null when the sandbox has no snapshot
        latestBuild:
          allOf:
            - $ref: "#/components/schemas/AdminSandboxOverviewBuild"
          nullable: true
          description: |
            Newest default-tag build assignment of the snapshot template, null
            when there is no snapshot or no assignment
        buildCount:
          type: integer
          format: int64
          description: Number of default-tag build assignments of the snapshot template

    AdminSandboxOverviewTeam:
      type: object
      description: The team the sandbox belongs to
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the team
        name:
          type: string
          nullable: true
          description: Name of the team
        email:
          type: string
          nullable: true
          description: Contact email of the team

    AdminSandboxLastPause:
      type: object
      description: |
        The snapshot as the most recent pause left it. A resume can change
        whether the sandbox auto-pauses without rewriting it, and restoring an
        older build does not change it.
      required:
        - kind
        - autoPause
        - autoPauseKind
      properties:
        kind:
          allOf:
            - $ref: "#/components/schemas/AdminSandboxPauseKind"
          description: Kind of snapshot the most recent pause took
        autoPause:
          type: boolean
          description: Whether the sandbox pauses instead of being killed on timeout, as of the most recent pause
        autoPauseKind:
          allOf:
            - $ref: "#/components/schemas/AdminSandboxPauseKind"
          description: Kind of snapshot an auto-pause takes, as of the most recent pause

    AdminSandboxPauseKind:
      type: string
      description: |
        What a pause kept: memory is a full snapshot that resumes where the
        sandbox left off, filesystem keeps only the root filesystem and boots
        it again on resume
      enum:
        - memory
        - filesystem
      x-enum-varnames:
        - AdminSandboxPauseKindMemory
        - AdminSandboxPauseKindFilesystem

    AdminSandboxOverviewBuild:
      type: object
      description: The newest default-tag build assignment of a sandbox's snapshot template
      required:
        - buildId
        - templateId
        - tag
        - status
        - statusGroup
        - clusterNodeId
        - assignedAt
        - isCurrent
        - restorable
      properties:
        buildId:
          type: string
          format: uuid
          description: Identifier of the build
        templateId:
          type: string
          description: Identifier of the snapshot template the build is assigned to
        tag:
          type: string
          description: Tag the build is assigned under
        status:
          type: string
          description: Build status as stored, for example ready, snapshotting or waiting
        statusGroup:
          allOf:
            - $ref: "#/components/schemas/AdminSandboxBuildStatusGroup"
          nullable: true
          description: Coarse build state, null when the stored group is not one of the known values
        clusterNodeId:
          type: string
          nullable: true
          description: Node that produced the build, null when it was not recorded
        assignedAt:
          type: string
          format: date-time
          description: When the build was assigned to the template under the tag
        isCurrent:
          type: boolean
          description: Always true, the newest assignment is the one the template resolves to
        restorable:
          type: boolean
          description: Always false, the newest assignment is already current

    AdminTeamRunningSandboxCounts:
      type: object
      description: |
        Cached live sandbox index count keyed by team ID. Counts may briefly
        include sandboxes transitioning out of running; teams without indexed
        sandboxes are omitted.
      additionalProperties:
        type: integer
        format: int64
        minimum: 1

    AdminBuildCancelResult:
      required:
        - cancelledCount
        - failedCount
      properties:
        cancelledCount:
          type: integer
          description: Number of builds successfully cancelled
        failedCount:
          type: integer
          description: Number of builds that failed to cancel

    AdminTeamListRequest:
      type: object
      properties:
        projectIds:
          type: array
          description: Only list these teams. An empty list matches no team; omit it to list every team.
          items:
            type: string
            format: uuid
        search:
          type: string
          description: A team ID, as a UUID or public project ID, matches that team exactly. Any other text matches a substring of the email, name or slug, ignoring case.
        hideBanned:
          type: boolean
          default: false
          description: Leave out banned teams
        hideBlocked:
          type: boolean
          default: false
          description: Leave out blocked teams
        createdAfter:
          type: string
          format: date-time
          description: Only list teams created at or after this time
        createdBefore:
          type: string
          format: date-time
          description: Only list teams created at or before this time
        sortBy:
          $ref: "#/components/schemas/AdminTeamListSortField"
        sortOrder:
          allOf:
            - $ref: "#/components/schemas/OrderDirection"
          description: Ignored when `sortBy` is omitted.
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 50
          description: Maximum number of teams to return
        offset:
          type: integer
          format: int32
          minimum: 0
          default: 0
          description: Number of matching teams to skip

    AdminTeamListSortField:
      type: string
      description: |
        Column to order by, with newer teams first among equal values. Omit it
        to list the newest teams first.
      enum:
        - name
        - email
        - createdAt
        - runningSandboxes
      x-enum-varnames:
        - AdminTeamListSortFieldName
        - AdminTeamListSortFieldEmail
        - AdminTeamListSortFieldCreatedAt
        - AdminTeamListSortFieldRunningSandboxes

    AdminTeamList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminTeamListItem"
        total:
          type: integer
          format: int64
          description: Number of teams matching the filters, ignoring limit and offset

    AdminTeamListItem:
      type: object
      required:
        - id
        - email
        - name
        - isBanned
        - isBlocked
        - createdAt
        - memberCount
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        isBanned:
          type: boolean
        isBlocked:
          type: boolean
        createdAt:
          type: string
          format: date-time
        memberCount:
          type: integer
          format: int64
          description: Number of users in the team
        runningSandboxCount:
          type: integer
          format: int64
          minimum: 0
          description: Running sandboxes from the same cached snapshot as `GET /admin/sandboxes/running-counts`. Present only when the list is sorted by `runningSandboxes`.

    AdminTeam:
      type: object
      required:
        - id
        - email
        - name
        - slug
        - createdAt
        - isBlocked
        - isBanned
        - sandboxSchedulingLabels
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        slug:
          type: string
        createdAt:
          type: string
          format: date-time
        isBlocked:
          type: boolean
        isBanned:
          type: boolean
        blockedReason:
          type: string
          nullable: true
        sandboxSchedulingLabels:
          type: array
          items:
            type: string
        clusterId:
          type: string
          format: uuid
          nullable: true
        clusterName:
          type: string
          nullable: true

    AdminTeamSchedulingLabels:
      type: object
      required:
        - labels
      properties:
        labels:
          type: array
          maxItems: 20
          description: The team's full set of labels. A request's labels replace the current ones.
          items:
            type: string
            minLength: 1
            maxLength: 63
            pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$

    AdminTeamBanResult:
      type: object
      description: |
        The outcome of banning one team. The ban is stored before the team's
        sandboxes are killed and its builds cancelled, so it holds even when
        either step fails.
      required:
        - teamID
        - sandboxesKilled
        - sandboxesFailedToKill
        - buildsCancelled
        - buildsFailedToCancel
      properties:
        teamID:
          type: string
          format: uuid
        sandboxesKilled:
          type: integer
          description: Number of the team's sandboxes killed
        sandboxesFailedToKill:
          type: integer
          description: Number of the team's sandboxes that failed to kill
        sandboxKillError:
          type: string
          description: Set when the kill step failed or ran out of time; the counts cover what it did until then.
        buildsCancelled:
          type: integer
          description: Number of the team's builds cancelled
        buildsFailedToCancel:
          type: integer
          description: Number of the team's builds that failed to cancel
        buildCancelError:
          type: string
          description: Set when the cancel step failed or ran out of time; the counts cover what it did until then.

    AdminTeamsBanRequest:
      type: object
      required:
        - teamIDs
      properties:
        teamIDs:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid

    AdminTeamsBanResult:
      type: object
      required:
        - banned
        - notFound
        - failed
      properties:
        banned:
          type: array
          description: Teams whose ban is stored, with the outcome of killing their sandboxes and cancelling their builds
          items:
            $ref: "#/components/schemas/AdminTeamBanResult"
        notFound:
          type: array
          description: Requested teams that do not exist
          items:
            type: string
            format: uuid
        failed:
          type: array
          description: Teams whose ban could not be stored or put into force; retrying repeats every step
          items:
            $ref: "#/components/schemas/AdminTeamBanFailure"

    AdminTeamBanFailure:
      type: object
      required:
        - teamID
        - error
      properties:
        teamID:
          type: string
          format: uuid
        error:
          type: string

    AdminTemplateTeam:
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the team that owns the template
        name:
          type: string
          description: Name of the team
        email:
          type: string
          description: Contact email of the team

    AdminTemplateAlias:
      required:
        - id
        - templateID
        - alias
        - namespace
        - isRenamable
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the alias
        templateID:
          type: string
          description: Identifier of the template the alias resolves to
        alias:
          type: string
          description: The alias
        namespace:
          type: string
          nullable: true
          description: Namespace of the alias, or null for an alias that resolves for every team
        isRenamable:
          type: boolean
          description: Whether building the template under another name replaces the alias

    AdminTemplateAliases:
      required:
        - templateID
        - public
        - team
        - aliases
      properties:
        templateID:
          type: string
          description: Identifier of the template
        public:
          type: boolean
          description: Whether the template is public
        team:
          $ref: "#/components/schemas/AdminTemplateTeam"
        aliases:
          type: array
          description: All aliases of the template, those without a namespace first
          items:
            $ref: "#/components/schemas/AdminTemplateAlias"

    AdminTemplateAliasCreateRequest:
      required:
        - templateID
        - alias
      properties:
        templateID:
          type: string
          minLength: 1
          description: Identifier of the template the alias resolves to
        alias:
          type: string
          minLength: 1
          maxLength: 128
          description: The alias, without a namespace or tag

    AdminTemplateAliasDeleted:
      required:
        - aliasID
        - templateID
        - alias
      properties:
        aliasID:
          type: string
          format: uuid
          description: Identifier of the removed alias
        templateID:
          type: string
          description: Identifier of the template the alias resolved to
        alias:
          type: string
          description: The removed alias

    AdminDefaultTemplate:
      required:
        - templateID
        - description
      properties:
        templateID:
          type: string
          description: Identifier of the default template
        description:
          type: string
          nullable: true
          description: Description of the default template

    AdminDefaultTemplateCreateRequest:
      required:
        - templateID
      properties:
        templateID:
          type: string
          minLength: 1
          description: Identifier of the template to make a default template
        description:
          type: string
          nullable: true
          maxLength: 1000
          description: Description of the default template; blank is stored as none

    AdminDefaultTemplateUpdateRequest:
      required:
        - description
      properties:
        description:
          type: string
          nullable: true
          maxLength: 1000
          description: New description of the default template; null or blank clears it

    AdminTemplateLookup:
      required:
        - templateID
        - team
        - names
        - public
        - createdAt
        - lastSpawnedAt
        - spawnCount
        - isSnapshot
        - snapshotSandboxID
        - matchedBuildID
        - builds
      properties:
        templateID:
          type: string
          description: Identifier of the template
        team:
          $ref: "#/components/schemas/AdminTemplateTeam"
        names:
          type: array
          description: Names of the template (namespace/alias format when namespaced)
          items:
            type: string
        public:
          type: boolean
          description: Whether the template is public
        createdAt:
          type: string
          format: date-time
          description: Time when the template was created
        lastSpawnedAt:
          type: string
          format: date-time
          nullable: true
          description: Time when the template was last used
        spawnCount:
          type: integer
          format: int64
          description: Number of times the template was used
        isSnapshot:
          type: boolean
          description: Whether the template is a snapshot of a sandbox
        snapshotSandboxID:
          type: string
          nullable: true
          description: The sandbox a snapshot template was taken from
        matchedBuildID:
          type: string
          format: uuid
          nullable: true
          description: The build the query matched, when it was a build ID
        builds:
          type: array
          description: The template's newest builds of any tag and status, newest first, at most 100
          items:
            $ref: "#/components/schemas/TemplateBuild"

    VolumeToken:
      type: object
      properties:
        token:
          type: string
      required:
        - token

    Template:
      required:
        - templateID
        - buildID
        - cpuCount
        - memoryMB
        - diskSizeMB
        - public
        - createdAt
        - updatedAt
        - createdBy
        - lastSpawnedAt
        - spawnCount
        - buildCount
        - envdVersion
        - aliases
        - names
        - buildStatus
      properties:
        templateID:
          type: string
          description: Identifier of the template
        buildID:
          type: string
          description: Identifier of the last successful build for given template
        cpuCount:
          $ref: "#/components/schemas/CPUCount"
        maxCpuCount:
          allOf:
            - $ref: "#/components/schemas/CPUCount"
          description: "Maximum CPU count for resizable templates; absent for fixed-size templates."
        memoryMB:
          $ref: "#/components/schemas/MemoryMB"
        diskSizeMB:
          $ref: "#/components/schemas/DiskSizeMB"
        public:
          type: boolean
          description: Whether the template is public or only accessible by the team
        aliases:
          type: array
          description: Aliases of the template
          deprecated: true
          items:
            type: string
        names:
          type: array
          description: Names of the template (namespace/alias format when namespaced)
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          description: Time when the template was created
        updatedAt:
          type: string
          format: date-time
          description: Time when the template was last updated
        createdBy:
          allOf:
            - $ref: "#/components/schemas/TeamUser"
          nullable: true
        lastSpawnedAt:
          type: string
          nullable: true
          format: date-time
          description: Time when the template was last used
        spawnCount:
          type: integer
          format: int64
          description: Number of times the template was used
        buildCount:
          type: integer
          format: int32
          description: Number of times the template was built
        envdVersion:
          $ref: "#/components/schemas/EnvdVersion"
        buildStatus:
          $ref: "#/components/schemas/TemplateBuildStatus"
        isDefault:
          type: boolean
          description: >
            Whether the template is one of the platform's default templates. A default template
