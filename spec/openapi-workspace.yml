    InvitationPreview:
      description: What anyone with the invitation link sees. It never carries the invited address and never says whether that address has an account. An invitation that is not pending carries only its status, plus `workspace_id` for a caller already on the workspace's members list.
      properties:
        access:
          allOf:
            - $ref: '#/components/schemas/InvitedAccess'
