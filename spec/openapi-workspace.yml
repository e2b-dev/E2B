  /v1/workspaces/{workspaceID}/payment-methods:
    get:
      description: |-
        Requires `workspace:billing`, which workspace ownership grants. A workspace member without it is answered 403.
        Read from the payment provider on every call and stored nowhere in E2B, so what comes back is what the provider would charge. The default first, then newest first. A card carries its brand, last four digits, expiry and whether it has expired, decided against the current UTC month; a US bank account carries its bank's name, last four digits and account type; a method of another type is reported by identifier and type alone, so nothing the provider holds is hidden. A US bank account still waiting on micro-deposits is not a payment method yet and is reported apart, under pending_us_bank_accounts.
        default_payment_method_id names the method the workspace's invoices charge. It is omitted when there is none, in which case the workspace cannot be invoiced and its credit policy treats it as unable to pay.
        A workspace whose billing account has not been provisioned is answered 409, as on the credit route. A workspace holding no payment methods is answered 200 with an empty list, which is a different fact.
      operationId: listWorkspacePaymentMethods
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePaymentMethods'
          description: The workspace's payment methods, default first.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: The payment methods attached to the workspace's billing account.
      tags:
        - billing
    parameters:
      - $ref: '#/components/parameters/workspaceID'
  /v1/workspaces/{workspaceID}/payment-methods/{paymentMethodID}:
    delete:
      description: |-
        Requires `workspace:billing`.
        Permanent at the provider: a removed method cannot be reattached, only added again as a new one. The current default is refused with 409, the last method included, so a workspace keeps the way it pays; make another method the default first. A last method that never became the default can be removed. The removal is audited with the authenticated user as the actor.
        404 when the method is not attached to this workspace.
      operationId: removeWorkspacePaymentMethod
      responses:
        "204":
          description: The method is detached.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Remove a payment method from the workspace.
      tags:
        - billing
    parameters:
      - $ref: '#/components/parameters/workspaceID'
      - $ref: '#/components/parameters/paymentMethodID'
  /v1/workspaces/{workspaceID}/payment-methods/default:
    parameters:
      - $ref: '#/components/parameters/workspaceID'
    put:
      description: |-
        Requires `workspace:billing`.
        The method must be attached to the workspace, as the listing reports it, and a card must not have expired. The choice is written to the provider, on the customer and on the workspace's subscription, and audited with the authenticated user as the actor. Repeating the call with the current default changes nothing.
        404 when the method is not attached to this workspace. 409 for an expired card or a workspace whose billing account is not provisioned; the message says which. 409 with error_code payment_method_type_not_accepted when the workspace's invoice terms do not accept the method's type. 409 with error_code tax_location_invalid when the provider cannot work out a tax location for the workspace, which without a billing address comes from the card's billing details; the default is left as it was.
      operationId: setWorkspaceDefaultPaymentMethod
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDefaultPaymentMethodRequest'
        required: true
      responses:
        "204":
          description: The method is the default.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Choose the payment method the workspace's invoices charge.
      tags:
        - billing
  /v1/workspaces/{workspaceID}/payment-methods/setup-intent:
    parameters:
      - $ref: '#/components/parameters/workspaceID'
    post:
      description: |-
        Requires `workspace:billing`.
        Opens a Stripe SetupIntent for the workspace's customer and returns its client secret, which the client hands to Stripe Elements to collect and confirm a payment method, saved for off-session charging. payment_method_type picks what it collects: a card, the default, or a US bank account, which only a workspace whose invoice terms accept ACH debit may add; any other is answered 409 with error_code payment_method_type_not_accepted. A bank account is verified through the provider's bank linking, or, when the bank cannot be linked instantly, by micro-deposits the owner confirms later; until then the listing reports it under pending_us_bank_accounts.
        Nothing is recorded here: the confirmed method reaches the billing account through the provider's webhook, which also makes a workspace's first method its default unless the provider cannot work out a tax location from it, or the workspace's invoice terms do not accept its type. Such a method stays attached without becoming the default. An intent left unconfirmed costs nothing.
        Call it when the form is submitted rather than when it opens, so an abandoned form leaves nothing behind. The client secret lets its holder attach a card to this workspace; do not log it.
        A billing_address in the body is the one the card form collected. It becomes the workspace's billing address before the setup opens, and only when the workspace has none, so a later card never replaces it. An address the provider cannot place for tax is answered 409 with error_code tax_location_invalid, and no setup opens. A billing_name is stored as the workspace's name along with that address, and only when the workspace has no name of its own.
        409 when the workspace's billing account is not provisioned.
      operationId: createWorkspacePaymentMethodSetupIntent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentMethodSetupIntentRequest'
        required: false
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodSetupIntent'
          description: The setup to confirm on the client.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Open a provider setup for adding a payment method to the workspace.
      tags:
        - billing
  /v1/workspaces/{workspaceID}/plan:
    get:
      description: Requires workspace:read, so every member sees which features the workspace has. Reads the workspace add-ons in force, paid or granted by E2B, the features they unlock, scheduled endings, and the add-ons for sale with their catalogue prices from billing-api. Prices remain decimal strings. A workspace whose billing account has not been opened yet returns 409. Disabled or unavailable billing returns 503.
