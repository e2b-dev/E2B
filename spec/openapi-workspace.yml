  /v1/projects/{projectID}/usage:
    get:
      description: |-
        Requires project:read, granted by membership of the project's current workspace or by a direct project-member grant, so a project member reads the project's own usage without the workspace-wide workspace:billing grant. Authorization resolves the local project's current workspace on each read; an unknown local project returns 404.
        The figures cover the project's whole history, priced as its current workspace prices usage: usage recorded while the project was in another workspace is included as if it had been in this one, though that workspace was charged for it. Both bounds are optional; omitting both reads the project's full usage history up to now. The resolved window is included in the response.
        Usage arrives asynchronously and completeness is not reported. Quantities and amounts represent usage received so far, not an invoice or final charge. Credits and subscription/add-on fees are excluded.
        Any unpriced record fails the entire read with 500.
      operationId: getProjectUsage
      parameters:
        - description: Absent, the window begins where the project's usage does.
          in: query
          name: period_start
          required: false
          schema:
            format: date-time
            type: string
        - description: Absent, the window runs up to now. Given with period_start, it must be after it.
          in: query
          name: period_end
          required: false
          schema:
            format: date-time
            type: string
        - in: query
          name: grain
          required: false
          schema:
            $ref: '#/components/schemas/Grain'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUsageReport'
          description: The project's usage over the window.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Gross usage quantities and rated costs of one project, by meter and bucket.
      tags:
        - billing
    parameters:
      - $ref: '#/components/parameters/projectID'
