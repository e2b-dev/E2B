  /v1/projects/{projectID}/move:
    parameters:
      - $ref: '#/components/parameters/projectID'
    post:
      description: 'The caller must own both workspaces. Project-scoped grants remain in place; access inherited from the source workspace is revoked and access inherited from the destination workspace is granted. Personal workspaces cannot send or receive a project, and neither can a workspace with a SCIM directory (409) until the directory is removed. When billing is configured, a paid tier and paid add-ons move with the project. The source workspace has already paid for the current month and is not refunded; the destination workspace is not charged until the next monthly renewal and pays from then on, so it must have a default payment method, otherwise 409. Paid services cannot move into an enterprise workspace, and pending purchases block the move. Configured billing must be reachable. Unconfigured billing skips billing checks and resolution. A project with a move still being resolved by billing returns 409; retry after that resolution completes. After a lost response, read the project first: a move to its current workspace is a no-op. A successful response commits ownership locally; any billing resolution is asynchronous and must finish before another move.'
      operationId: moveProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveProjectRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: Project moved.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Move a project between standard workspaces.
      tags:
        - workspaces
