        spend_alert_usd:
          description: Same bounds as the limit. The resulting alert cannot exceed a configured limit. Null disables the alert.
          maxLength: 64
          minLength: 1
          nullable: true
          type: string
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
        spend_limit_usd:
          description: Positive decimal USD below 10000000000 with decimal exponent at least -10. Trailing zeros count toward precision. Null disables the limit.
          maxLength: 64
          minLength: 1
          nullable: true
          type: string
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
      type: object
    UpdateWorkspaceRequest:
