      description: How E2B bills the workspace and collects what it owes, with defaults filled in, so every field reads the same for a workspace that never agreed terms of its own.
      properties:
        billing_type:
          description: How the workspace's usage is billed this month. metered bills it on the workspace's subscription at catalogue prices; invoicing bills it on a monthly invoice E2B drafts; manual leaves it to E2B to bill outside the subscription. A self-serve workspace is always metered.
          enum:
            - metered
            - manual
            - invoicing
          type: string
        collection:
          description: charge_automatically charges the workspace's default payment method when an invoice is issued. send_invoice sends the invoice to be paid within days_until_due. A self-serve workspace is always charged automatically; an enterprise workspace without terms of its own is sent Net 30 invoices.
          enum:
            - charge_automatically
            - send_invoice
          type: string
        days_until_due:
          description: Days from an invoice being issued to payment falling due. Present for send_invoice alone.
          format: int32
          maximum: 365
          minimum: 1
          type: integer
        enterprise:
          description: Whether the workspace is billed as an enterprise customer, on terms agreed with E2B rather than through self-serve plans.
          type: boolean
        payment_methods:
          description: The ways the workspace's invoices can be paid. card for a self-serve workspace. ach_debit is a debit from a US bank account; bank_transfer is a wire or ACH credit the customer sends, and comes with send_invoice alone.
          items:
            enum:
              - card
              - ach_debit
              - bank_transfer
            type: string
          maxItems: 3
          minItems: 1
          type: array
          uniqueItems: true
      required:
        - enterprise
        - billing_type
        - collection
        - payment_methods
      type: object
    WorkspaceCluster:
      additionalProperties: false
      properties:
        control_plane_id:
          type: string
        created_at:
          format: date-time
          type: string
        deletion:
          $ref: '#/components/schemas/WorkspaceClusterDeletion'
        deployment_id:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        region:
          type: string
        registration:
          $ref: '#/components/schemas/WorkspaceClusterRegistration'
        updated_at:
          format: date-time
          type: string
        workspace_id:
          format: uuid
          type: string
      required:
        - id
        - workspace_id
        - name
        - control_plane_id
        - created_at
        - updated_at
      type: object
    WorkspaceClusterAction:
      discriminator:
        mapping:
          apply_plan: '#/components/schemas/AutoBYOCApplyPlanAction'
          clear_plan: '#/components/schemas/AutoBYOCClearPlanAction'
          continue: '#/components/schemas/AutoBYOCContinueAction'
          create_plan: '#/components/schemas/AutoBYOCCreatePlanAction'
          generate_bootstrap: '#/components/schemas/AutoBYOCGenerateBootstrapAction'
          start: '#/components/schemas/AutoBYOCStartAction'
          stop: '#/components/schemas/AutoBYOCStopAction'
          update_configuration: '#/components/schemas/AutoBYOCCustomerUpdateConfigurationAction'
          verify_identity: '#/components/schemas/AutoBYOCVerifyIdentityAction'
        propertyName: action
      oneOf:
        - $ref: '#/components/schemas/AutoBYOCGenerateBootstrapAction'
        - $ref: '#/components/schemas/AutoBYOCVerifyIdentityAction'
        - $ref: '#/components/schemas/AutoBYOCCustomerUpdateConfigurationAction'
        - $ref: '#/components/schemas/AutoBYOCCreatePlanAction'
        - $ref: '#/components/schemas/AutoBYOCApplyPlanAction'
        - $ref: '#/components/schemas/AutoBYOCStartAction'
        - $ref: '#/components/schemas/AutoBYOCContinueAction'
        - $ref: '#/components/schemas/AutoBYOCClearPlanAction'
        - $ref: '#/components/schemas/AutoBYOCStopAction'
    WorkspaceClusterDeletion:
      additionalProperties: false
      description: A delete Workspace accepted for the cluster that has not finished. Absent when no delete is pending.
      properties:
        phase:
          description: waiting_for_teardown while AutoBYOC is still removing the cluster's deployment; deleting once the cluster's projects and the cluster are being deleted.
          enum:
            - waiting_for_teardown
            - deleting
          type: string
        requested_at:
          description: When the earliest pending delete of the cluster was requested.
          format: date-time
          type: string
      required:
        - requested_at
        - phase
      type: object
    WorkspaceClusterQuery:
      discriminator:
        mapping:
          activity: '#/components/schemas/AutoBYOCActivityQuery'
          apply: '#/components/schemas/AutoBYOCApplyQuery'
          capabilities: '#/components/schemas/AutoBYOCCapabilitiesQuery'
          configuration: '#/components/schemas/AutoBYOCConfigurationQuery'
          configuration_history: '#/components/schemas/AutoBYOCConfigurationHistoryQuery'
          deployment_state: '#/components/schemas/AutoBYOCDeploymentStateQuery'
          node_metrics: '#/components/schemas/AutoBYOCNodeMetricsQuery'
          output: '#/components/schemas/AutoBYOCOutputQuery'
          plan: '#/components/schemas/AutoBYOCPlanQuery'
          verification: '#/components/schemas/AutoBYOCVerificationQuery'
        propertyName: query
      oneOf:
        - $ref: '#/components/schemas/AutoBYOCDeploymentStateQuery'
        - $ref: '#/components/schemas/AutoBYOCVerificationQuery'
        - $ref: '#/components/schemas/AutoBYOCConfigurationQuery'
        - $ref: '#/components/schemas/AutoBYOCCapabilitiesQuery'
        - $ref: '#/components/schemas/AutoBYOCPlanQuery'
        - $ref: '#/components/schemas/AutoBYOCApplyQuery'
        - $ref: '#/components/schemas/AutoBYOCConfigurationHistoryQuery'
        - $ref: '#/components/schemas/AutoBYOCOutputQuery'
        - $ref: '#/components/schemas/AutoBYOCNodeMetricsQuery'
        - $ref: '#/components/schemas/AutoBYOCActivityQuery'
    WorkspaceClusterRegistration:
      additionalProperties: false
      properties:
        api_url:
          format: uri
          type: string
        registered:
          type: boolean
        sandbox_proxy_url:
          format: uri
          type: string
      required:
        - api_url
        - sandbox_proxy_url
        - registered
      type: object
    WorkspaceCredit:
      properties:
        as_of:
          description: Database snapshot instant shared by the figures and derived policy.
          format: date-time
          type: string
        credit_source:
          $ref: '#/components/schemas/CreditSource'
        credit_state:
          description: Credit state derived live from remaining credit and the configured thresholds.
          enum:
            - ok
            - low
            - exhausted
          type: string
        grace_period_end:
          description: Absent outside grace. Preserves a recorded deadline, otherwise projects as_of plus the grace duration. Reading never persists a grace period.
          format: date-time
          type: string
        ledger_balance_usd:
          description: Exact decimal USD. For e2b credit, the posted ledger balance, excluding future-effective movements; a grant stops counting at its expires_at. Lots sum to it plus what lots past their expires_at hold until the expiry sweep writes them off, a day later. For stripe credit, the available balance of the customer's Stripe credit grants.
          type: string
        lots:
          description: 'The e2b ledger as of as_of, grouped by lot: every grant effective by then, newest first, with what has been drawn from it. The whole history, not a page of it. Empty for stripe credit, whose grants this ledger does not hold.'
          items:
            $ref: '#/components/schemas/CreditLot'
          type: array
        month_to_date_usage_usd:
          description: Corrected, residency-attributed usage in [period_start, as_of), rated at the meter prices effective when consumed, in exact decimal USD.
          type: string
        period_start:
          description: Start of the current UTC month.
          format: date-time
          type: string
        remaining_usd:
          description: 'Exact decimal USD: ledger_balance_usd minus month_to_date_usage_usd, without cent rounding. Can be negative; zero is "0". Uses the same calculation as credit enforcement. Usage not yet ingested is excluded.'
          type: string
      required:
        - remaining_usd
        - ledger_balance_usd
        - month_to_date_usage_usd
        - as_of
        - period_start
        - credit_state
        - credit_source
        - lots
      type: object
    WorkspaceDomain:
      properties:
        created_at:
          format: date-time
          type: string
        domain:
          description: Normalized ASCII domain; internationalized names are stored in punycode.
          type: string
        id:
          format: uuid
          type: string
        status:
          $ref: '#/components/schemas/WorkspaceDomainStatus'
        verification_record:
          $ref: '#/components/schemas/WorkspaceDomainVerificationRecord'
        verified_at:
          format: date-time
          type: string
      required:
        - id
        - domain
        - status
        - verification_record
        - created_at
      type: object
    WorkspaceDomainStatus:
      description: pending until the DNS challenge matches; verified once ownership is proven; removal_pending while a verified domain is withdrawn from the identity provider.
      enum:
        - pending
        - verified
        - removal_pending
      type: string
    WorkspaceDomainVerification:
      properties:
        domain:
          $ref: '#/components/schemas/WorkspaceDomain'
        result:
          description: Outcome of this DNS check. record_not_found means no challenge record was published; record_mismatch means a challenge record exists with a different value; lookup_failed means DNS did not answer in time and the check can be retried.
          enum:
            - verified
            - record_not_found
            - record_mismatch
            - lookup_failed
          type: string
      required:
        - domain
        - result
      type: object
    WorkspaceDomainVerificationRecord:
      properties:
        name:
          description: Fully qualified record name to create.
          type: string
        type:
          enum:
            - TXT
          type: string
        value:
          description: Exact record value that proves ownership.
          type: string
      required:
        - type
        - name
        - value
      type: object
    WorkspaceDomains:
      properties:
        domains:
          items:
            $ref: '#/components/schemas/WorkspaceDomain'
          type: array
      required:
        - domains
      type: object
    WorkspaceKind:
      enum:
        - personal
        - standard
      type: string
    WorkspaceMember:
      description: 'One person with access to the workspace. A workspace member reaches every project through `role`, and `project_access` is null. A project-scoped member holds direct grants on some projects instead: `role` is null, `project_access` lists the projects and the role on each, and `created_at` is the earliest grant. Clients must accept both shapes.'
      properties:
        created_at:
          format: date-time
          type: string
        project_access:
          description: The projects a project-scoped member reaches and the role on each. Absent for a workspace member, whose role reaches every project.
          items:
            $ref: '#/components/schemas/ProjectAccess'
          nullable: true
          type: array
        role:
          allOf:
            - $ref: '#/components/schemas/Role'
          description: The workspace role, or null for a project-scoped member. Never derived from project grants, so a project owner is not mistaken for a workspace owner.
          nullable: true
        user_id:
          format: uuid
          type: string
        user_sub:
          description: The identity-provider subject UUID used by a client to retrieve display data. Absent when the membership has no linked identity.
          format: uuid
          nullable: true
          type: string
      required:
        - user_id
        - role
        - created_at
      type: object
    WorkspaceOwnerContact:
      properties:
        email:
          description: Null when the identity provider could not supply one; the owner exists, the detail is missing.
          nullable: true
          type: string
      required:
        - email
      type: object
    WorkspacePaymentMethods:
      properties:
        default_payment_method_id:
          description: The method the workspace's invoices charge. Omitted when there is none, and a workspace with none cannot be invoiced.
          type: string
        items:
          description: The default first, then newest first. Empty when none.
          items:
            $ref: '#/components/schemas/PaymentMethod'
          type: array
        pending_us_bank_accounts:
          description: 'US bank accounts waiting for the owner to confirm the provider''s micro-deposits, newest first. Not payment methods yet: none can be charged, made the default or removed, and each moves to items once confirmed. Listed only when the workspace''s invoice terms accept ACH debit; empty otherwise.'
          items:
            $ref: '#/components/schemas/PendingUSBankAccount'
          type: array
      required:
        - items
      type: object
    WorkspacePlan:
      properties:
        addons:
          description: Workspace add-ons in force, paid or granted by E2B, ordered by addon, then since. One scheduled to end stays listed, with ends_at, until it ends.
          items:
            $ref: '#/components/schemas/WorkspacePlanAddon'
          type: array
        as_of:
          description: Billing snapshot instant shared by the add-on reads.
          format: date-time
          type: string
        available_addons:
          description: Add-ons for sale that the workspace neither holds nor has pending, ordered by addon. Empty for an enterprise workspace. A quote still checks eligibility.
          items:
            $ref: '#/components/schemas/WorkspacePlanAddonOption'
          type: array
        features:
          description: Every feature the add-ons in force unlock, sorted, each once. Empty when none.
          items:
            type: string
          type: array
        pending_addons:
          description: Add-ons a purchase is still paying for or applying, sorted, each once. Empty when none.
          items:
            type: string
          type: array
        workspace_id:
          format: uuid
          type: string
      required:
        - workspace_id
        - as_of
        - features
        - addons
        - available_addons
        - pending_addons
      type: object
    WorkspacePlanAddon:
      properties:
        addon:
          type: string
        ends_at:
          description: When the add-on stops granting; null while no end is scheduled.
          format: date-time
          nullable: true
          type: string
        features:
          description: Features this add-on unlocks.
          items:
            type: string
          type: array
        id:
          description: Identifies this holding of the add-on; addon names the catalogue entry.
          format: uuid
          type: string
        monthly_amount_usd:
          description: Exact decimal USD catalogue price per month before tax; null when not paid.
          nullable: true
          type: string
        name:
          type: string
        paid:
          description: Whether the workspace's subscription charges for it. False for an add-on E2B granted.
          type: boolean
        since:
          format: date-time
          type: string
      required:
        - id
        - addon
        - name
        - features
        - paid
        - monthly_amount_usd
        - since
        - ends_at
      type: object
    WorkspacePlanAddonOption:
      properties:
        addon:
          type: string
        features:
          description: Features buying this add-on unlocks.
          items:
            type: string
          type: array
        monthly_amount_usd:
          description: Exact decimal USD catalogue price per month before tax and proration.
          type: string
        name:
          type: string
      required:
        - addon
        - name
        - features
        - monthly_amount_usd
      type: object
    WorkspaceSCIM:
      properties:
        available:
          type: boolean
        endpoint:
          description: The SCIM base URL to enter in the identity provider.
          format: uri
          type: string
        provider:
          $ref: '#/components/schemas/SCIMProvider'
        status:
          description: '`missing` means the directory service no longer has the workspace''s directory; remove it and set it up again.'
          enum:
            - not_configured
            - configured
            - missing
          type: string
      required:
        - available
        - status
      type: object
    WorkspaceSSO:
      properties:
        available:
          type: boolean
        callback_url:
          format: uri
          type: string
        connections:
          items:
            $ref: '#/components/schemas/OIDCConnection'
          type: array
        entitlement:
          description: Commercial entitlement enforcement is not implemented in this rollout.
          enum:
            - not_evaluated
          type: string
        jit_provisioning_enabled:
          description: Whether people who sign in through this workspace's SSO connection with an email on one of its verified domains are added as workspace members.
          type: boolean
        status:
          enum:
            - not_configured
            - configured
          type: string
      required:
        - available
        - entitlement
        - status
        - connections
        - jit_provisioning_enabled
      type: object
    WorkspaceSSOSettings:
      additionalProperties: false
      properties:
        jit_provisioning_enabled:
          description: Add people who sign in through this workspace's SSO connection, with an email on one of its verified domains, as workspace members. Turning it off adds no one new and removes no one.
          type: boolean
      required:
        - jit_provisioning_enabled
      type: object
    WorkspaceUsage:
      properties:
        grain:
          $ref: '#/components/schemas/Grain'
        period_end:
          description: |-
            The window that was read, which is not necessarily the one asked for: either bound may have been left off.
            An hour belongs to the window its start falls in, so two adjacent windows partition the history rather than overlap on the hour they share.
          format: date-time
          type: string
        period_start:
          format: date-time
          type: string
        projects:
          description: 'One entry per project the workspace holds now, ordered by project name, then one per project it held at any time in the window and no longer does: those that moved out, then deleted ones, each ordered by project_id. Names are ordered in Go''s byte order, which is not the collation the database orders other project listings by: two listings can disagree on mixed-case or non-ASCII names. Match on project_id rather than by position.'
          items:
            $ref: '#/components/schemas/ProjectUsage'
          type: array
      required:
        - period_start
        - period_end
        - grain
        - projects
      type: object
  securitySchemes:
    AuthProviderBearerAuth:
      bearerFormat: access_token
      scheme: bearer
      type: http
    AuthProviderBearerBootstrapAuth:
      bearerFormat: access_token
      description: The same tokens as AuthProviderBearerAuth, verified without resolving a user. Signup runs before its caller is a user here, so the regular scheme would refuse every first-time visitor. Used by one route.
      scheme: bearer
      type: http

paths:
  /.well-known/jwks.json:
    get:
      operationId: getJWKS
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: RFC 7517 JWK set.
      summary: Public JWK set for verifying workspace-api service JWTs.
      tags:
        - common
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Process is alive.
      tags:
        - common
  /ready:
    get:
      operationId: getReady
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Service dependencies are ready.
        "503":
          description: A required dependency is unavailable.
      tags:
        - common
  /v1/invitations/{invitationID}:
    delete:
      description: Owners of the invitation's workspace only; a caller outside that workspace gets 404, as for an unknown id. Revoking an invitation that is already revoked succeeds; one that was accepted or replaced is refused with 409.
      operationId: revokeInvitation
      responses:
        "204":
          description: The invitation is revoked.
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
      security:
        - AuthProviderBearerAuth: []
      summary: Revoke a pending or expired invitation, so its link stops working.
      tags:
        - workspaces
    get:
      description: Anyone with the link. A pending invitation shows the workspace name, the sender's name and the expiry; a signed-in caller also gets `viewer`, and only a caller whose verified address is the invited one also gets `access`. Any other invitation shows only its status. A token that is sent but cannot be verified is refused with 401 rather than treated as signed out. Opening it changes nothing.
      operationId: getInvitation
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: The invitation as the caller may see it.
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
      security:
        - AuthProviderBearerAuth: []
        - {}
      summary: Preview an invitation from its link, signed in or not.
      tags:
        - workspaces
    parameters:
      - $ref: '#/components/parameters/invitationID'
  /v1/invitations/{invitationID}/accept:
    parameters:
      - $ref: '#/components/parameters/invitationID'
    post:
      description: 'The caller needs a verified address matching the invited one, compared as for `InvitationViewer.state`: otherwise 403 `invitation_wrong_account` or `email_not_verified`, and nothing changes. Accepting only adds access: a workspace role for an invitation to every project, or a grant on each selected project still in the workspace and not being deleted. A caller already on the members list keeps their access and the invitation is marked accepted. Accepting it again as the same person succeeds and changes nothing; an expired, revoked, superseded or someone else''s accepted invitation is a 409 `invitation_not_pending`. A workspace with an SSO connection or a SCIM directory, an address whose domain is now banned, and an invitation none of whose projects is left revoke the invitation and answer 409. A workspace on hold still accepts.'
      operationId: acceptInvitation
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptance'
          description: The caller reaches the workspace.
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
      security:
        - AuthProviderBearerAuth: []
      summary: Accept a pending invitation as the person it was sent to.
      tags:
        - workspaces
  /v1/invitations/{invitationID}/resend:
    parameters:
      - $ref: '#/components/parameters/invitationID'
    post:
      description: Owners of the invitation's workspace only; a caller outside that workspace gets 404, as for an unknown id. The new invitation keeps the old one's access, names the caller as its sender, and the old link stops working. Checks again everything creating one checks, and also needs a few minutes since the last invitation email to the address from this workspace; within them it answers 429. An invitation whose selected projects were all deleted is refused with 409 `invitation_without_access`.
      operationId: resendInvitation
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: The new invitation.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "429":
          $ref: '#/components/responses/429'
      security:
        - AuthProviderBearerAuth: []
      summary: Replace a pending or expired invitation with a new one, with a new link and a fresh expiry.
      tags:
        - workspaces
  /v1/me:
    get:
      description: |-
        One call to resolve a client's whole starting state. Self-scoped, so it names no resource and refuses nothing.
        A workspace reached only through a project grant is included, carrying an empty capability list and just the granted projects — which is the difference between seeing a workspace and belonging to it, and is why this one call serves workspace members and project members alike.
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: The caller's reachable workspaces and projects.
        "401":
          $ref: '#/components/responses/401'
      security:
        - AuthProviderBearerAuth: []
      summary: Everything the caller can reach.
      tags:
        - workspaces
  /v1/projects:
    post:
      operationId: createProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: Project reserved with provisioning in progress.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Reserve a project and provision it asynchronously on its region's control plane. Self-service creation can be disabled for a configured region; administrators and signup/bootstrap are not restricted by this policy.
      tags:
        - workspaces
  /v1/projects/{projectID}:
    delete:
      description: |-
        Requires workspace:write on the project's current workspace. Only a project in a standard workspace can be deleted: a project in a personal workspace, and one still provisioning, are answered 409. A banned project is answered 403 `project_banned`.
        On 202 the project is deleting and its teardown on the control plane, which removes its members, is queued. Billing close-out and removing the project follow in a later change; until then the project stays listed as deleting. Repeating the call on a deleting project answers 202 and queues the teardown again without touching anything else, which is how a teardown that stopped is resumed.
      operationId: deleteProject
      responses:
        "202":
          description: Deletion accepted; the project is deleting.
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
      security:
        - AuthProviderBearerAuth: []
      summary: Delete a project.
      tags:
        - workspaces
    get:
      operationId: getProject
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: Project, in whatever status it currently holds.
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
      security:
        - AuthProviderBearerAuth: []
      tags:
        - workspaces
    parameters:
