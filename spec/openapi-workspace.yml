        inviter_name:
          description: The name of the owner who sent the invitation. Present only while the invitation is pending and the owner has a name; show it as plain text.
          type: string
        status:
          $ref: '#/components/schemas/InvitationPreviewStatus'
        viewer:
          allOf:
            - $ref: '#/components/schemas/InvitationViewer'
          description: Present only while the invitation is pending and the caller is signed in.
        workspace_id:
          description: The invitation's workspace, present only when the signed-in caller is already on its members list.
          format: uuid
          type: string
        workspace_name:
          description: Present only while the invitation is pending. The workspace's owners chose it; show it as plain text.
          type: string
      required:
