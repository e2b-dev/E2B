    Invoice:
      properties:
        created:
          description: When the invoice was raised. The listing is ordered by this, newest first, with the identifier breaking a tie so the order is stable across calls.
          format: date-time
          type: string
        credits_used_usd_cents:
          description: |-
            Compute credits used, in whole US cents: the positive magnitude of the sum of negative Stripe Compute credits line amounts. Zero when no such lines exist. These deductions are already included in total_usd_cents; do not subtract them again.
            Excludes card payments, unrelated negative prorations, customer balance, and post-finalization credit notes. This field reports credits already used; it does not apply credits.
          format: int64
          type: integer
        due_date:
          description: When payment is due. Optional, and absent on every invoice charged automatically rather than sent to be paid — which is the normal case. Absent means payable on issue; render a due date only when there is one.
          format: date-time
          type: string
        hosted_url:
          description: The URL for viewing and paying the invoice on Stripe's hosted page.
          type: string
        id:
          description: The payment provider's identifier for the invoice. Stable, and the key to quote when reconciling one against the provider's own record.
          type: string
        number:
          description: The human-facing number printed on the invoice, assigned when it was finalised. What a customer quotes in a billing question.
          type: string
        pdf_url:
          description: The URL for downloading the invoice PDF from Stripe. E2B renders no invoice document of its own.
          type: string
        remaining_usd_cents:
          description: |-
            What is still outstanding, in the same unit: the total less what has been paid and less anything taken off it since. Zero on a paid invoice, and zero on one a credit note reduced in full.
            This is the figure a credit note moves. Because the two are on different bases, the difference between this and total_usd_cents is not the amount paid, and must not be rendered as one.
          format: int64
          type: integer
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        total_usd_cents:
          description: |-
            The invoice's own total in whole US cents, after discounts and tax and before anything held on the customer at the provider is applied to it.
            Cents, not dollars, and an integer: a JSON number is a double in most clients and a total that rounds is a total that is wrong.
            There is no currency field. E2B bills in USD, and an invoice raised in another currency is reported internally and left out of the listing rather than served here under a name that would make the figure right and the unit wrong. It is the only thing that can be absent from an otherwise whole history, and it is not expected to exist.
            It does not move when the invoice is paid, nor when a credit note reduces it afterwards: it is what the invoice was raised for.
          format: int64
          type: integer
      required:
        - id
        - number
        - status
        - total_usd_cents
        - remaining_usd_cents
        - credits_used_usd_cents
        - created
        - hosted_url
        - pdf_url
      type: object
    InvoiceStatus:
      description: |-
        open is owed and unpaid. paid is settled.
        The set is closed on purpose: a draft, a withdrawn invoice and one written off are left out of the listing rather than given a state here, so a client renders every invoice it receives without a fallback branch.
      enum:
        - open
        - paid
      type: string
