          $ref: '#/components/schemas/ErrorCode'
        message:
          description: Error
          type: string
      required:
        - code
        - message
      type: object
    ErrorCode:
      description: |-
        Machine-readable reason for a refusal, one of the values below.
        Absent when none of them applies. New values may be added: treat an
        unknown value like an absent one. The message is developer-facing
        text and may change; show copy chosen from the code instead.

        - `invalid_request` (400): The request failed validation; the message
          names the field.
        - `workspace_not_found` (404): The workspace does not exist or was
          deleted.
        - `workspace_limit_reached` (409): The account already owns as many
          standard workspaces as it may. Creating and upgrading answer it.
        - `workspace_verification_pending` (409): A workspace the account
          created is still held for verification, so it cannot create another
          workspace, and the held workspace cannot be upgraded or deleted.
        - `workspace_held` (409): A workspace carries a hold other than
          verification, so it cannot be upgraded, or deleted unless that hold
          is a missing payment method alone. While a workspace
          the account created carries one a payment method does not lift,
          such as a closed billing account, the account cannot create another
          workspace either; a missing payment method or used-up credit does
          not refuse creation. The same request succeeds once the hold is
          lifted.
        - `workspace_has_projects` (409): A workspace that still holds projects
          cannot be deleted.
        - `workspace_has_sso` (409): A workspace with an SSO connection cannot
          be deleted until the connection is removed, and takes no invitations:
          people join it through its identity provider. Accepting an
          invitation to one revokes the invitation.
        - `workspace_has_scim` (409): A workspace with a SCIM directory cannot
          be deleted until the directory is removed, and takes no invitations:
          people join it through its directory. Accepting an invitation to one
          revokes the invitation.
        - `workspace_has_addons` (409): A workspace with a paid add-on that
          renews cannot be deleted. End the add-on first; one already scheduled
          to end does not block deletion.
        - `workspace_blocked` (409): The workspace has an active hold, so it
          cannot send or resend invitations.
        - `workspace_not_personal` (409): Only a personal workspace can be
          upgraded to a standard one.
        - `personal_workspace` (400 or 409): The action needs a standard
          workspace: personal workspaces have one member and one project, cannot
          be deleted, cannot send or receive projects, and have no SSO, SCIM or
          domains.
        - `account_email_missing` (400): The account has no email address, which
          billing needs to create a workspace or project.
        - `billing_not_ready` (409): The workspace's billing account is not
          provisioned yet; the same request succeeds shortly. Creating a
          workspace and upgrading the personal one answer it until billing has
          finished setting up the account's personal workspace.
        - `default_card_required` (409): A personal workspace is promoted while
          its default payment method is missing, not a card, or an expired card.
          The same request succeeds once a card that has not expired is the
          default.
        - `tax_location_invalid` (409): The payment provider cannot work out
          where the workspace is for tax from its billing details: the billing
          address, or without one, the card's billing details. Setting a default
          card, setting the billing address, opening a card setup with an
          address, and quoting and confirming a purchase answer it. The same
          request succeeds once those details can be placed.
        - `user_banned` (403): A banned user would own a new workspace or create
          a new project. It stays until support lifts the ban.
        - `email_taken` (409): Another account already uses this email address
          once both are normalized. Signing in to the existing account is the
          way forward.
        - `user_not_found` (404): No user has this id or email.
        - `user_not_signed_in` (404): The email belongs to a user who has never
          signed in, so they cannot be added yet. Admin routes only.
        - `email_ambiguous` (409): Several users share the email; add the member
          by id. Admin routes only.
        - `already_member` (409): The user is already a member. For an
          invitation, the address belongs to someone already on the workspace's
          members list; change their project access instead.
        - `invitation_required` (409): The person has no access to the
          workspace yet, as a member or on any of its projects, so they cannot
          be added or given projects by id; invite them by email.
        - `member_not_found` (404): The user is not a member.
        - `last_owner` (409): The change would leave the workspace without an
          owner.
        - `project_not_found` (404): The project does not exist or was deleted.
        - `project_not_in_workspace` (400): A project named in the request is
          not in this workspace.
        - `project_moved` (409): The project moved to another workspace while
          the request was in flight.
        - `project_not_active` (409): The project is still being created or is
          being deleted. An invitation refuses a project being deleted.
        - `project_banned` (403): The project, or a project on the cluster
          being deleted, is banned, so only support can delete it.
        - `project_limit_reached` (409): The user already has as many
          projects as they may, counting projects in the workspaces they own
          and projects shared with them.
        - `slug_unavailable` (409): No free slug could be found for the project
          name.
        - `region_creation_disabled` (403): The region does not take self-
          service projects.
        - `region_unavailable` (503): The region cannot place a project right
          now; another region or a later retry may succeed.
        - `region_refused` (400, 404 or 409): The project's region refused the
          change.
        - `spend_alert_above_limit` (409): The change would leave the spend
          alert above the spend limit, counting the threshold the request
          left untouched.
        - `cluster_region_mismatch` (400): The cluster is in another region than
          the one requested.
        - `cluster_protected` (409): The cluster has deletion protection turned
          on.
        - `deployment_busy` (409): The cluster's deployment changed or is in a
          state that does not permit the operation.
        - `destination_payment_method_missing` (409): The destination workspace
          of a project move has no default payment method to pay for the
          project's paid plan and add-ons.
        - `move_blocked_by_billing` (409): Billing blocks the project move:
          pending purchases must settle, and a paid plan or add-on can only move
          into a workspace with a self-serve subscription.
        - `move_in_progress` (409): A previous move of the project is still
          being resolved by billing.
        - `sso_connection_not_found` (404): The SSO connection does not exist.
        - `sso_conflict` (409): The SSO configuration changed, or a connection
          already exists; refresh and retry.
        - `sso_config_invalid` (400): The SSO connection needs a name, an HTTPS
          issuer URL without credentials, query or fragment, a client ID, and a
          client secret.
        - `sso_config_rejected` (400): The identity provider rejected the
          SSO connection being created or updated.
        - `sso_issuer_locked` (400): A connection's issuer URL cannot be
          changed; remove the connection and add a new one.
        - `sso_secret_required` (400): Changing the client ID needs the new
          client secret.
        - `scim_already_set_up` (409): The workspace already has a SCIM
          directory.
        - `scim_not_found` (404): The workspace has no SCIM directory.
        - `domain_invalid` (400): The domain is not a registrable domain such as
          example.com.
        - `domain_not_found` (404): The workspace does not claim the domain.
        - `domain_already_claimed` (409): The workspace already claims the
          domain.
        - `domain_verified_elsewhere` (409): Another workspace has verified the
          domain.
        - `domain_removal_pending` (409): The domain is being removed.
        - `card_expired` (409): An expired card cannot become the default
          payment method.
        - `last_payment_method` (409): The workspace's only payment method
          cannot be removed.
        - `default_payment_method` (409): The default payment method cannot be
          removed until another one is made the default.
        - `payment_method_not_found` (404): The payment method is not attached
          to the workspace.
        - `billing_account_closed` (409): The workspace's billing account is
          closed.
        - `billing_account_inactive` (409): The workspace's billing account is
          not in a state to be charged.
        - `verification_not_required` (409): The workspace is not held for
          verification, so no verification payment is due.
        - `verification_payment_processing` (409): The verification payment is
          paid and awaiting settlement.
        - `quote_outdated` (409): The quote lapsed, was replaced, or no longer
          comes to the figure shown; quote again.
        - `purchase_pending` (409): A purchase for the project or workspace is
          awaiting collection or application. A workspace with such a purchase
          of an add-on cannot be deleted until it completes.
        - `already_on_plan` (409): The project is already on the plan requested.
        - `plan_managed_by_e2b` (409): The project's plan, or the workspace's
          add-ons, are not settled through a self-serve subscription, so E2B
          manages them.
        - `addons_block_downgrade` (409): Paid add-ons still in force block a
          downgrade to the free plan.
        - `downgrade_scheduled` (409): A scheduled downgrade conflicts with the
          change.
        - `no_downgrade_scheduled` (409): The project has no downgrade to
          cancel.
        - `addon_quantity_changed` (409): Fewer paid add-on packs are running,
          or ending, than the change names.
        - `no_addon_ending_scheduled` (409): The project or workspace has no
          add-on ending to cancel.
        - `workspace_addon_held` (409): The workspace already holds the add-on,
          scheduled to end or not. Cancel a scheduled ending instead of buying
          it again. Confirming a purchase answers it too when the workspace has
          come to hold the add-on since the quote.
        - `workspace_addon_not_held` (409): No paid add-on of that name is
          running on the workspace without a scheduled end, so there is nothing
          to end.
        - `purchase_refused` (409): Billing refused a purchase or plan change
          for a reason not listed here.
        - `subscription_renewing` (409): The workspace's subscription is being
          renewed into its new billing period; quote again shortly.
        - `payment_method_type_not_accepted` (409): The workspace's invoice
          terms do not accept this type of payment method, so it cannot be
          added or made the default.
        - `invitation_not_found` (404): No invitation has this id, or the
          caller is not a member of its workspace.
        - `invitation_not_pending` (409): The invitation was accepted, revoked
          or replaced by a newer one, so it cannot be resent or revoked; an
          expired one cannot be accepted either. Accepting an invitation to
          selected projects none of which is left in the workspace revokes it
          and answers this too.
        - `invitation_without_access` (409): Every project the invitation gave
          access to was deleted, so it cannot be resent; revoke it and send a
          new one.
        - `email_plus_tagged` (400): Plus-tagged addresses cannot be invited;
          invite the address without the tag.
        - `email_not_allowed` (400 or 409): The address cannot be invited: its
          domain is not allowed or it does not receive mail. The answer is the
          same whether or not the address has an account. Accepting answers
          409 when the domain was banned after the invitation was sent, and
          revokes the invitation.
        - `invitation_wrong_account` (403): The signed-in account has no
          address equal to the invited one; sign in with the address that
          received the invitation.
        - `email_not_verified` (403): The signed-in account has the invited
          address but has not verified it; verify it and accept again.
        - `invitation_limit_reached` (429): The workspace has sent as many
          invitation emails as it may in a rolling 24 hours.
        - `invitation_sender_limit_reached` (429): The caller has sent as many
          invitation emails as they may in a rolling 24 hours, counted across
          every workspace.
        - `invitation_recipient_limit_reached` (429): The address has received
          as many invitation emails as it may in a rolling 24 hours, or an
          invitation to it was sent too recently to resend.
      enum:
        - invalid_request
        - workspace_not_found
        - workspace_limit_reached
        - workspace_verification_pending
        - workspace_held
        - workspace_has_projects
        - workspace_has_sso
        - workspace_has_scim
        - workspace_has_addons
        - workspace_blocked
        - workspace_not_personal
        - personal_workspace
        - account_email_missing
