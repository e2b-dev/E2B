  /v1/workspaces/{workspaceID}/promote:
    parameters:
      - $ref: '#/components/parameters/workspaceID'
    post:
      description: |-
        Requires workspace:write, granted by workspace ownership.
        A workspace that carries a hold is not promoted. A verification hold answers 409 with error_code workspace_verification_pending, and a workspace billing is still setting up answers 409 with error_code billing_not_ready, both before billing is asked. Any other hold answers 409 with error_code workspace_held once the default card below is confirmed, so a workspace without a card is first asked for one.
        A workspace is promoted only once billing confirms its default payment method is a card that has not expired; otherwise 409 with error_code default_card_required and nothing changes. 409 without that code when the workspace has no billing account yet. 503 when billing cannot be reached. Unconfigured billing skips the check.
      operationId: promoteWorkspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteWorkspaceRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: Promoted workspace.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Promote a personal workspace to a named standard workspace.
      tags:
        - workspaces
  /v1/workspaces/{workspaceID}/purchases/{purchaseID}/confirm:
    parameters:
      - $ref: '#/components/parameters/workspaceID'
      - in: path
        name: purchaseID
        required: true
        schema:
          format: uuid
          type: string
    post:
      description: 'Requires workspace:billing. The purchase must belong to the workspace: a project tier or add-on quote, or a workspace add-on quote. Rechecks the quote and collects its pinned price. Repeat the same purchase ID after an unknown outcome; polling does not charge again. Confirming returns a PaymentIntent secret for Stripe Elements. Paid means settlement is recorded and entitlement application is queued or complete. A scheduled tier downgrade conflicts and is not cancelled by confirmation. A workspace add-on the workspace has come to hold since the quote is answered 409 with error_code workspace_addon_held. A workspace whose tax location the payment provider cannot work out is answered 409 with error_code tax_location_invalid, and nothing is charged.'
      operationId: confirmPurchase
      responses:
        "200":
          content:
            application/json:
