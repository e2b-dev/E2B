openapi: "3.0.3"

info:
  version: 0.1.0
  title: E2B Workspace API

tags:
  - name: common
  - name: autobyoc
  - name: billing
  - name: domains
  - name: sso
  - name: storage
  - name: workspace_clusters
  - name: workspaces

components:
  parameters:
    domainID:
      in: path
      name: domainID
      required: true
      schema:
        format: uuid
        type: string
    invitationID:
      in: path
      name: invitationID
      required: true
      schema:
        format: uuid
        type: string
    paymentMethodID:
      description: The payment provider's identifier, as the listing reports it.
      in: path
      name: paymentMethodID
      required: true
      schema:
        maxLength: 255
        minLength: 1
        type: string
    projectID:
      description: The project's public_id, or the project UUID.
      in: path
      name: projectID
      required: true
      schema:
        type: string
        x-go-type: apiid.ProjectID
        x-go-type-import:
          name: apiid
          path: github.com/e2b-dev/infra/packages/shared/pkg/apiid
    projectSlug:
      in: path
      name: slug
      required: true
      schema:
        type: string
    userID:
      in: path
      name: userID
      required: true
      schema:
        format: uuid
        type: string
    workspaceClusterID:
      in: path
      name: clusterID
      required: true
      schema:
        format: uuid
        type: string
    workspaceID:
      description: The workspace's public_id, or the workspace UUID.
      in: path
      name: workspaceID
      required: true
      schema:
        type: string
        x-go-type: apiid.WorkspaceID
        x-go-type-import:
          name: apiid
          path: github.com/e2b-dev/infra/packages/shared/pkg/apiid
  responses:
    "400":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Invalid request.
    "401":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Authentication required.
    "403":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Insufficient permissions.
    "404":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Resource not found.
    "409":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Conflict with domain invariants.
    "429":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: A rate limit refused the request. The same request succeeds once the limit's window has passed.
    "500":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Unexpected failure. An operator resolves it; a retry does not.
    "503":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: No healthy control plane can serve the request.
    AutoBYOCForwardingErrorResponse:
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/AutoBYOCErrorResponse'
              - $ref: '#/components/schemas/Error'
      description: AutoBYOC or Workspace request failed
    AutoBYOCGatewayErrorResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Workspace could not serve or forward the request
  schemas:
    AddMemberRequest:
      description: Names, by user id, a person who already has access to some of the workspace's projects. Anyone else joins through an invitation, so there is no email form, and a person with no access yet is refused with 409 invitation_required.
      properties:
        role:
          $ref: '#/components/schemas/Role'
        user_id:
          format: uuid
          type: string
      required:
        - user_id
        - role
      type: object
    AddonPurchaseQuote:
      properties:
        addon:
          type: string
        amount_due_usd_cents:
          description: Preview amount due including tax and balance adjustments.
          format: int64
          minimum: 0
          type: integer
        expires_at:
          description: Exclusive deadline, capped at the next monthly billing boundary.
          format: date-time
          type: string
        id:
          description: Purchase ID to confirm after accepting the quote.
          format: uuid
          type: string
        project_id:
          format: uuid
          type: string
        proration_at:
          format: date-time
          type: string
        quantity:
          format: int32
          minimum: 1
          type: integer
      required:
        - id
        - project_id
        - addon
        - quantity
        - amount_due_usd_cents
        - proration_at
        - expires_at
      type: object
    AutoBYOCAWSEncryptionKeyReferences:
      additionalProperties: false
      properties:
        kms_key_arn:
          type: string
      required:
        - kms_key_arn
      type: object
    AutoBYOCAction:
      additionalProperties: false
      properties:
        approval_request:
          $ref: '#/components/schemas/AutoBYOCDeploymentPlanApprovalRequest'
        clear_plan_id:
          format: uuid
          type: string
          x-go-name: ClearPlanID
          x-go-type: string
        enabled:
          type: boolean
        id:
          enum:
            - start_deployment
            - continue_deployment
            - stop_deployment
            - approve_plan
            - clear_plan
            - plan_base_infra
            - plan_nomad_services
            - plan_final_converge
            - plan_upgrade
            - plan_teardown
            - approve_teardown
            - retry_plan
            - generate_fresh_plan
            - plan_domain_move
            - plan_domain_cleanup
          type: string
          x-enum-varnames:
            - StartDeployment
            - ContinueDeployment
            - StopDeployment
            - ApprovePlan
            - ClearPlan
            - PlanBaseInfra
            - PlanNomadServices
            - PlanFinalConverge
            - PlanUpgrade
            - PlanTeardown
            - ApproveTeardown
            - RetryPlan
            - GenerateFreshPlan
            - PlanDomainMove
            - PlanDomainCleanup
        kind:
          enum:
            - plan
            - apply
            - recovery
          type: string
          x-enum-varnames:
            - Plan
            - Apply
            - Recovery
        label:
          maxLength: 80
          minLength: 1
          type: string
        plan_request:
          $ref: '#/components/schemas/AutoBYOCDeploymentPlanRequest'
        release_label:
          description: 'plan_request.expected_release_id for operators: its module release, like gcp-gke-v0.1.0.'
          type: string
        resumes_applied_work:
          description: Set on continue_deployment when continuing resumes the post-apply work of a plan already approved, instead of planning again. An operator gives a reason for it; an operator's continuation without a reason only plans.
          type: boolean
        stop_run_id:
          description: Exact deployment run targeted by the stop action.
          format: uuid
          type: string
          x-go-name: StopRunID
          x-go-type: string
      required:
        - id
        - label
        - kind
        - enabled
      type: object
    AutoBYOCActivityQuery:
      additionalProperties: false
      properties:
        limit:
          default: 100
          maximum: 100
          minimum: 1
          type: integer
        query:
          enum:
            - activity
          type: string
          x-enum-varnames:
            - Activity
      required:
        - query
      type: object
    AutoBYOCApplyPlanAction:
      additionalProperties: false
      properties:
        action:
          enum:
            - apply_plan
          type: string
          x-enum-varnames:
            - ApplyPlan
        body:
          allOf:
            - $ref: '#/components/schemas/AutoBYOCDeploymentPlanApprovalRequest'
          x-go-type: nullable.Nullable[AutoBYOCDeploymentPlanApprovalRequest]
          x-go-type-skip-optional-pointer: true
        plan_id:
          type: string
      required:
        - action
        - plan_id
      type: object
    AutoBYOCApplyQuery:
      additionalProperties: false
      properties:
        apply_id:
          type: string
        query:
          enum:
            - apply
          type: string
          x-enum-varnames:
            - Apply
      required:
        - query
        - apply_id
      type: object
    AutoBYOCAzureEncryptionKeyReferences:
      additionalProperties: false
      properties:
        key_vault_key_id:
          type: string
        key_vault_resource_id:
          type: string
      required:
        - key_vault_key_id
        - key_vault_resource_id
      type: object
    AutoBYOCAzureIdentity:
      additionalProperties: false
      properties:
        client_id:
          type: string
          x-go-name: ClientID
        principal_id:
          type: string
          x-go-name: PrincipalID
        tenant_id:
          type: string
          x-go-name: TenantID
      required:
        - tenant_id
        - client_id
      type: object
    AutoBYOCBaseRebuildQuery:
      additionalProperties: false
      properties:
        query:
          enum:
            - base_rebuild
          type: string
          x-enum-varnames:
            - BaseRebuild
        verification_id:
          type: string
      required:
        - query
        - verification_id
      type: object
    AutoBYOCBaseRebuildQueryResult:
      additionalProperties: false
      properties:
        query:
          enum:
            - base_rebuild
          type: string
          x-enum-varnames:
            - BaseRebuild
        result:
          $ref: '#/components/schemas/AutoBYOCBaseRebuildState'
      required:
        - query
        - result
      type: object
    AutoBYOCBaseRebuildRequest:
      additionalProperties: false
      properties:
        expected_cluster_id:
          format: uuid
          type: string
          x-go-name: ExpectedClusterID
          x-go-type: string
      required:
        - expected_cluster_id
      type: object
    AutoBYOCBaseRebuildResponse:
      additionalProperties: false
      properties:
        cluster_id:
          format: uuid
          type: string
          x-go-name: ClusterID
          x-go-type: string
        created_at:
          format: date-time
          type: string
        error_code:
          type: string
        error_message:
          type: string
        id:
          format: uuid
          type: string
          x-go-type: string
        progress:
          items:
            $ref: '#/components/schemas/AutoBYOCDeploymentApplyProgressEvent'
          type: array
        status:
          enum:
            - pending
            - running
            - succeeded
            - failed
          type: string
          x-enum-varnames:
            - BaseRebuildPending
            - BaseRebuildRunning
            - BaseRebuildSucceeded
            - BaseRebuildFailed
        updated_at:
          format: date-time
          type: string
        verification_id:
          format: uuid
          type: string
          x-go-name: VerificationID
          x-go-type: string
      required:
        - id
        - verification_id
        - cluster_id
        - status
        - created_at
        - updated_at
        - progress
      type: object
    AutoBYOCBaseRebuildState:
      additionalProperties: false
      properties:
        cluster_id:
          format: uuid
          type: string
          x-go-name: ClusterID
          x-go-type: string
        rebuild:
          $ref: '#/components/schemas/AutoBYOCBaseRebuildResponse'
      required:
        - cluster_id
      type: object
    AutoBYOCBootstrapTerraformArtifact:
      additionalProperties: false
      properties:
        content:
          maxLength: 250000
          minLength: 1
          type: string
        filename:
          maxLength: 100
          minLength: 1
          type: string
        language:
          enum:
            - hcl
            - bash
            - json
          type: string
          x-enum-varnames:
            - BootstrapTerraformArtifactLanguageHCL
            - BootstrapTerraformArtifactLanguageBash
            - BootstrapTerraformArtifactLanguageJSON
      required:
        - filename
        - language
        - content
      type: object
    AutoBYOCBootstrapTerraformRequest:
      additionalProperties: false
      properties:
        azure_tenant_id:
          type: string
          x-go-name: AzureTenantID
        encryption:
          $ref: '#/components/schemas/AutoBYOCEncryptionConfiguration'
        project_id:
          type: string
          x-go-name: ProjectID
        provider:
          enum:
            - gcp
            - aws
            - azure
          type: string
          x-enum-varnames:
            - BootstrapTerraformRequestProviderGCP
            - BootstrapTerraformRequestProviderAWS
            - BootstrapTerraformRequestProviderAzure
        region:
          type: string
        runtime:
          enum:
            - gke
            - eks
            - aks
          type: string
          x-enum-varnames:
            - BootstrapTerraformRequestRuntimeGKE
            - BootstrapTerraformRequestRuntimeEKS
            - BootstrapTerraformRequestRuntimeAKS
      required:
        - provider
        - project_id
        - region
      type: object
    AutoBYOCBootstrapTerraformResponse:
      additionalProperties: false
      properties:
        artifact:
          $ref: '#/components/schemas/AutoBYOCBootstrapTerraformArtifact'
        artifacts:
          items:
            $ref: '#/components/schemas/AutoBYOCBootstrapTerraformArtifact'
          maxItems: 10
          minItems: 1
          type: array
        encryption:
          $ref: '#/components/schemas/AutoBYOCEncryptionConfiguration'
        project_id:
          maxLength: 36
          minLength: 1
          type: string
          x-go-name: ProjectID
        provider:
          enum:
            - gcp
            - aws
            - azure
          type: string
          x-enum-varnames:
            - BootstrapTerraformResponseProviderGCP
            - BootstrapTerraformResponseProviderAWS
            - BootstrapTerraformResponseProviderAzure
        region:
          maxLength: 63
          minLength: 1
          type: string
        schema_version:
          enum:
            - v1
          type: string
          x-enum-varnames:
            - BootstrapTerraformResponseSchemaVersionV1
        supported_encryption_modes:
          items:
            type: string
          type: array
      required:
        - schema_version
        - provider
        - project_id
        - region
        - artifact
      type: object
    AutoBYOCCapabilitiesQuery:
      additionalProperties: false
      properties:
        query:
          enum:
            - capabilities
          type: string
          x-enum-varnames:
            - Capabilities
        verification_id:
          type: string
      required:
        - query
        - verification_id
      type: object
    AutoBYOCCapabilitiesQueryResult:
      additionalProperties: false
      properties:
        query:
          enum:
            - capabilities
          type: string
          x-enum-varnames:
            - Capabilities
        result:
          $ref: '#/components/schemas/AutoBYOCDeploymentCapabilitiesResponse'
      required:
        - query
        - result
      type: object
    AutoBYOCClearPlanAction:
      additionalProperties: false
      properties:
        action:
          enum:
            - clear_plan
          type: string
          x-enum-varnames:
            - ClearPlan
        plan_id:
          type: string
      required:
        - action
        - plan_id
      type: object
    AutoBYOCConfigurationHistoryQuery:
      additionalProperties: false
      properties:
        query:
          enum:
            - configuration_history
          type: string
          x-enum-varnames:
            - ConfigurationHistory
        verification_id:
          type: string
      required:
        - query
        - verification_id
      type: object
    AutoBYOCConfigurationQuery:
      additionalProperties: false
      properties:
        module_tag:
          description: Operators only. List Advanced options as declared by this release of the deployment's module (gcp-gke, aws-eks or azure-aks) instead of the saved one. Ignored for customer requests.
          type: string
        query:
          enum:
            - configuration
          type: string
          x-enum-varnames:
            - Configuration
        verification_id:
          type: string
      required:
        - query
        - verification_id
      type: object
    AutoBYOCConfigurationSource:
      description: Desired customer settings or the recorded applied snapshot for operator release reconciliation.
      enum:
        - desired
        - applied
      type: string
      x-enum-varnames:
        - ConfigurationSourceDesired
        - ConfigurationSourceApplied
    AutoBYOCContinueAction:
      additionalProperties: false
      properties:
        action:
          enum:
            - continue
          type: string
          x-enum-varnames:
            - Continue
        body:
          allOf:
            - $ref: '#/components/schemas/AutoBYOCDeploymentPlanApprovalRequest'
          x-go-type: nullable.Nullable[AutoBYOCDeploymentPlanApprovalRequest]
          x-go-type-skip-optional-pointer: true
      required:
        - action
      type: object
    AutoBYOCContinueActionResult:
      additionalProperties: false
      properties:
        action:
          enum:
            - continue
          type: string
          x-enum-varnames:
            - Continue
        result:
          $ref: '#/components/schemas/AutoBYOCDeploymentRunResponse'
      required:
        - action
        - result
      type: object
    AutoBYOCCreatePlanAction:
      additionalProperties: false
      properties:
        action:
          enum:
            - create_plan
          type: string
          x-enum-varnames:
            - CreatePlan
        body:
          $ref: '#/components/schemas/AutoBYOCDeploymentPlanRequest'
      required:
        - action
        - body
      type: object
    AutoBYOCCustomerActivityQueryResult:
      additionalProperties: false
      properties:
        query:
          enum:
            - activity
          type: string
          x-enum-varnames:
            - Activity
        result:
          $ref: '#/components/schemas/AutoBYOCCustomerDeploymentActivityListResponse'
      required:
        - query
        - result
      type: object
    AutoBYOCCustomerApplyPlanActionResult:
      additionalProperties: false
      properties:
        action:
          enum:
            - apply_plan
          type: string
          x-enum-varnames:
            - ApplyPlan
        result:
          $ref: '#/components/schemas/AutoBYOCCustomerDeploymentApplyResponse'
      required:
        - action
        - result
      type: object
    AutoBYOCCustomerApplyQueryResult:
      additionalProperties: false
      properties:
        query:
          enum:
            - apply
          type: string
          x-enum-varnames:
            - Apply
        result:
          $ref: '#/components/schemas/AutoBYOCCustomerDeploymentApplyResponse'
      required:
        - query
        - result
      type: object
    AutoBYOCCustomerConfigurationHistoryQueryResult:
      additionalProperties: false
      properties:
        query:
          enum:
            - configuration_history
          type: string
          x-enum-varnames:
            - ConfigurationHistory
        result:
          $ref: '#/components/schemas/AutoBYOCCustomerDeploymentConfigurationHistoryResponse'
      required:
        - query
        - result
      type: object
    AutoBYOCCustomerConfigurationQueryResult:
      additionalProperties: false
      properties:
        query:
          enum:
            - configuration
          type: string
          x-enum-varnames:
            - Configuration
        result:
          $ref: '#/components/schemas/AutoBYOCCustomerDeploymentConfigurationStateResponse'
      required:
        - query
        - result
      type: object
    AutoBYOCCustomerCreatePlanActionResult:
      additionalProperties: false
      properties:
        action:
          enum:
            - create_plan
          type: string
          x-enum-varnames:
            - CreatePlan
        result:
          $ref: '#/components/schemas/AutoBYOCCustomerDeploymentPlanResponse'
      required:
        - action
        - result
      type: object
    AutoBYOCCustomerDeploymentActivity:
      additionalProperties: false
      properties:
        attempt:
          format: int32
          minimum: 1
          type: integer
        created_at:
          format: date-time
          type: string
        error:
          type: string
        error_code:
          type: string
        id:
          type: string
        kind:
          enum:
            - plan
            - apply
          type: string
          x-enum-varnames:
            - CustomerDeploymentActivityKindPlan
            - CustomerDeploymentActivityKindApply
        project_id:
          type: string
          x-go-name: ProjectID
        provider:
          maxLength: 32
          minLength: 1
          type: string
        region:
          type: string
        request_actor:
          $ref: '#/components/schemas/AutoBYOCCustomerDeploymentRequestActor'
        stage:
          enum:
            - foundation
            - base_infra
            - nomad_services
            - final_converge
            - infrastructure
            - services
            - upgrade
            - destroy
          type: string
          x-enum-varnames:
            - CustomerDeploymentActivityStageFoundation
            - CustomerDeploymentActivityStageBaseInfra
            - CustomerDeploymentActivityStageNomadServices
            - CustomerDeploymentActivityStageFinalConverge
            - CustomerDeploymentActivityStageInfrastructure
            - CustomerDeploymentActivityStageServices
            - CustomerDeploymentActivityStageUpgrade
            - CustomerDeploymentActivityStageDestroy
        status:
          enum:
            - pending
            - running
            - succeeded
            - failed
          type: string
          x-enum-varnames:
            - CustomerDeploymentActivityStatusPending
            - CustomerDeploymentActivityStatusRunning
            - CustomerDeploymentActivityStatusSucceeded
            - CustomerDeploymentActivityStatusFailed
        team_id:
          type: string
          x-go-name: TeamID
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - team_id
        - kind
        - stage
        - provider
        - project_id
        - region
        - status
        - attempt
        - created_at
        - updated_at
      type: object
    AutoBYOCCustomerDeploymentActivityListResponse:
      additionalProperties: false
      properties:
        activity:
          items:
            $ref: '#/components/schemas/AutoBYOCCustomerDeploymentActivity'
          maxItems: 100
          type: array
      required:
        - activity
      type: object
    AutoBYOCCustomerDeploymentApplyResponse:
      additionalProperties: false
      properties:
        actions:
          items:
            $ref: '#/components/schemas/AutoBYOCAction'
          maxItems: 4
          type: array
        attempt:
          description: Durable execution attempt for the current apply.
          format: int32
          minimum: 1
          type: integer
        created_at:
          format: date-time
          type: string
        error:
          description: Safe user-facing failure message; present when status is failed.
          maxLength: 1000
          minLength: 1
          type: string
        error_code:
          description: Stable machine-readable failure code; present when status is failed.
          maxLength: 100
          minLength: 1
          type: string
        id:
          format: uuid
          type: string
          x-go-type: string
        plan_digest:
          description: SHA-256 digest verified immediately before Terraform apply.
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        plan_id:
          format: uuid
          type: string
          x-go-name: PlanID
          x-go-type: string
        progress:
          description: Latest event per step of the current attempt, in first-seen order.
          items:
            $ref: '#/components/schemas/AutoBYOCDeploymentApplyProgressEvent'
          maxItems: 500
          type: array
        progress_summary:
          $ref: '#/components/schemas/AutoBYOCDeploymentApplyProgressSummary'
        release_id:
          description: Immutable packaged release that produced and applies the reviewed plan.
          maxLength: 200
          minLength: 1
          type: string
          x-go-name: ReleaseID
        request_actor:
          $ref: '#/components/schemas/AutoBYOCCustomerDeploymentRequestActor'
        resource_count:
          description: Managed resources observed in the resulting Terraform state.
          minimum: 0
          type: integer
        sandbox_domain:
          description: Sandbox domain captured from the deployment's Terraform state output. Absence means not recorded; this field does not assert DNS reachability or readiness.
          maxLength: 253
          type: string
        stage:
          enum:
            - foundation
            - base_infra
            - nomad_services
            - final_converge
            - infrastructure
            - services
            - upgrade
            - destroy
          type: string
          x-enum-varnames:
            - CustomerDeploymentApplyResponseStageFoundation
            - CustomerDeploymentApplyResponseStageBaseInfra
            - CustomerDeploymentApplyResponseStageNomadServices
            - CustomerDeploymentApplyResponseStageFinalConverge
            - CustomerDeploymentApplyResponseStageInfrastructure
            - CustomerDeploymentApplyResponseStageServices
            - CustomerDeploymentApplyResponseStageUpgrade
            - CustomerDeploymentApplyResponseStageDestroy
        status:
          description: Pending and running are non-terminal; succeeded and failed are terminal.
          enum:
            - pending
            - running
            - succeeded
            - failed
            - outcome_unknown
          type: string
          x-enum-varnames:
            - CustomerDeploymentApplyResponseStatusPending
            - CustomerDeploymentApplyResponseStatusRunning
            - CustomerDeploymentApplyResponseStatusSucceeded
            - CustomerDeploymentApplyResponseStatusFailed
            - CustomerDeploymentApplyResponseStatusOutcomeUnknown
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - plan_id
        - stage
        - status
        - attempt
        - release_id
        - plan_digest
        - created_at
        - updated_at
      type: object
    AutoBYOCCustomerDeploymentConfiguration:
      additionalProperties: false
      properties:
        customer_metrics:
          $ref: '#/components/schemas/AutoBYOCCustomerMetricsConfiguration'
        digest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        encryption:
          $ref: '#/components/schemas/AutoBYOCEncryptionConfiguration'
        gcp_api:
          allOf:
            - $ref: '#/components/schemas/AutoBYOCGCPAPIPool'
          nullable: true
          x-go-name: GCPAPI
        gcp_api_source:
          enum:
            - saved
            - release_default
            - unrecorded
          type: string
          x-enum-varnames:
            - CustomerAPISaved
            - CustomerAPIReleaseDefault
            - CustomerAPIUnrecorded
          x-go-name: GCPAPISource
        maintenance_window:
