            application/json:
              schema:
                $ref: '#/components/schemas/AutoBYOCCustomerProjectQueryResponse200'
          description: Operation result
        default:
          $ref: '#/components/responses/AutoBYOCForwardingErrorResponse'
      security:
        - AuthProviderBearerAuth: []
      tags:
        - workspace_clusters
  /v1/workspaces/{workspaceID}/credit:
    get:
