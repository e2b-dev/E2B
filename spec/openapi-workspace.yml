        - expired
      type: string
    InvitationViewer:
      description: How the signed-in caller relates to a pending invitation.
      properties:
        email:
          description: 'The caller''s own address: the one that matched for `can_accept` and `verification_required`, otherwise the account''s address. Absent when the account has none.'
          type: string
        state:
          description: '`can_accept`: one of the caller''s verified addresses is the invited one. `verification_required`: the caller has the invited address but has not verified it yet. `wrong_account`: none of the caller''s addresses is the invited one. Addresses are compared ignoring case and, on a domain that delivers every spelling to one inbox such as gmail.com, ignoring local-part dots and a plus tag, with googlemail.com as gmail.com.'
          enum:
            - can_accept
            - verification_required
            - wrong_account
          type: string
      required:
