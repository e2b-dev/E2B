      security:
        - AuthProviderBearerAuth: []
      tags:
        - workspace_clusters
  /v1/workspaces/{workspaceID}/clusters/{clusterID}:
    delete:
      description: Deletes a cluster whose deployment was removed or never started, and starts deleting every project on it. While AutoBYOC runs a teardown of the cluster's deployment that the owner approved, the request is accepted and the cluster and its projects are deleted once that teardown finishes; a failed teardown leaves the cluster listed. Refused while the deployment may otherwise still exist, or while a project on the cluster is provisioning, belongs to another workspace, or is banned. The cluster's control-plane registration is removed once its projects are torn down. Repeating the request after a partial failure completes it.
      operationId: deleteWorkspaceCluster
      parameters:
        - $ref: '#/components/parameters/workspaceID'
        - $ref: '#/components/parameters/workspaceClusterID'
      responses:
