    AutoBYOCDeploymentApplyProgressSummary:
      additionalProperties: false
      description: Authoritative counts for the current apply attempt. Terraform counts reconcile with the reviewed plan; post-Terraform steps enter the total when observed. A terminal failure without a failed progress event contributes one failed operation step.
      properties:
        attempt:
          format: int32
          minimum: 1
          type: integer
        completed:
          format: int32
          minimum: 0
          type: integer
        current_detail:
          description: Safe current runtime application status during GKE convergence. Present only while waiting.
          maxLength: 512
          minLength: 1
          type: string
        current_phase:
          description: Current durable operation context. worker_claimed with execution_state worker_starting means the runner is initializing or preparing the deployment before a later step or detailed event. While execution_state is converging, this is the most recent completed event or step phase and does not imply an event is still active.
          enum:
            - pending
            - worker_claimed
            - runtime_repository_access
            - terraform_apply
            - post_apply
            - orchestrator_convergence
            - register_cluster
            - deployment_smoke
            - provider_image_cleanup
            - persist_result
            - completed
          type: string
          x-enum-varnames:
            - DeploymentApplyProgressSummaryPhasePending
            - DeploymentApplyProgressSummaryPhaseWorkerClaimed
            - DeploymentApplyProgressSummaryPhaseRuntimeRepositoryAccess
            - DeploymentApplyProgressSummaryPhaseTerraformApply
            - DeploymentApplyProgressSummaryPhasePostApply
            - DeploymentApplyProgressSummaryPhaseOrchestratorConvergence
            - DeploymentApplyProgressSummaryPhaseRegisterCluster
            - DeploymentApplyProgressSummaryPhaseDeploymentSmoke
            - DeploymentApplyProgressSummaryPhaseProviderImageCleanup
            - DeploymentApplyProgressSummaryPhasePersistResult
            - DeploymentApplyProgressSummaryPhaseCompleted
        detail_truncated:
          description: True when progress omits older current-attempt events.
          type: boolean
        execution_state:
          description: Server-owned dispatch and worker execution state. queued has no active dispatch reservation; waiting_for_runner has one but no claim; worker_starting is claimed with no later durable step or detailed event; active has a running detailed event or later step; converging has detailed events but none still running. Clients must not derive this state from elapsed time or event timestamps.
          enum:
            - queued
            - waiting_for_runner
            - worker_starting
            - active
            - converging
            - succeeded
            - failed
          type: string
          x-enum-varnames:
            - DeploymentApplyProgressSummaryExecutionQueued
            - DeploymentApplyProgressSummaryExecutionWaitingForRunner
            - DeploymentApplyProgressSummaryExecutionWorkerStarting
            - DeploymentApplyProgressSummaryExecutionActive
            - DeploymentApplyProgressSummaryExecutionConverging
            - DeploymentApplyProgressSummaryExecutionSucceeded
            - DeploymentApplyProgressSummaryExecutionFailed
        failed:
          format: int32
          minimum: 0
          type: integer
        in_progress:
          format: int32
          minimum: 0
          type: integer
        not_started:
          format: int32
          minimum: 0
          type: integer
        total:
          format: int32
          minimum: 0
          type: integer
      required:
        - attempt
        - current_phase
        - execution_state
        - completed
        - in_progress
        - not_started
        - failed
        - total
        - detail_truncated
      type: object
