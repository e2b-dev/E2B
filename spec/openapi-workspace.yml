      required:
        - name
      type: object
    UsageBucket:
      properties:
        amount_usd:
          description: 'Exact non-negative decimal USD, without cent rounding. Sums corrected records at the price in force at each record''s period_start: the workspace''s agreed price for the meter if it has one, the meter price otherwise. Excludes credits, allowances, free-tier deductions and subscription or add-on fees. This is usage so far, not an invoice.'
          type: string
        period_end:
          description: |-
            The grain's own bounds, not the window's, so two reads over different windows describe a shared bucket identically. The first and last buckets of a window therefore extend past it; intersect them with the window for the part it covers.
            Both are carried because a month is not a fixed width.
          format: date-time
          type: string
        period_start:
          format: date-time
          type: string
        quantity:
          description: |-
            Gross consumption in this bucket: no credit applied, no allowance deducted, no free tier netted out.
            A string rather than a number, which is a double in every JSON parser, and a metered quantity that rounds bills wrong.
          type: string
