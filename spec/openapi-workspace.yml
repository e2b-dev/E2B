      description: 'A project member reaches this with project:read alone, so it is the only workspace-plane fact a grant holder can see: one owner''s email, the longest-standing owner''s, and nothing else about them or the roster. A caller needing the members lists the workspace instead.'
      operationId: getProjectWorkspaceOwnerContact
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceOwnerContact'
          description: The contact.
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
      security:
        - AuthProviderBearerAuth: []
      summary: How to reach one owner of the workspace holding the project.
      tags:
        - workspaces
    parameters:
      - $ref: '#/components/parameters/projectID'
  /v1/projects/by-slug/{slug}:
    get:
      description: |-
        The same resource as the read by id, addressed the way a dashboard URL addresses it. A slug is fixed for the project's lifetime, so the resolved slug-to-id pair may be cached for as long as the project lives; the capabilities in the response may not.
        Unlike an id, a slug is a guessable human-readable name, so the endpoint never confirms that one is taken: a slug no project carries and a slug carried by a project the caller cannot read both answer with the same 404.
      operationId: getProjectBySlug
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: The project carrying this slug.
        "401":
          $ref: '#/components/responses/401'
        "404":
          $ref: '#/components/responses/404'
      security:
        - AuthProviderBearerAuth: []
      summary: The project a slug names, for a client holding a slug-addressed URL.
      tags:
        - workspaces
    parameters:
      - $ref: '#/components/parameters/projectSlug'
  /v1/projects/catalog:
    get:
      description: |-
        Fetch this before starting the project creation flow: a project is pinned to a region for its lifetime and the choice is the caller's, so the form cannot be drawn until the options are known. The default is the one to preselect.
        Static enough to cache for the length of a session — regions are configuration, not state, and a region that is temporarily unhealthy still appears, because placement is decided at creation time.
      operationId: getCatalog
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
          description: Regions a project may be created in.
        "401":
          $ref: '#/components/responses/401'
      security:
        - AuthProviderBearerAuth: []
      summary: The placement options a project may be created in.
      tags:
        - workspaces
  /v1/users/{userID}/pii-region:
    get:
      description: The placement the identity provider reports at the moment of the call, named in this API's regions. For now only the user themselves may ask; a caller naming anyone else is refused, and the refusal consults nothing, so it reveals nothing about whether that user exists.
      operationId: getUserPIIRegion
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPIIRegion'
          description: The user's personal-data region.
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "500":
          $ref: '#/components/responses/500'
      security:
        - AuthProviderBearerAuth: []
      summary: Where a user's personal data is homed now.
      tags:
        - workspaces
    parameters:
      - $ref: '#/components/parameters/userID'
    put:
      description: 'The path names the user whose data moves, but for now only that user may ask: a caller naming anyone else is refused, and the refusal consults nothing, so it reveals nothing about whether that user exists. Idempotent, and asking for the region already occupied moves nothing. Carrying out the move is the provider''s job, so the response reports the placement the provider acknowledged rather than the one that was asked for.'
      operationId: setUserPIIRegion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserPIIRegionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPIIRegion'
          description: The user's personal-data region after the move.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "500":
          $ref: '#/components/responses/500'
      security:
        - AuthProviderBearerAuth: []
      summary: Move a user's personal data to another region.
      tags:
        - workspaces
  /v1/users/bootstrap:
    post:
      description: Idempotent. A signup interrupted part-way is finished by calling again, and a caller who already has an account gets it back. A subject linked to a user whose identity carries the canonical external ID returns without repeating provisioning work.
      operationId: bootstrapUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResult'
          description: The account, whether it was just created or already existed.
        "204":
          description: 'The subject is linked and its identity carries the canonical external ID. A banned user whose personal workspace or project is missing also gets 204: the subject is linked and nothing is created.'
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "409":
          $ref: '#/components/responses/409'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerBootstrapAuth: []
      summary: 'Turn the calling token''s subject into a usable account: a user and either a personal workspace with a first project or membership in the SSO workspace that adds them just in time.'
      tags:
        - workspaces
  /v1/workspaces:
    post:
      description: 'Answered 409 while a workspace the caller created and owns carries a hold other than a payment hold: error_code workspace_verification_pending for a verification hold, otherwise workspace_held. Until billing has set up the caller''s personal workspace and its holds have reached this service, the answer is 409 with error_code billing_not_ready; the same request succeeds shortly.'
      operationId: createWorkspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: Workspace created.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "409":
          $ref: '#/components/responses/409'
      security:
        - AuthProviderBearerAuth: []
      summary: Create a standard workspace with the caller as first owner.
      tags:
        - workspaces
  /v1/workspaces/{workspaceID}:
    delete:
      description: |-
        Answered 409 while the workspace still holds a project, including one still deleting: a project is billed and routed infrastructure, so it is moved to another workspace or deleted first, on its own route.
        A personal workspace is answered 409 too, and no route removes one: erasing its user leaves it behind, and its project cannot be moved out. A personal workspace is therefore permanent today.
        A held workspace is answered 409, unless its only hold is a missing payment method: error_code workspace_verification_pending for a verification hold, otherwise workspace_held. Billing is not asked.
        A workspace with a paid add-on that renews is answered 409 with error_code workspace_has_addons; end the add-on first. One already scheduled to end, or one E2B granted, does not block deletion. While a purchase of an add-on is still being paid for or applied, the answer is 409 with error_code purchase_pending; retry once it completes.
      operationId: deleteWorkspace
      responses:
        "204":
          description: Workspace is absent.
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Delete a standard workspace that holds no project.
      tags:
        - workspaces
    get:
      operationId: getWorkspace
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: Workspace.
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
      security:
        - AuthProviderBearerAuth: []
      tags:
        - workspaces
    parameters:
      - $ref: '#/components/parameters/workspaceID'
    patch:
      operationId: updateWorkspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: Updated workspace.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
      security:
        - AuthProviderBearerAuth: []
      summary: Update workspace-owned display data.
      tags:
        - workspaces
  /v1/workspaces/{workspaceID}/addons/end:
    parameters:
      - $ref: '#/components/parameters/workspaceID'
    post:
      description: Requires workspace:billing. Ends the paid add-on at the first of next month, 00:00 UTC. It keeps granting until then; no mid-period refund occurs. An add-on E2B granted is not ended here. Reuse the idempotency key for retries; reusing it for another add-on, or after the ending was cancelled, returns 400. Returns 409 with error_code workspace_addon_not_held when no paid add-on of that name is running without a scheduled end, and with plan_managed_by_e2b for an enterprise workspace whose billing_type is not metered.
      operationId: endWorkspaceAddon
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndWorkspaceAddonRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAddonEnding'
          description: Scheduled add-on ending, including an idempotent replay.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Schedule a paid workspace add-on to end.
      tags:
        - billing
  /v1/workspaces/{workspaceID}/addons/end/cancel:
    parameters:
      - $ref: '#/components/parameters/workspaceID'
    post:
      description: Requires workspace:billing. Reinstates the add-on scheduled to end; it keeps granting and the renewal keeps charging for it. Reuse the idempotency key for retries; reusing it for another add-on, or after the add-on was ended again, returns 400. Returns 409 with error_code no_addon_ending_scheduled when no ending of the add-on is scheduled, including one that already took effect, and with plan_managed_by_e2b for an enterprise workspace whose billing_type is not metered.
      operationId: cancelWorkspaceAddonEnding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelWorkspaceAddonEndingRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAddonEndingCancellation'
          description: Reinstated add-on, including an idempotent replay.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Cancel a workspace add-on's scheduled ending.
      tags:
        - billing
  /v1/workspaces/{workspaceID}/addons/quote:
    parameters:
      - $ref: '#/components/parameters/workspaceID'
    post:
      description: |-
        Requires workspace:billing. Records a quote without charging or granting the add-on. A workspace holds one of each add-on: one it already holds, scheduled to end or not, is answered 409 with error_code workspace_addon_held; cancel a scheduled ending instead of buying again. A matching open basket reuses its quote. Another basket replaces the open quote, or conflicts once that quote is being confirmed. Confirm the returned purchase ID on this workspace. The actor is resolved by the server.
        The price includes tax, so a workspace whose tax location the payment provider cannot work out is answered 409 with error_code tax_location_invalid and no quote.
      operationId: quoteWorkspaceAddonPurchase
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteWorkspaceAddonPurchaseRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAddonPurchaseQuote'
          description: Recorded purchase quote.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Quote a workspace add-on.
      tags:
        - billing
  /v1/workspaces/{workspaceID}/billing-address:
    get:
      description: |-
        Requires `workspace:billing`. Read from the payment provider on every call and stored nowhere in E2B. Invoices print it, and tax is worked out from it ahead of any card's billing details.
        A workspace with no address is answered 200 without billing_address; tax then comes from the default card. name is the one invoices are addressed to, answered with or without an address.
        409 when the workspace's billing account is not provisioned.
      operationId: getWorkspaceBillingAddress
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBillingAddress'
          description: The workspace's billing address, if it has one.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Read the postal address the workspace is billed at.
      tags:
        - billing
    parameters:
      - $ref: '#/components/parameters/workspaceID'
    put:
      description: |-
        Requires `workspace:billing`. Written to the payment provider only, field by field, so a field left out is cleared. The provider checks the address as it stores it: one it cannot place for tax is answered 409 with error_code tax_location_invalid and nothing changes. A name in the body is stored in the same write; left out or empty, the current name stays. The write is audited with the authenticated user as the actor, without the address or name.
        400 for a country that is not two letters, or a field or name over 200 characters. 409 when the billing account is not provisioned, and for any other refusal of the billing plane; the message says which.
      operationId: setWorkspaceBillingAddress
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetWorkspaceBillingAddressRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBillingAddress'
          description: The address now stored, trimmed and with the country uppercased, and the name this write stored.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Replace the postal address the workspace is billed at.
      tags:
        - billing
  /v1/workspaces/{workspaceID}/billing-email:
    get:
      description: |-
        The address as stored, which is the trimmed lowercase form rather than whatever was last supplied. Requires `workspace:billing`, the same grant the write below needs, because the address is billing correspondence.
        An account always holds one: opening an account requires an address and no operation clears it, so this reports an address or a reason there is no account to report for. A workspace whose billing account has not been opened yet is answered 409.
        Reading is not audited. The trail records who set the address, not who looked at it.
      operationId: getWorkspaceBillingEmail
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBillingContact'
          description: The address the workspace's billing account bills to.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Read the address the workspace is billed at.
      tags:
        - billing
    parameters:
      - $ref: '#/components/parameters/workspaceID'
    put:
      description: |-
        The one address billing writes to for this workspace: invoices, credit warnings, and anything else its money produces. It is not a login, not a workspace member, and changing it moves no membership.
        Requires `workspace:billing`, which workspace ownership grants. A workspace member without it is answered 403.
        The address is trimmed and stored lowercase, so setting the same address in a different case reports `unchanged` and writes nothing. Replacing is the only edit: one address is held, and there is no operation here that clears it. Anything that is not a single unspaced address around one `@` is answered 400; no further shape is checked, and nothing is sent to the address to prove it exists.
        A workspace whose billing account has not been opened yet is answered 409. Nothing is queued and no provider is told: this writes the address and audits who wrote it.
      operationId: setWorkspaceBillingEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetWorkspaceBillingEmailRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBillingEmail'
          description: The address now stored, and whether this call stored it.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Set the address the workspace is billed at.
      tags:
        - billing
  /v1/workspaces/{workspaceID}/billing-terms:
    get:
      description: |-
        Whether the workspace is an enterprise customer, how its usage is billed this month, and how its invoices are collected: charged automatically or sent with a due date, and which payment methods they accept. Requires `workspace:billing`.
        A workspace whose billing account has not been opened yet is answered 409; a closed account still reports its terms. Reading is not audited.
      operationId: getWorkspaceBillingTerms
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBillingTerms'
          description: How the workspace is billed and collected from.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Read how the workspace is billed and how its invoices are collected.
      tags:
        - billing
    parameters:
      - $ref: '#/components/parameters/workspaceID'
  /v1/workspaces/{workspaceID}/clusters:
