        - default_payment_method
        - payment_method_not_found
        - billing_account_closed
        - billing_account_inactive
        - verification_not_required
        - verification_payment_processing
        - quote_outdated
        - purchase_pending
        - already_on_plan
        - plan_managed_by_e2b
        - addons_block_downgrade
        - downgrade_scheduled
        - no_downgrade_scheduled
        - addon_quantity_changed
        - no_addon_ending_scheduled
        - workspace_addon_held
        - workspace_addon_not_held
        - purchase_refused
        - subscription_renewing
        - payment_method_type_not_accepted
        - invitation_not_found
        - invitation_not_pending
