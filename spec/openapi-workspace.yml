    InvitationPreviewStatus:
      description: Where the invitation stands. Only a pending invitation can be accepted; every other status means its link no longer works.
      enum:
        - pending
        - expired
        - accepted
        - revoked
        - superseded
      type: string
    InvitationStatus:
      description: Expired is a pending invitation past its expiry; it can be resent.
      enum:
