  /v1/workspaces/{workspaceID}/usage:
    get:
      description: |-
        Requires workspace:billing, granted to workspace owners, not members.
        Each project's usage covers only the hours it was in this workspace: usage recorded while it was in another workspace is left out, since that workspace was charged for it. A project the workspace held at any time in the window is listed, with its hours here, even if it has since moved out or been deleted.
        Both bounds are optional; omitting both reads the workspace's full usage history up to now. The resolved window is included in the response.
        Usage arrives asynchronously and completeness is not reported. Quantities and amounts represent usage received so far, not an invoice or final charge. Credits and subscription/add-on fees are excluded.
        Any unpriced record fails the entire read with 500.
      operationId: getWorkspaceUsage
      parameters:
        - description: Absent, the window begins where the workspace's usage does.
          in: query
          name: period_start
          required: false
          schema:
            format: date-time
            type: string
        - description: Absent, the window runs up to now. Given with period_start, it must be after it.
          in: query
          name: period_end
          required: false
          schema:
            format: date-time
            type: string
        - in: query
          name: grain
          required: false
          schema:
            $ref: '#/components/schemas/Grain'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceUsage'
          description: The workspace's usage over the window.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Gross usage quantities and rated costs by project, meter and bucket.
      tags:
        - billing
    parameters:
      - $ref: '#/components/parameters/workspaceID'
  /v1/workspaces/{workspaceID}/verification-payment:
    parameters:
      - $ref: '#/components/parameters/workspaceID'
    post:
      description: |-
        Requires `workspace:billing`.
        A workspace whose `block_reasons` carry `verification` runs nothing until a card deposit is paid. This opens that deposit: a fixed-amount Stripe PaymentIntent on the workspace's billing customer, card only, saved for off-session charging so the card becomes the workspace's first payment method. The client confirms it with Stripe Elements from the client secret. Nothing is lifted here: the paid deposit reaches the billing plane through the provider's webhook, which releases the block, credits the deposit to the workspace, and updates `block_reasons` on the workspace shortly after. Poll the workspace for the block to clear.
        Calling it again answers the same open deposit, not a second one, until that deposit is paid; then the call is refused while the webhook settles it, and the client should poll the workspace instead. The client secret lets its holder pay the deposit for this workspace; do not log it.
        409 when the workspace is not held for verification, a paid deposit is still settling, the billing account is closed, or it is not provisioned.
      operationId: createWorkspaceVerificationPayment
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationPayment'
          description: The deposit to confirm on the client.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Open the card deposit that lifts the workspace's verification block.
      tags:
        - billing
