    MeterPrice:
      properties:
        effective_at:
          description: When the price took effect. The first entry's can precede the window; every later one falls inside it.
          format: date-time
          type: string
        unit_amount_usd:
          description: 'Non-negative decimal USD per unit of quantity. "0" for a meter that is not charged. Exact, except for vcpu_seconds of a workspace billed on the CPU time it used: that meter is priced per hour, and its hourly price is given here per second, rounded to 20 fractional digits. A bucket''s amount_usd is the charged amount either way; quantity times a rounded price can differ from it in the last digits.'
          type: string
      required:
        - effective_at
        - unit_amount_usd
      type: object
    MeterUsage:
      properties:
        buckets:
          description: |-
            One entry per bucket of the grain that has usage, in order. A bucket with none is absent rather than zero; buckets are regular, so a gap is unambiguous.
            They are disjoint and cover the window, so summing them gives the window's total at any grain.
          items:
            $ref: '#/components/schemas/UsageBucket'
          type: array
        meter:
          description: 'What the quantity measures. Not an enum: the set of meters belongs to the plane that records usage, and one added there would otherwise be dropped here rather than shown.'
          type: string
        prices:
          description: |-
            The unit prices the buckets were rated at, oldest first: the price in force when the window opens, then one entry per change of price before it closes. An entry prices every usage record that starts at or after its effective_at and before the next entry's. The same for every project on this meter.
            A bucket spanning a change holds usage rated at both prices, so its amount_usd is not its quantity times either.
          items:
            $ref: '#/components/schemas/MeterPrice'
          type: array
      required:
        - meter
        - buckets
        - prices
      type: object
