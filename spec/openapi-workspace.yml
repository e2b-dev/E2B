  /v1/projects/{projectID}/spend-controls:
    get:
      description: Requires project:read, granted by membership of the project's current workspace or by a direct project-member grant. Authorization resolves the local project's current workspace on each read; an unknown local project returns 404. Updating controls requires project:spend_management. Reads the currently committed controls without mutation, a billing audit event, or spend evaluation. Null means disabled; missing controls return both amounts as null. Billing does not require an account, project residency, or a project record for this read. These are settings, not an enforcement verdict or calculated usage.
      operationId: getProjectSpendControls
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSpendControlsSnapshot'
          description: The current thresholds, with explicit nulls when disabled.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Read the project's configured spend limit and alert.
      tags:
        - billing
    parameters:
      - $ref: '#/components/parameters/projectID'
    patch:
      description: Requires project:spend_management, granted by ownership of the project's current workspace or by a direct project-owner grant. Workspace and project members are denied. Authorization resolves the local project's current workspace on each write; an unknown local project returns 404. Only supplied fields are changed; null clears a threshold and omission preserves it. The audit actor is the authenticated user, never supplied in the body. Changes are validated and audited atomically by billing-api. Missing controls are initialized lazily; no billing account or project residency is required. A conflict with an untouched stored threshold returns 409. Independent field edits preserve each other; same-field edits and delayed retries are last-writer-wins. Changed thresholds queue project spend evaluation atomically with the write; hold changes are asynchronous. Unchanged requests queue no evaluation. This operation sends no notification.
      operationId: updateProjectSpendControls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectSpendControlsRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSpendControls'
          description: The final and displaced thresholds; null amounts are disabled.
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
      security:
        - AuthProviderBearerAuth: []
      summary: Update the project's spend limit and alert.
      tags:
        - billing
  /v1/projects/{projectID}/storage-inventory-export:
    get:
      description: Requires project:read on the current project. Lists the project's snapshots and paused sandboxes with their sizes, from the global billing plane. Only a project in an enterprise workspace is exported; any other project, and a deployment without the global billing plane or without exports, answers unavailable. The first call of a day starts a paid export job and answers pending; poll until ready, then download from url. Repeat calls return the same export until the storage data is next rebuilt, about once a day. An inactive project returns 409. A billing plane this service cannot use returns 500; an unreachable one returns 503.
