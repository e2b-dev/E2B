packages:
  - packages/*

catalog:
  '@types/node': ^20.19.19
  '@typescript/native': npm:typescript@^7.0.2
  '@vitest/browser': ^4.1.11
  '@vitest/browser-playwright': ^4.1.11
  '@vitest/coverage-v8': ^4.1.11
  tsdown: ^0.22.14
  typescript: npm:@typescript/typescript6@^6.0.2
