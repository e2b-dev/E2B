name: Publish Packages

on:
  workflow_call:
    inputs:
      group:
        description: Release group to version and publish (see .github/scripts/release.cjs)
        required: true
        type: string
    secrets:
      PYPI_TOKEN:
        description: PyPI token for the group's Python package; omit for groups without one
        required: false
      VERSION_BUMPER_SECRET:
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Version and publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: app-token
        with:
          app-id: ${{ vars.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}

      - name: Checkout Repo
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        with:
          filename: '.tool-versions'
          uppercase: 'true'
          prefix: 'tool_version_'

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '${{ env.TOOL_VERSION_UV }}'
          python-version: '${{ env.TOOL_VERSION_PYTHON }}'
          enable-cache: true

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '${{ env.TOOL_VERSION_PNPM }}'

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '${{ env.TOOL_VERSION_NODEJS }}'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Configure pnpm
        run: |
          pnpm config set auto-install-peers true
          pnpm config set exclude-links-from-lockfile true

      - name: Update npm
        run: |
          npm install -g npm@^11.6
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create new versions
        id: version
        env:
          GROUP: ${{ inputs.group }}
        run: node .github/scripts/release.cjs version "$GROUP"

      - name: Commit new versions
        id: commit
        # Commit before publishing so the tags point at the commit that carries
        # the version bump (SDK-298). When no changeset names the group, the
        # versions are already committed and only their publish is outstanding.
        if: steps.version.outputs.versioned == 'true'
        env:
          GROUP: ${{ inputs.group }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # `add -A`, not `commit -a`: `changeset version` writes each package's
          # CHANGELOG.md as a new file the first time, which `-a` would drop.
          git add -A
          if git diff --cached --quiet; then
            echo "::error::'changeset version' produced no changes, so there is no version bump to publish or tag."
            exit 1
          fi
          git commit -m "[skip ci] Release ${GROUP}"

      - name: Push new versions
        # Push before publishing: the tags created below point at this commit,
        # and a version must stay reserved even if the publish then fails so a
        # later release cannot reuse it for different contents.
        if: steps.commit.outcome == 'success'
        run: |
          if ! git push; then
            # A PR merged mid-release. Merge rather than rebase: the tags are
            # created on this commit and rewriting it would strand them off the branch.
            git fetch origin "${GITHUB_REF_NAME}"
            git merge --no-edit FETCH_HEAD
            git push
          fi

      - name: Publish new versions
        env:
          GROUP: ${{ inputs.group }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: '' # See https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: node .github/scripts/release.cjs publish "$GROUP"
