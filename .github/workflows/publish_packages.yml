name: Publish Packages

on:
  workflow_call:
    secrets:
      E2B_API_KEY:
        required: true
      PYPI_TOKEN:
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Build and test SDK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}

      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@v2.1.1
        with:
          filename: '.tool-versions'
          uppercase: 'true'
          prefix: 'tool_version_'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '${{ env.TOOL_VERSION_UV }}'
          python-version: '${{ env.TOOL_VERSION_PYTHON }}'
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: '${{ env.TOOL_VERSION_PNPM }}'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '${{ env.TOOL_VERSION_NODEJS }}'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Configure pnpm
        run: |
          pnpm config set auto-install-peers true
          pnpm config set exclude-links-from-lockfile true

      - name: Update npm
        run: |
          npm install -g npm@^11.6
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create new versions
        run: pnpm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit new versions
        # Commit before publishing, because `changeset publish` tags whatever HEAD
        # it publishes from — tagging afterwards is what left every tag on the
        # commit before its own version bump (SDK-298). Nothing in the tree
        # references the artifacts about to be uploaded, so the commit is already
        # complete. It stays local until something is actually published, so a
        # publish that uploads nothing leaves the branch untouched and the
        # changesets intact for a re-run.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # `add -A`, not `commit -a`: `changeset version` writes each package's
          # CHANGELOG.md as a new file the first time, which `-a` would drop.
          git add -A
          if git diff --cached --quiet; then
            echo "::error::'changeset version' produced no changes, so there is no version bump to publish or tag."
            exit 1
          fi
          git commit -m "[skip ci] Release new versions"

      - name: Release new versions
        id: release
        uses: changesets/action@v1
        with:
          publish: pnpm run publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: "" # See https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Push new versions
        # `changeset publish` tags every package it uploads and the step above
        # pushes those tags immediately, so once anything is published the commit
        # they point at has to reach the branch — including when the publish then
        # failed partway (`published` is set before the non-zero exit propagates).
        # Skipped only when nothing was uploaded at all, which leaves the branch and
        # the changesets untouched for a clean re-dispatch.
        if: ${{ !cancelled() && (success() || steps.release.outputs.published == 'true') }}
        run: |
          RELEASE_SHA=$(git rev-parse HEAD)

          if git push; then
            exit 0
          fi

          # A PR merged mid-release, so this is no longer a fast-forward. Merge the
          # incoming commits in rather than rebasing — the release tags already
          # point at this commit, and rewriting it would strand them off the branch.
          git fetch origin "${GITHUB_REF_NAME}"
          if git merge --no-edit FETCH_HEAD && git push; then
            exit 0
          fi

          echo "::error::The packages are published and their tags point at ${RELEASE_SHA}, but '${GITHUB_REF_NAME}' could not be updated. Merge ${RELEASE_SHA} into '${GITHUB_REF_NAME}' by hand — do not rebase it, that would orphan the release tags."
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
