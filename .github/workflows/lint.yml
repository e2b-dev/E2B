name: Lint
permissions:
  contents: read

on:
  pull_request:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Filter changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          # `**/!(*.md)` excludes Markdown so docs-only changes don't trigger linting.
          filters: |
            code:
              - 'packages/**/!(*.md)'
              - 'spec/**/!(*.md)'
              - '.oxlintrc.json'
              - '.prettierrc'
              - '.prettierignore'
              - '.editorconfig'
              - 'pnpm-lock.yaml'
              - 'uv.lock'
              - 'pyproject.toml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.tool-versions'
              - '.github/workflows/lint.yml'

  lint:
    name: Lint
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        with:
          filename: '.tool-versions'
          uppercase: 'true'
          prefix: 'tool_version_'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '${{ env.TOOL_VERSION_PNPM }}'

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '${{ env.TOOL_VERSION_NODEJS }}'
          cache: pnpm

      - name: Configure pnpm
        run: |
          pnpm config set auto-install-peers true
          pnpm config set exclude-links-from-lockfile true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '${{ env.TOOL_VERSION_UV }}'
          python-version: '${{ env.TOOL_VERSION_PYTHON }}'
          enable-cache: true

      - name: Install Python dependencies
        run: |
          uv sync --locked --all-packages

      - name: Run linting
        run: |
          pnpm run lint

      - name: Run formatting
        run: |
          pnpm run format

      - name: Check for uncommitted changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "❌ Files are not formatted properly:"
            git status --short
            git diff
            exit 1
          else
            echo "✅ No changes detected."
          fi
