name: Release Code Interpreter SDK

# Releases `@e2b/code-interpreter` (npm) and `e2b-code-interpreter` (PyPI) from
# the changesets that name them.
# Sibling pipelines: release_e2b.yml, release_cli.yml, release_desktop.yml.

on:
  workflow_dispatch: {}

# Shared literal group so every production and candidate release on the same
# ref serializes: each pipeline pushes a version bump to main.
concurrency: release-${{ github.ref }}

permissions:
  id-token: write
  contents: write

jobs:
  preflight:
    name: Preflight
    uses: ./.github/workflows/release_preflight.yml
    with:
      group: code-interpreter

  js-tests:
    name: Code Interpreter JS SDK Tests
    needs: [preflight]
    if: contains(needs.preflight.outputs.packages, '"@e2b/code-interpreter"')
    uses: ./.github/workflows/code_interpreter_js_tests.yml
    secrets: inherit

  python-tests:
    name: Code Interpreter Python SDK Tests
    needs: [preflight]
    if: contains(needs.preflight.outputs.packages, '"@e2b/code-interpreter-python"')
    uses: ./.github/workflows/code_interpreter_python_tests.yml
    secrets: inherit

  publish:
    name: Publish
    needs: [preflight, js-tests, python-tests]
    if: (!cancelled()) && !contains(needs.*.result, 'failure') && needs.preflight.outputs.release == 'true'
    uses: ./.github/workflows/publish_packages.yml
    with:
      group: code-interpreter
    secrets:
      PYPI_TOKEN: ${{ secrets.CODE_INTERPRETER_PYPI_TOKEN }}
      VERSION_BUMPER_SECRET: ${{ secrets.VERSION_BUMPER_SECRET }}

  report-start:
    name: Release Started
    needs: [preflight]
    if: needs.preflight.outputs.release == 'true'
    uses: ./.github/workflows/release_notify.yml
    with:
      release: Code Interpreter SDK
      status: started
      itinerary: ${{ needs.preflight.outputs.itinerary }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  report-failure:
    name: Release Failed
    needs: [preflight, js-tests, python-tests, publish]
    if: failure()
    uses: ./.github/workflows/release_notify.yml
    with:
      release: Code Interpreter SDK
      status: failed
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  report-success:
    name: Release Succeeded
    needs: [preflight, publish]
    if: (!cancelled()) && needs.publish.result == 'success'
    uses: ./.github/workflows/release_notify.yml
    with:
      release: Code Interpreter SDK
      status: succeeded
      itinerary: ${{ needs.preflight.outputs.itinerary }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
