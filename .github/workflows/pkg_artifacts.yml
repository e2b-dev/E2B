name: Package Artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        with:
          filename: '.tool-versions'
          uppercase: 'true'
          prefix: 'tool_version_'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '${{ env.TOOL_VERSION_PNPM }}'

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '${{ env.TOOL_VERSION_NODEJS }}'
          cache: pnpm

      - name: Configure pnpm
        run: |
          pnpm config set auto-install-peers true
          pnpm config set exclude-links-from-lockfile true

      - name: Sanitize branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "BRANCH_ID=$(echo "$BRANCH" | sed 's/[^0-9A-Za-z-]/-/g')" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build JS SDK
        working-directory: packages/js-sdk
        run: pnpm run build

      - name: Build CLI
        working-directory: packages/cli
        run: pnpm run build

      - name: Build Code Interpreter JS SDK
        working-directory: packages/code-interpreter-js
        run: pnpm run build

      - name: Build Desktop JS SDK
        working-directory: packages/desktop-js
        run: pnpm run build

      # Before the SDK is renamed below: `pnpm pack` resolves the CLI's `workspace:^`
      # range to whatever version the workspace SDK has now, and a prerelease that
      # was never published would leave `e2b` unresolvable.
      - name: Pack CLI
        working-directory: packages/cli
        run: |
          pnpm version prerelease --preid=${{ env.BRANCH_ID }} --no-git-tag-version
          pnpm pack

      - name: Upload CLI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2b-cli
          path: packages/cli/*.tgz

      - name: Pack Code Interpreter JS SDK
        working-directory: packages/code-interpreter-js
        run: |
          pnpm version prerelease --preid=${{ env.BRANCH_ID }} --no-git-tag-version
          pnpm pack

      - name: Upload Code Interpreter JS SDK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2b-code-interpreter-js
          path: packages/code-interpreter-js/*.tgz

      - name: Pack Desktop JS SDK
        working-directory: packages/desktop-js
        run: |
          pnpm version prerelease --preid=${{ env.BRANCH_ID }} --no-git-tag-version
          pnpm pack

      - name: Upload Desktop JS SDK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2b-desktop-js
          path: packages/desktop-js/*.tgz

      # Independent of the CLI steps above: a CLI failure should still leave
      # reviewers a usable SDK tarball, as it did before the CLI moved ahead of it.
      - name: Pack JS SDK
        if: ${{ !cancelled() }}
        working-directory: packages/js-sdk
        run: |
          pnpm version prerelease --preid=${{ env.BRANCH_ID }} --no-git-tag-version
          pnpm pack

      - name: Upload JS SDK artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2b-js-sdk
          path: packages/js-sdk/*.tgz

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '${{ env.TOOL_VERSION_UV }}'
          python-version: '${{ env.TOOL_VERSION_PYTHON }}'
          enable-cache: true

      - name: Build Python SDK
        working-directory: packages/python-sdk
        run: |
          BASE_VERSION=$(uv version --short)
          uv version "${BASE_VERSION}+${BRANCH_ID}"
          uv build

      - name: Upload Python SDK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2b-python-sdk
          path: packages/python-sdk/dist/*

      - name: Build Code Interpreter Python SDK
        working-directory: packages/code-interpreter-python
        run: |
          BASE_VERSION=$(uv version --short)
          uv version "${BASE_VERSION}+${BRANCH_ID}"
          uv build

      - name: Upload Code Interpreter Python SDK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2b-code-interpreter-python
          path: packages/code-interpreter-python/dist/*

      - name: Build Desktop Python SDK
        working-directory: packages/desktop-python
        run: |
          BASE_VERSION=$(uv version --short)
          uv version "${BASE_VERSION}+${BRANCH_ID}"
          uv build

      - name: Upload Desktop Python SDK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2b-desktop-python
          path: packages/desktop-python/dist/*

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob

          artifact_basename() {
            if [ "$#" -ne 1 ]; then
              echo "Expected exactly one artifact, found $#" >&2
              return 1
            fi
            basename "$1"
          }

          JS_VERSION=$(node -p "require('./packages/js-sdk/package.json').version")
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          JS_TGZ=$(artifact_basename packages/js-sdk/*.tgz)
          CLI_TGZ=$(artifact_basename packages/cli/*.tgz)
          CODE_INTERPRETER_JS_VERSION=$(node -p "require('./packages/code-interpreter-js/package.json').version")
          CODE_INTERPRETER_JS_TGZ=$(artifact_basename packages/code-interpreter-js/*.tgz)
          DESKTOP_JS_VERSION=$(node -p "require('./packages/desktop-js/package.json').version")
          DESKTOP_JS_TGZ=$(artifact_basename packages/desktop-js/*.tgz)
          PY_VERSION=$(grep '^version' packages/python-sdk/pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          PY_WHL=$(artifact_basename packages/python-sdk/dist/*.whl)
          CODE_INTERPRETER_PY_VERSION=$(grep '^version' packages/code-interpreter-python/pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          CODE_INTERPRETER_PY_WHL=$(artifact_basename packages/code-interpreter-python/dist/*.whl)
          DESKTOP_PY_VERSION=$(grep '^version' packages/desktop-python/pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          DESKTOP_PY_WHL=$(artifact_basename packages/desktop-python/dist/*.whl)

          BODY="<!-- e2b-pkg-artifacts -->"$'\n'
          BODY+="### Package Artifacts"$'\n\n'
          BODY+="Built from ${GITHUB_SHA::7}. Download artifacts from [this workflow run](${RUN_URL})."$'\n\n'
          BODY+="**JS SDK** (\`e2b@${JS_VERSION}\`):"$'\n'
          BODY+='```sh'$'\n'
          BODY+="npm install ./${JS_TGZ}"$'\n'
          BODY+='```'$'\n\n'
          BODY+="**CLI** (\`@e2b/cli@${CLI_VERSION}\`):"$'\n'
          BODY+='```sh'$'\n'
          BODY+="npm install ./${CLI_TGZ}"$'\n'
          BODY+='```'$'\n\n'
          BODY+="**Code Interpreter JS SDK** (\`@e2b/code-interpreter@${CODE_INTERPRETER_JS_VERSION}\`):"$'\n'
          BODY+='```sh'$'\n'
          BODY+="npm install ./${CODE_INTERPRETER_JS_TGZ}"$'\n'
          BODY+='```'$'\n\n'
          BODY+="**Desktop JS SDK** (\`@e2b/desktop@${DESKTOP_JS_VERSION}\`):"$'\n'
          BODY+='```sh'$'\n'
          BODY+="npm install ./${DESKTOP_JS_TGZ}"$'\n'
          BODY+='```'$'\n\n'
          BODY+="**Python SDK** (\`e2b==${PY_VERSION}\`):"$'\n'
          BODY+='```sh'$'\n'
          BODY+="pip install ./${PY_WHL}"$'\n'
          BODY+='```'$'\n\n'
          BODY+="**Code Interpreter Python SDK** (\`e2b-code-interpreter==${CODE_INTERPRETER_PY_VERSION}\`):"$'\n'
          BODY+='```sh'$'\n'
          BODY+="pip install ./${CODE_INTERPRETER_PY_WHL}"$'\n'
          BODY+='```'$'\n\n'
          BODY+="**Desktop Python SDK** (\`e2b-desktop==${DESKTOP_PY_VERSION}\`):"$'\n'
          BODY+='```sh'$'\n'
          BODY+="pip install ./${DESKTOP_PY_WHL}"$'\n'
          BODY+='```'$'\n'

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '.[] | select(.body | contains("<!-- e2b-pkg-artifacts -->")) | .id' \
            | tail -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi
