name: Release CLI

# Releases `@e2b/cli` (npm) from the changesets that name it.
# Sibling pipelines: release_e2b.yml, release_code_interpreter.yml, release_desktop.yml.

on:
  workflow_dispatch: {}

# Shared literal group so every production and candidate release on the same
# ref serializes: each pipeline pushes a version bump to main.
concurrency: release-${{ github.ref }}

permissions:
  id-token: write
  contents: write

jobs:
  preflight:
    name: Preflight
    uses: ./.github/workflows/release_preflight.yml
    with:
      group: cli

  cli-tests:
    name: CLI Tests
    needs: [preflight]
    if: contains(needs.preflight.outputs.packages, '"@e2b/cli"')
    uses: ./.github/workflows/cli_tests.yml
    secrets: inherit

  publish:
    name: Publish
    needs: [preflight, cli-tests]
    if: (!cancelled()) && !contains(needs.*.result, 'failure') && needs.preflight.outputs.release == 'true'
    uses: ./.github/workflows/publish_packages.yml
    with:
      group: cli
    secrets:
      VERSION_BUMPER_SECRET: ${{ secrets.VERSION_BUMPER_SECRET }}

  report-start:
    name: Release Started
    needs: [preflight]
    if: needs.preflight.outputs.release == 'true'
    uses: ./.github/workflows/release_notify.yml
    with:
      release: CLI
      status: started
      itinerary: ${{ needs.preflight.outputs.itinerary }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  report-failure:
    name: Release Failed
    needs: [preflight, cli-tests, publish]
    if: failure()
    uses: ./.github/workflows/release_notify.yml
    with:
      release: CLI
      status: failed
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  report-success:
    name: Release Succeeded
    needs: [preflight, publish]
    if: (!cancelled()) && needs.publish.result == 'success'
    uses: ./.github/workflows/release_notify.yml
    with:
      release: CLI
      status: succeeded
      itinerary: ${{ needs.preflight.outputs.itinerary }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
