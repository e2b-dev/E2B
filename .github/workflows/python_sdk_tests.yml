name: Test Python SDK

on:
  workflow_call:
    inputs:
      E2B_DOMAIN:
        required: false
        type: string
        default: ''
      e2e:
        description: 'Run the e2e tier (provisions sandboxes and builds templates) instead of the mocked unit tier'
        required: false
        type: boolean
        default: false
    secrets:
      E2B_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  test:
    defaults:
      run:
        working-directory: ./packages/python-sdk
        shell: bash
    name: Python SDK - Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        with:
          filename: '.tool-versions'
          uppercase: 'true'
          prefix: 'tool_version_'

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '${{ env.TOOL_VERSION_UV }}'
          python-version: '${{ env.TOOL_VERSION_PYTHON }}'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Test build
        run: uv build

      # The default tier: fully mocked, no sandboxes, no credentials needed.
      - name: Run tests
        if: ${{ !inputs.e2e }}
        run: uv run pytest --verbose --numprocesses=4
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          E2B_DOMAIN: ${{ inputs.E2B_DOMAIN }}

      # The opt-in tier: real sandboxes, envd round-trips and template builds.
      - name: Run e2e tests
        if: ${{ inputs.e2e }}
        run: uv run pytest -m e2e --verbose --numprocesses=4
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          E2B_DOMAIN: ${{ inputs.E2B_DOMAIN }}
