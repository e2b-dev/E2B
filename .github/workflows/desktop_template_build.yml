name: Build Desktop Test Template

on:
  workflow_call:
    inputs:
      E2B_DOMAIN:
        required: false
        type: string
        default: ''
    secrets:
      E2B_API_KEY:
        required: true
    outputs:
      template:
        description: 'Name of the built test template'
        value: ${{ jobs.build.outputs.template }}

permissions:
  contents: read

jobs:
  build:
    defaults:
      run:
        working-directory: ./templates/desktop
    name: Desktop Template - Build
    runs-on: ubuntu-22.04
    outputs:
      template: ${{ steps.name.outputs.template }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        with:
          filename: '.tool-versions'
          uppercase: 'true'
          prefix: 'tool_version_'

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '${{ env.TOOL_VERSION_UV }}'
          python-version: '${{ env.TOOL_VERSION_PYTHON }}'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --project ../../packages/python-sdk

      # Unique per run attempt; exposed before the build so a failed build can
      # still be cleaned up by name.
      - name: Generate template name
        id: name
        run: echo "template=desktop-ci-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Build E2B template
        run: uv run --project ../../packages/python-sdk python build_ci.py
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          E2B_DOMAIN: ${{ inputs.E2B_DOMAIN }}
          E2B_TESTS_TEMPLATE: ${{ steps.name.outputs.template }}
