name: Test Code Interpreter JS SDK

on:
  workflow_call:
    inputs:
      E2B_DOMAIN:
        required: false
        type: string
        default: ''
      run_recovery_tests:
        required: false
        type: boolean
        default: true
      node-only:
        description: 'Run only the Node leg (skip Bun, Deno and Cloudflare)'
        required: false
        type: boolean
        default: false
      publish-results:
        required: false
        type: boolean
        default: false
    secrets:
      E2B_API_KEY:
        required: true
      OTEL_EXPORTER_OTLP_ENDPOINT:
        required: false
      OTEL_EXPORTER_OTLP_HEADERS:
        required: false

permissions:
  contents: read

jobs:
  test:
    defaults:
      run:
        working-directory: ./packages/code-interpreter-js
        shell: bash
    name: Code Interpreter JS SDK - ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      # With node-only (set by staging callers) the matrix collapses to the
      # Node leg: the other legs re-run the suite the Node leg already covers
      # and add sandbox load without extra backend signal, so the other
      # runtimes are exercised against production only.
      matrix:
        runtime: >-
          ${{ inputs.node-only
            && fromJSON('["node"]')
            || fromJSON('["node", "bun", "deno", "cloudflare"]') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        with:
          filename: '.tool-versions'
          uppercase: 'true'
          prefix: 'tool_version_'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '${{ env.TOOL_VERSION_PNPM }}'

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '${{ env.TOOL_VERSION_NODEJS }}'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure pnpm
        run: |
          pnpm config set auto-install-peers true
          pnpm config set exclude-links-from-lockfile true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build base JS SDK
        run: pnpm --dir ../js-sdk build

      - name: Test build
        run: pnpm build

      - name: Install Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 'v${{ env.TOOL_VERSION_DENO }}'

      # The recovery suites (interrupt, systemd) exercise sandbox recovery
      # paths that staging cannot serve, so callers can opt out of them.
      - name: Run test suite under ${{ matrix.runtime }}
        run: |
          case "${{ matrix.runtime }}" in
            node) script='test' ;;
            cloudflare) script='test:cf' ;;
            *) script='test:${{ matrix.runtime }}' ;;
          esac
          reporter_args=(--reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/sdk-test-results.xml")
          if [[ "${{ inputs.run_recovery_tests }}" == "true" ]]; then
            pnpm "$script" "${reporter_args[@]}"
          else
            pnpm "$script" "${reporter_args[@]}" --exclude tests/interrupt.test.ts --exclude tests/systemd.test.ts
          fi
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          E2B_DOMAIN: ${{ inputs.E2B_DOMAIN }}

      - name: Publish test results to Grafana
        if: ${{ always() && inputs.publish-results }}
        uses: ./.github/actions/publish-sdk-test-results
        with:
          results: ${{ runner.temp }}/sdk-test-results.xml
          environment: ${{ inputs.E2B_DOMAIN == '' && 'production' || 'staging' }}
          suite: code-interpreter-js
          runtime: ${{ matrix.runtime }}
          os: ${{ runner.os }}
          test-step-outcome: ${{ job.status }}
          otlp-endpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otlp-headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
