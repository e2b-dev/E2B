name: Test CLI

on:
  workflow_call:
    inputs:
      E2B_DOMAIN:
        required: false
        type: string
        default: ''
      publish-results:
        required: false
        type: boolean
        default: false
    secrets:
      E2B_API_KEY:
        required: true
      OTEL_EXPORTER_OTLP_ENDPOINT:
        required: false
      OTEL_EXPORTER_OTLP_HEADERS:
        required: false

permissions:
  contents: read

jobs:
  test:
    defaults:
      run:
        working-directory: ./packages/cli
        shell: bash
    name: CLI - Build (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        with:
          filename: '.tool-versions'
          uppercase: 'true'
          prefix: 'tool_version_'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '${{ env.TOOL_VERSION_PNPM }}'

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '${{ env.TOOL_VERSION_NODEJS }}'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure pnpm
        run: |
          pnpm config set auto-install-peers true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the SDK (pre-requisite for the tests)
        run: pnpm build
        working-directory: ./packages/js-sdk

      - name: Build the CLI
        run: pnpm build
        working-directory: ./packages/cli

      - name: Run tests
        id: tests
        run: pnpm test --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/sdk-test-results.xml"
        working-directory: ./packages/cli
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          E2B_DOMAIN: ${{ inputs.E2B_DOMAIN }}

      - name: Publish test results to Grafana
        if: ${{ always() && inputs.publish-results }}
        uses: ./.github/actions/publish-sdk-test-results
        with:
          results: ${{ runner.temp }}/sdk-test-results.xml
          environment: ${{ inputs.E2B_DOMAIN == '' && 'production' || 'staging' }}
          suite: cli
          runtime: node
          os: ${{ runner.os }}
          test-step-outcome: ${{ steps.tests.outcome }}
          otlp-endpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otlp-headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
