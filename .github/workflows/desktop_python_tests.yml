name: Test Desktop Python SDK

on:
  workflow_call:
    inputs:
      E2B_DOMAIN:
        required: false
        type: string
        default: ''
      run_tests:
        required: false
        type: boolean
        default: true
      publish-results:
        required: false
        type: boolean
        default: false
    secrets:
      E2B_API_KEY:
        required: true
      GRAFANA_LOKI_URL:
        required: false
      GRAFANA_LOKI_USER:
        required: false
      GRAFANA_CLOUD_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  test:
    defaults:
      run:
        working-directory: ./packages/desktop-python
        shell: bash
    name: Desktop Python SDK - Build and test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        with:
          filename: '.tool-versions'
          uppercase: 'true'
          prefix: 'tool_version_'

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '${{ env.TOOL_VERSION_UV }}'
          python-version: '${{ env.TOOL_VERSION_PYTHON }}'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --package e2b-desktop

      - name: Test build
        run: uv build

      - name: Run tests
        if: inputs.run_tests
        run: uv run pytest --verbose --numprocesses=4 --junitxml="$RUNNER_TEMP/sdk-test-results.xml"
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          E2B_DOMAIN: ${{ inputs.E2B_DOMAIN }}

      - name: Publish test results to Grafana
        if: ${{ always() && inputs.publish-results }}
        uses: ./.github/actions/publish-sdk-test-results
        with:
          results: ${{ runner.temp }}/sdk-test-results.xml
          environment: ${{ inputs.E2B_DOMAIN == '' && 'production' || 'staging' }}
          suite: desktop-python
          runtime: python
          os: ${{ runner.os }}
          test-step-outcome: ${{ job.status }}
          grafana-loki-url: ${{ secrets.GRAFANA_LOKI_URL }}
          grafana-loki-user: ${{ secrets.GRAFANA_LOKI_USER }}
          grafana-cloud-api-key: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
