[project]
name = "e2b-code-interpreter-tests"
version = "0.0.0"
description = "HTTP-level test suite for the E2B Code Interpreter template"
requires-python = ">=3.10"
dependencies = [
    "e2b>=2.32.0,<3",
    "httpx>=0.28.1,<1",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-dotenv>=0.5.2,<0.6",
    "pytest-xdist>=3.6.1,<4",
    "python-dotenv>=1.2.1,<2",
    "ruff>=0.11.12,<0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["--import-mode=importlib", "--numprocesses=2"]
pythonpath = ["."]
markers = [
    "skip_debug: skip when running against a local template server (E2B_DEBUG=true)",
]
